        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/dues-campaigns/{campaignId}:
    get:
      tags: [FIN]
      operationId: getDuesCampaign
      summary: Chi tiết đợt đóng quỹ (FR-FIN-09)
      description: |
        Ban chủ nhiệm. Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`, `CAMPAIGN_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Chi tiết đợt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesCampaignDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [FIN]
      operationId: updateDuesCampaign
      summary: Sửa tên, hạn, mức đóng (FR-FIN-09)
      description: |
        `RECORD_LEDGER`. Đợt đã đóng: 422 `CAMPAIGN_CLOSED` (BR-FIN-06). Đổi mức khi đã có người nộp: 422 `HAS_PAYMENTS`;
        mức mới áp cho người không miễn giảm và phải cao hơn mức sau giảm của người được giảm. Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CAMPAIGN_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `CAMPAIGN_CLOSED`, `HAS_PAYMENTS`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDuesCampaignRequest' }
      responses:
        '200':
          description: Đợt sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesCampaignDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/dues-campaigns/{campaignId}/items:
    get:
      tags: [FIN]
      operationId: listDuesItems
      summary: Người trong đợt đóng quỹ (FR-FIN-09)
      description: |
        Ban chủ nhiệm. Lọc theo tình trạng, tìm theo tên hoặc ban, sắp theo tên; trang mặc định 50.
        Lỗi: 400 `VALIDATION` (`status`); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CAMPAIGN_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DuesItemStatus' } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang người trong đợt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/dues-campaigns/{campaignId}/items/{itemId}/exemption:
    put:
      tags: [FIN]
      operationId: setDuesExemption
      summary: Miễn giảm cho một người (FR-FIN-09)
      description: |
        `RECORD_LEDGER`; đợt đang mở (422 `CAMPAIGN_CLOSED`). `NONE` trả về mức đầy đủ. `EXEMPT`, `REDUCED` cần lý do 5–500 ký
        tự; mức sau giảm từ 1 tới dưới mức đóng. Mức sau miễn giảm không thấp hơn số người đó đã nộp (422 `BELOW_PAID`).
        `version` là phiên bản của dòng. Thứ tự kiểm: 403, 409, 422 đợt đã đóng, 400, 422 thấp hơn số đã nộp.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `ITEM_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `CAMPAIGN_CLOSED`, `BELOW_PAID`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetExemptionRequest' }
      responses:
        '200':
          description: Dòng sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/dues-campaigns/{campaignId}/items/{itemId}/payments:
    post:
      tags: [FIN]
      operationId: recordDuesPayment
      summary: Xác nhận một người đã nộp quỹ (FR-FIN-10)
      description: |
        `RECORD_LEDGER`; đợt đang mở (422 `CAMPAIGN_CLOSED`); người đã nộp đủ hoặc được miễn: 422 `ALREADY_PAID`. Số tiền từ 1
        tới số còn thiếu; ngày nộp không sau hôm nay. `version` là phiên bản của dòng; lệch thì 409, nên bấm hai lần không sinh
        hai khoản thu (NFR-REL-01). Mỗi lần sinh một khoản thu Đã ghi sổ ở Quỹ chung, hạng mục `MEMBER_DUES`, nội dung có tên kỳ
        và họ tên; báo người nộp. Việc theo giờ nhắc người còn thiếu một lần khi còn 3 ngày tới hạn và một lần khi quá hạn
        (đợt đã đóng, người được miễn hoặc đã nộp đủ thì không nhắc). Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION` (`amount`, `paidOn`); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `ITEM_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `CAMPAIGN_CLOSED`, `ALREADY_PAID`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDuesPaymentRequest' }
      responses:
        '201':
          description: Dòng sau khi ghi nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/dues-campaigns/{campaignId}/closure:
    post:
      tags: [FIN]
      operationId: closeDuesCampaign
      summary: Đóng đợt đóng quỹ (FR-FIN-09)
      description: |
        `RECORD_LEDGER`. Sau khi đóng: không nhận thêm khoản nộp, không sửa (BR-FIN-06); người chưa nộp vẫn nằm trong báo cáo.
        Thứ tự kiểm: 403, 409, 422.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CAMPAIGN_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `CAMPAIGN_CLOSED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Đợt đã đóng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesCampaignDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/finance-report/periods:
    get:
      tags: [FIN]
      operationId: listFinanceReportPeriods
      summary: Các kỳ chọn được cho báo cáo thu chi (FR-FIN-12)
      description: |
        Ban chủ nhiệm. 12 tháng gần nhất; các học kỳ tính từ mốc `MM-DD` CLB khai (`semester1Start`, `semester2Start`,
        `summerStart`), mỗi kỳ tới hôm trước mốc kế tiếp, lùi về kỳ chứa ngày thành lập; các nhiệm kỳ của CLB. Mới nhất trước.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Các kỳ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPeriods' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/finance-report:
    get:
      tags: [FIN]
      operationId: getFinanceReport
      summary: Báo cáo thu chi (FR-FIN-12)
      description: |
        Ban chủ nhiệm. `period`: `MONTH`, `SEMESTER`, `TERM` kèm `key` lấy từ `/finance-report/periods`; `CUSTOM` kèm `from`, `to`
        (không đảo, tối đa 5 năm). Chỉ tính giao dịch Đã ghi sổ theo ngày phát sinh (BR-FIN-02); chuyển quỹ không tính vào thu
        chi; điều chỉnh mang hạng mục của giao dịch gốc. `category` (không gồm `FUND_TRANSFER`), `eventId` (sự kiện của CLB có
        quỹ) lọc kèm kỳ. `flagged`: khoản chi Đã ghi sổ do cùng một người duyệt và ghi sổ (R-01), kể cả khoản chi sinh khi ghi
        Đã ứng tạm ứng mà người duyệt tạm ứng cũng là người ghi Đã ứng. `overdueAdvanceCount`, `unpaidDuesCount` tính tại lúc xem.
        Lỗi: 400 `VALIDATION` (`period`, `key`, `from`, `to`, `category`, `eventId`); 403 `NOT_A_MEMBER`, `FORBIDDEN`;
        404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: period, in: query, required: true, schema: { type: string, enum: [MONTH, SEMESTER, TERM, CUSTOM] } }
        - { name: key, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/FinanceCategory' } }
        - { name: eventId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Báo cáo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/finance-report/unpaid-dues:
    get:
      tags: [FIN]
      operationId: listUnpaidDues
      summary: Người chưa nộp quỹ (FR-FIN-12)
      description: |
        Ban chủ nhiệm. Người còn thiếu ở các đợt đóng quỹ của CLB, cả đợt đã đóng; họ tên lúc mở đợt, số còn thiếu, cờ quá
        hạn. Sắp theo hạn rồi tên. `campaignId` không thuộc CLB: 400.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: campaignId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang người chưa nộp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnpaidDuesPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/funds/{fundId}/transitions:
    post:
      tags: [FIN]
      operationId: transitionFund
      summary: Quyết toán quỹ sự kiện (FR-FIN-11)
      description: |
        `SETTLE`: chỉ Thủ quỹ. Quỹ phải là quỹ sự kiện đang mở, sự kiện ở Đã kết thúc hoặc Đã hủy, không còn khoản chi hay
        điều chỉnh ở `PROPOSED`, `APPROVED` (422 `FUND_HAS_PENDING` kèm số khoản), không còn tạm ứng mở (`PROPOSED`, `APPROVED`,
        `DISBURSED`, `PARTIALLY_SETTLED`; 422 `FUND_HAS_OPEN_ADVANCES` kèm số khoản, kiểm trước khoản chờ duyệt). Số dư lớn hơn 0 thì ghi một giao dịch
        `TRANSFER` (hạng mục `FUND_TRANSFER`) sang Quỹ chung; quỹ sang `SETTLED`. Sự kiện giữ nguyên trạng thái; sự kiện
        Đã kết thúc từ đây đóng được (`CLOSE`). Quỹ của sự kiện đồng tổ chức thuộc CLB chủ trì (BR-FIN-07).
        `shares` (không bắt buộc): mỗi khoản cho một CLB đang đồng tổ chức (`FundDetail.coHosts`), số nguyên dương, ghi chú
        tối đa 200 ký tự, không lặp CLB (400 theo ô `shares[i].…`); tổng không vượt số dư (422 `SHARE_EXCEEDS_BALANCE`,
        BR-FIN-08). Mỗi khoản ghi thành khoản chi Đã ghi sổ hạng mục `CO_HOST_SHARE` trước, rồi phần còn lại mới chuyển về
        Quỹ chung; ban chủ nhiệm CLB nhận khoản chia được báo. Thứ tự kiểm: 403, 409, 422 điều kiện quỹ, 400 khoản chia,
        422 vượt số dư.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `FUND_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION`, `FUND_SETTLED`, `FUND_HAS_OPEN_ADVANCES`, `FUND_HAS_PENDING`, `SHARE_EXCEEDS_BALANCE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/FundId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FundTransitionRequest' }
      responses:
        '200':
          description: Quỹ sau khi quyết toán.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/transactions:
    get:
      tags: [FIN]
      operationId: listTransactions
      summary: Sổ quỹ và các khoản thu chi (FR-FIN-06)
      description: |
        Máy chủ lọc theo quyền từng dòng: giao dịch Đã ghi sổ hiện cho người xem được quỹ (chuyển quỹ hiện ở cả hai quỹ);
        khoản chưa ghi sổ chỉ ban chủ nhiệm, người tạo, và Trưởng BTC với quỹ sự kiện của mình.
        Sắp theo `occurredOn` giảm dần (khoản chưa ghi sổ dùng ngày tạo), trùng ngày thì theo thời điểm ghi sổ.
        `flow` tính theo quỹ `fundId` đang lọc.

        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `FUND_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: fundId
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: Lặp lại tham số để lọc nhiều trạng thái.
          schema:
            type: array
            items: { $ref: '#/components/schemas/TransactionStatus' }
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/TransactionType' }
          style: form
          explode: true
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/FinanceCategory' }
        - name: from
          in: query
          description: Từ ngày (theo `occurredOn`), tính cả ngày này.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Đến ngày, tính cả ngày này.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Q'
        - name: mine
          in: query
          description: Chỉ các khoản người gọi đã tạo.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang giao dịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [FIN]
      operationId: createTransaction
      summary: Ghi khoản thu, đề xuất chi, tạo điều chỉnh (FR-FIN-01, 02, 05)
      description: |
        `INCOME`: chỉ Thủ quỹ; quỹ phải đang mở; hạng mục thu; `occurredOn` không sau hôm nay. Ghi thẳng vào Đã ghi sổ.
        `EXPENSE`: ban chủ nhiệm (mọi quỹ), Trưởng ban, Phó ban (Quỹ chung), Trưởng BTC (quỹ sự kiện của mình); hạng mục chi;
        trên ngưỡng `receiptThreshold` của quỹ phải có chứng từ (BR-FIN-03, lỗi ở ô `attachmentIds`). Tạo ở `PROPOSED` và
        báo ban chủ nhiệm trừ người đề xuất (FR-NOT-02).
        `ADJUSTMENT`: chỉ Thủ quỹ; `originalTransactionId` là giao dịch Đã ghi sổ của cùng quỹ, không phải chuyển quỹ
        (422 `INVALID_ORIGINAL`); `direction` bắt buộc; `description` là lý do, 5–200 ký tự; hạng mục lấy theo giao dịch gốc
        (BR-FIN-01). Tăng quỹ (`IN`) ghi sổ ngay; giảm quỹ (`OUT`) tạo ở `PROPOSED` và báo ban chủ nhiệm.
        Số tiền nguyên dương, tối đa 1.000.000.000 (BR-FIN-04); nội dung 3–200 ký tự; tối đa 5 chứng từ, mỗi chứng từ
        do chính người gọi tải lên qua `/transaction-attachments` của CLB này và chưa dùng ở giao dịch khác.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `FUND_NOT_FOUND`.
        - 422 `FUND_SETTLED`, `INVALID_ORIGINAL`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
      responses:
        '201':
          description: Giao dịch mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/transactions/{transactionId}:
    get:
      tags: [FIN]
      operationId: getTransaction
      summary: Chi tiết giao dịch
      description: |
        Kiểm tra quyền mỗi lần mở (BR-SEC-02), cùng luật xem như danh sách.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN` (kèm lý do); 404 `TRANSACTION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TransactionId'
        - name: fundId
          in: query
          description: Quỹ người xem đang mở; `flow` tính theo quỹ này (chuyển quỹ là `IN` khi xem từ quỹ nhận).
          schema: { type: string }
      responses:
        '200':
          description: Chi tiết giao dịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/transactions/{transactionId}/transitions:
    post:
      tags: [FIN]
      operationId: transitionTransaction
      summary: Rút, duyệt, từ chối, ghi sổ, hủy khoản chi và điều chỉnh giảm quỹ (FR-FIN-02..05)
      description: |
        ST-EXP. Kiểm tra theo thứ tự: quyền (403), `version` (409), trạng thái (422), dữ liệu (400).
        Điều chỉnh giảm quỹ đi cùng luật rút, duyệt, từ chối; duyệt xong thì tự ghi sổ (không có bước `POST`), kiểm số dư
        lúc duyệt (422 `INSUFFICIENT_FUNDS`), người ghi sổ là Thủ quỹ đã tạo điều chỉnh.
        `allowedActions` có `ADJUST` khi người gọi là Thủ quỹ và giao dịch đã ghi sổ, không phải chuyển quỹ, quỹ đang mở.
        - `WITHDRAW`: chỉ người đề xuất, khi còn `PROPOSED`.
        - `APPROVE`, `REJECT`: thành viên ban chủ nhiệm khác người đề xuất, kể cả Chủ nhiệm (BR-ACL-01, 403 `SELF_APPROVAL`);
          khi còn `PROPOSED`. `REJECT` bắt buộc lý do 5–500 ký tự. Duyệt khoản trên ngưỡng mà thiếu chứng từ: 422 `RECEIPT_REQUIRED`.
        - `POST`: Thủ quỹ, khoản chi `APPROVED`. Vượt số dư hiện có của quỹ: 422 `INSUFFICIENT_FUNDS`, `detail` nêu số dư
          còn lại (BR-FIN-08). `occurredOn` là ngày ghi sổ.
        - `CANCEL`: người đề xuất hoặc ban chủ nhiệm, khoản chi `APPROVED` (chưa ghi sổ); bắt buộc lý do 5–500 ký tự.
          Khoản sang `CANCELLED`, không còn chặn quyết toán quỹ sự kiện (`FUND_HAS_PENDING`).

        Thông báo (FR-NOT-02): khoản chi được duyệt thì báo người đề xuất và Thủ quỹ (khoản chờ ghi sổ); từ chối báo người đề xuất
        kèm lý do; ghi sổ báo người đề xuất; hủy báo người đề xuất, người duyệt và Thủ quỹ kèm lý do, trừ người hủy. Điều chỉnh giảm quỹ: khi tạo thì báo ban chủ nhiệm trừ người tạo; duyệt (đã ghi sổ)
        hoặc từ chối chỉ báo Thủ quỹ đã tạo, không có thông báo chờ ghi sổ.
        Duyệt điều chỉnh, ghi sổ khoản chi ở quỹ đã quyết toán: 422 `FUND_SETTLED`.

        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`, `SELF_APPROVAL`; 404 `TRANSACTION_NOT_FOUND`;
        409 `VERSION_CONFLICT`; 422 `INVALID_TRANSITION`, `RECEIPT_REQUIRED`, `INSUFFICIENT_FUNDS`, `FUND_SETTLED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionTransitionRequest' }
      responses:
        '200':
          description: Giao dịch sau khi chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/transaction-attachments:
    post:
      tags: [FIN]
      operationId: uploadTransactionAttachment
      summary: Tải chứng từ trước khi tạo giao dịch (IF-05)
      description: |
        Người ghi thu, chi được ở CLB (ban chủ nhiệm, Trưởng ban, Phó ban, Trưởng BTC). Máy chủ kiểm tra quyền trước khi
        đọc tệp. Chỉ JPG, PNG, PDF, DOCX, XLSX, PPTX, tối đa 15 MB.
        Lỗi: 400 `VALIDATION`, `INVALID_FILE`; 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '201':
          description: Tệp đã lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie phiên của Spring Session (HttpOnly). Web gửi mọi request với `credentials` là `include`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        CookieCsrfTokenRepository: máy chủ đặt cookie `XSRF-TOKEN`, web gửi lại giá trị đó trong header này với mọi
        request ghi (POST, PUT, PATCH). Sai hoặc thiếu thì 403 `CSRF`.
  parameters:
    ClubId:
      name: clubId
      in: path
      required: true
      description: CLB hiện hành; máy chủ chỉ trả dữ liệu của CLB này (BR-SEC-01).
      schema: { type: string }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string }
    PositionId:
      name: positionId
      in: path
      required: true
      schema: { type: string }
    TermId:
      name: termId
      in: path
      required: true
      schema: { type: string }
    HandoverId:
      name: handoverId
      in: path
      required: true
      schema: { type: string }
    BacklogItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    SubcommitteeId:
      name: subcommitteeId
      in: path
      required: true
      schema: { type: string }
    FundId:
      name: fundId
      in: path
      required: true
      schema: { type: string }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      description: Trang, bắt đầu từ 0.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Số bản ghi mỗi trang, tối đa 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Q:
      name: q
      in: query
      description: Từ khóa, không phân biệt hoa thường và dấu.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: 'Dạng `trường,asc|desc`, ví dụ `dueAt,asc`. Mock chưa dùng tham số này.'
      schema: { type: string }
    TaskStatusFilter:
      name: status
      in: query
      description: Lặp lại tham số để lọc nhiều trạng thái.
      schema:
        type: array
        items: { $ref: '#/components/schemas/TaskStatus' }
      style: form
      explode: true
    TaskPriorityFilter:
      name: priority
      in: query
      schema:
        type: array
        items: { $ref: '#/components/schemas/TaskPriority' }
      style: form
      explode: true
    TaskDueFilter:
      name: due
      in: query
      schema: { $ref: '#/components/schemas/DueFilter' }
    TaskEventFilter:
      name: eventId
      in: query
      schema: { type: string }
  responses:
    BadRequest:
      description: Dữ liệu sai định dạng hoặc thiếu; `errors` gắn lỗi vào từng ô (`code` thường là `VALIDATION`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Chưa đăng nhập hoặc hết phiên (`UNAUTHENTICATED`), hoặc sai thông tin đăng nhập.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Thiếu quyền hoặc sai token CSRF; `detail` nêu lý do bị từ chối (IF-01, FR-ORG-04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không có tài nguyên, hoặc người gọi không được biết là có.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Trùng dữ liệu, hoặc `version` lệch do người khác vừa sửa (`VERSION_CONFLICT`, NFR-REL-03).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Thao tác không hợp lệ với trạng thái hiện tại (ngoài bảng ST-*, vi phạm BR-*).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. `detail` là câu tiếng Việt hiện thẳng cho người dùng.
      required: [status, detail, code]
      properties:
        type:
          type: string
          default: 'about:blank'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Mã ổn định để web rẽ nhánh, ví dụ `VALIDATION`, `VERSION_CONFLICT`, `LAST_PRESIDENT`.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      description: Dạng trang kết quả của Spring Data.
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PersonRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string }
        fullName: { type: string }
    NullableDate:
      type: [string, 'null']
      format: date
    NullableDateTime:
      type: [string, 'null']
      format: date-time
    NullableString:
      type: [string, 'null']
    # Tài khoản
    MemberStatus:
      type: string
      description: ST-MEM. Chờ duyệt, Thử việc, Chính thức, Tạm nghỉ, Đã rời.
      enum: [PENDING, PROBATION, ACTIVE, ON_LEAVE, LEFT]
    ClubMembershipSummary:
      type: object
      required: [clubId, clubName, shortName, logoUrl, field, memberStatus, departmentName, positionTitles, memberCount]
      properties:
        clubId: { type: string }
        clubName: { type: string }
        shortName: { type: string }
        logoUrl: { $ref: '#/components/schemas/NullableString' }
        field: { type: string }
        memberStatus: { $ref: '#/components/schemas/MemberStatus' }
        departmentName: { $ref: '#/components/schemas/NullableString' }
        positionTitles:
          type: array
          items: { type: string }
        memberCount: { type: integer }
    StaffEventSummary:
      type: object
      description: Sự kiện người dùng đang làm BTC ở CLB mà họ không là thành viên (FR-ACC-06).
      required: [eventId, eventName, clubId, clubName, roleTitle]
      properties:
        eventId: { type: string }
        eventName: { type: string }
        clubId: { type: string }
        clubName: { type: string }
        roleTitle: { type: string }
    CurrentUser:
      type: object
      required: [id, fullName, email, avatarUrl, accountType, memberships, staffEvents]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { $ref: '#/components/schemas/NullableString' }
        accountType:
          type: string
          enum: [USER, ADMIN]
          description: '`ADMIN` chỉ dùng khu `/admin`; mọi route `/clubs/**`, `/invitations/**` trả 403 `ADMIN_ACCOUNT` (SRS 3.4, NFR-SEC-06).'
        memberships:
          type: array
          items: { $ref: '#/components/schemas/ClubMembershipSummary' }
        staffEvents:
          type: array
          items: { $ref: '#/components/schemas/StaffEventSummary' }
    AccountStatus:
      type: string
      description: ST-ACC.
      enum: [PENDING_VERIFICATION, ACTIVE, LOCKED]
    AdminAccount:
      type: object
      required: [id, fullName, email, status, accountType, createdAt, lastLoginAt, clubCount, lockReason, lockedAt, allowedActions, version]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/AccountStatus' }
        accountType:
          type: string
          enum: [USER, ADMIN]
        createdAt: { type: string, format: date-time }
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        clubCount: { type: integer, minimum: 0, description: Số CLB đang có tư cách hoạt động; không nêu tên CLB. }
        lockReason: { $ref: '#/components/schemas/NullableString' }
        lockedAt:
          type: [string, 'null']
          format: date-time
        allowedActions:
          type: array
          items:
            type: string
            enum: [LOCK, UNLOCK, SEND_PASSWORD_RESET]
        version: { type: integer }
    AdminAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdminAccount' }
    AccountTransitionRequest:
      type: object
      required: [action, reason, version]
      properties:
        action:
          type: string
          enum: [LOCK, UNLOCK]
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer }
    PermissionKey:
      type: string
      enum: [CONFIGURE_CLUB, MANAGE_TERMS, MANAGE_DEPARTMENTS, ASSIGN_POSITIONS, EDIT_PERMISSIONS, MANAGE_MEMBERS, CREATE_EVENT, APPROVE_EVENT, RUN_EVENT, MANAGE_EVENT_STAFF, ASSIGN_TASK, MANAGE_SESSIONS, SEND_ANNOUNCEMENT, PROPOSE_EXPENSE, APPROVE_EXPENSE, RECORD_LEDGER]
    PermissionMatrixCell:
      type: object
      required: [role, permission, enabled, defaultEnabled, state, lockReason]
      properties:
        role: { $ref: '#/components/schemas/PositionRole' }
        permission: { $ref: '#/components/schemas/PermissionKey' }
        enabled: { type: boolean }
        defaultEnabled: { type: boolean }
        state:
          type: string
          enum: [EDITABLE, LOCKED, OWN_ROLE, NOT_APPLICABLE]
        lockReason: { $ref: '#/components/schemas/NullableString' }
    PermissionMatrix:
      type: object
      required: [roles, permissions, cells, changedFromDefault, updatedAt, updatedBy, allowedActions, version]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/PositionRole' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionKey' }
        cells:
          type: array
          items: { $ref: '#/components/schemas/PermissionMatrixCell' }
        changedFromDefault: { type: integer }
        updatedAt:
          type: [string, 'null']
          format: date-time
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        allowedActions:
          type: array
          items: { type: string, enum: [EDIT, RESET] }
        version: { type: integer }
    UpdatePermissionMatrixRequest:
      type: object
      required: [changes, version]
      properties:
        changes:
          type: array
          description: Mỗi ô (`role`, `permission`) xuất hiện tối đa một lần; ô lặp trả 400.
          minItems: 1
          maxItems: 112
          items:
            type: object
            required: [role, permission, enabled]
            properties:
              role: { $ref: '#/components/schemas/PositionRole' }
              permission: { $ref: '#/components/schemas/PermissionKey' }
              enabled: { type: boolean }
        version: { type: integer }
    PermissionMatrixChange:
      type: object
      required: [id, at, actor, role, permission, before, after, reset]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        role: { $ref: '#/components/schemas/PositionRole' }
        permission: { $ref: '#/components/schemas/PermissionKey' }
        before: { type: boolean }
        after: { type: boolean }
        reset: { type: boolean, description: Đổi do khôi phục mặc định. }
    PermissionMatrixChangePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PermissionMatrixChange' }
    TransferRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    BoardActivityCheck:
      type: object
      required: [boardInactive, inactiveDays, lastBoardLoginAt, checkedAt]
      properties:
        boardInactive: { type: boolean }
        inactiveDays: { type: integer, description: Số ngày không đăng nhập để coi là không hoạt động (tham số hệ thống). }
        lastBoardLoginAt:
          type: [string, 'null']
          format: date-time
        checkedAt: { type: string, format: date-time }
    MemberTransferRequest:
      type: object
      required: [id, status, requester, mine, reason, createdAt, handledAt, decisionNote, newPresident, allowedActions, version]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferRequestStatus' }
        requester: { $ref: '#/components/schemas/PersonRef' }
        mine: { type: boolean }
        reason: { $ref: '#/components/schemas/NullableString' }
        createdAt: { type: string, format: date-time }
        handledAt:
          type: [string, 'null']
          format: date-time
        decisionNote: { $ref: '#/components/schemas/NullableString' }
        newPresident:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        allowedActions:
          type: array
          items: { type: string, enum: [CANCEL] }
        version: { type: integer }
    PresidencyTransferOverview:
      type: object
      required: [boardInactive, inactiveDays, request, allowedActions]
      properties:
        boardInactive: { type: boolean }
        inactiveDays: { type: integer }
        request:
          oneOf:
            - $ref: '#/components/schemas/MemberTransferRequest'
            - type: 'null'
        allowedActions:
          type: array
          items: { type: string, enum: [REQUEST] }
    AdminTransferRequest:
      type: object
      required: [id, club, requester, reason, status, createdAt, checkAtRequest, checkNow, handledBy, handledAt, newPresident, decisionNote, allowedActions, version]
      properties:
        id: { type: string }
        club:
          type: object
          required: [id, name, shortName]
          properties:
            id: { type: string }
            name: { type: string }
            shortName: { type: string }
        requester: { $ref: '#/components/schemas/PersonRef' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/TransferRequestStatus' }
        createdAt: { type: string, format: date-time }
        checkAtRequest: { $ref: '#/components/schemas/BoardActivityCheck' }
        checkNow:
          oneOf:
            - $ref: '#/components/schemas/BoardActivityCheck'
            - type: 'null'
        handledBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        handledAt:
          type: [string, 'null']
          format: date-time
        newPresident:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decisionNote: { $ref: '#/components/schemas/NullableString' }
        allowedActions:
          type: array
          items: { type: string, enum: [DECIDE] }
        version: { type: integer }
    AdminTransferRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdminTransferRequest' }
    TransferCandidate:
      type: object
      required: [id, fullName, departmentName, joinedOn]
      properties:
        id: { type: string }
        fullName: { type: string }
        departmentName: { $ref: '#/components/schemas/NullableString' }
        joinedOn:
          type: [string, 'null']
          format: date
    TransferDecisionRequest:
      type: object
      required: [action, note, version]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
        newPresidentId:
          type: string
          description: Bắt buộc khi duyệt.
        note: { type: string, minLength: 5, maxLength: 1000 }
        version: { type: integer }
    AdminMetrics:
      type: object
      required: [clubCount, accounts, activeLast30Days, pendingTransferRequests, systemErrorsLast24h, generatedAt]
      properties:
        clubCount: { type: integer }
        accounts:
          type: object
          description: Số tài khoản người dùng (không tính Admin) theo trạng thái.
          required: [PENDING_VERIFICATION, ACTIVE, LOCKED]
          properties:
            PENDING_VERIFICATION: { type: integer }
            ACTIVE: { type: integer }
            LOCKED: { type: integer }
        activeLast30Days: { type: integer }
        pendingTransferRequests: { type: integer }
        systemErrorsLast24h: { type: integer }
        generatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    RegisterResponse:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Profile:
      type: object
      description: Hồ sơ cá nhân dùng chung cho mọi CLB (FR-ACC-05).
      required: [fullName, email, pendingEmail, phone, birthDate, avatarUrl, version]
      properties:
        fullName: { type: string }
        email:
          type: string
          format: email
          description: Email đăng nhập hiện tại.
        pendingEmail:
          type: [string, 'null']
          format: email
          description: Email mới chờ xác thực.
        phone: { $ref: '#/components/schemas/NullableString' }
        birthDate: { $ref: '#/components/schemas/NullableDate' }
        avatarUrl: { $ref: '#/components/schemas/NullableString' }
        version: { type: integer }
    UpdateProfileRequest:
      type: object
      required: [fullName, phone, birthDate, version]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        phone:
          type: [string, 'null']
          pattern: '^0\d{9}$'
        birthDate: { $ref: '#/components/schemas/NullableDate' }
        version: { type: integer }
    EmailChangeRequest:
      type: object
      required: [newEmail, currentPassword]
      properties:
        newEmail: { type: string, format: email }
        currentPassword: { type: string, format: password }
    EmailChangeReceipt:
      type: object
      required: [pendingEmail]
      properties:
        pendingEmail: { type: string, format: email }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
    # CLB
    ClubAction:
      type: string
      description: |
        Hành động cấp CLB máy chủ cho phép người đang xem. `ASSIGN_PRESIDENCY`: gán được chức Chủ nhiệm, Phó chủ nhiệm
        (chỉ Chủ nhiệm, Phó chủ nhiệm đang giữ chức). `EDIT_CLUB`: sửa hồ sơ CLB (ban chủ nhiệm, FR-CLB-02).
        `SEND_ANNOUNCEMENT`: có ít nhất một nhóm nhận thông báo trong phạm vi chức vụ (FR-NOT-01).
        `CREATE_TERM`: khai báo được nhiệm kỳ mới (ban chủ nhiệm, nhiệm kỳ hiện tại Đang chạy, chưa có nhiệm kỳ Chuẩn bị; FR-TERM-01).
        `ASSIGN_POSITION`: gán được chức vụ thường trực mới (ban chủ nhiệm, nhiệm kỳ Đang chạy và chưa quá ngày kết thúc, không
        đang bàn giao; FR-ORG-02, FR-TERM-03).
        `REQUEST_PRESIDENCY_TRANSFER`: thành viên Chính thức, mọi người giữ chức ban chủ nhiệm không đăng nhập quá 30 ngày và CLB
        chưa có yêu cầu chuyển quyền chờ xử lý (FR-ACC-08).
        `VIEW_PERMISSIONS`: thuộc ban chủ nhiệm, xem được bảng phân quyền (FR-ORG-05).
        `VIEW_SHARED_EVENTS`: thuộc ban chủ nhiệm, xem và trả lời lời mời đồng tổ chức ở tab Sự kiện chung (FR-EVT-08).
        `VIEW_DUES`: thuộc ban chủ nhiệm, xem tab Đóng quỹ (FR-FIN-09). `OPEN_DUES`: ban chủ nhiệm có `RECORD_LEDGER`, mở đợt đóng quỹ.
        `VIEW_FINANCE_REPORT`: thuộc ban chủ nhiệm, xem tab Báo cáo thu chi (FR-FIN-12).
      enum: [CREATE_EVENT, PROPOSE_EVENT, ASSIGN_TASK, MANAGE_MEMBERS, MANAGE_ORG, ASSIGN_PRESIDENCY, EDIT_CLUB, SEND_ANNOUNCEMENT, CREATE_TERM, ASSIGN_POSITION, REQUEST_PRESIDENCY_TRANSFER, VIEW_PERMISSIONS, VIEW_SHARED_EVENTS, VIEW_DUES, OPEN_DUES, VIEW_FINANCE_REPORT]
    TermSummary:
      type: object
      description: Nhiệm kỳ đang phụ trách CLB (Đang chạy hoặc Đang bàn giao).
      required: [id, name, startOn, endOn, status]
      properties:
        id: { type: string }
        name: { type: string }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/TermStatus' }
    ClubDetail:
      type: object
      required:
        - id
        - name
        - shortName
        - field
        - description
        - foundedOn
        - logoUrl
        - contactEmail
        - contactPhone
        - contactUrl
        - rules
        - collectsStudentId
        - memberCount
        - currentTermName
        - currentTerm
        - myPositionTitles
        - allowedActions
        - generalFundId
        - viewerRole
        - version
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
        field: { type: string }
        description: { type: string }
        foundedOn: { type: string, format: date }
        logoUrl: { $ref: '#/components/schemas/NullableString' }
        contactEmail: { $ref: '#/components/schemas/NullableString' }
        contactPhone: { $ref: '#/components/schemas/NullableString' }
        contactUrl:
          type: [string, 'null']
          description: Chỉ `http://` hoặc `https://`.
        rules:
          type: string
          description: Nội quy, văn bản thuần (không phải HTML); chuỗi rỗng là chưa có.
        collectsStudentId: { type: boolean }
        memberCount: { type: integer }
        currentTermName: { type: string }
        currentTerm:
          oneOf:
            - $ref: '#/components/schemas/TermSummary'
            - type: 'null'
        myPositionTitles:
          type: array
          items: { type: string }
        allowedActions:
          type: array
          items: { $ref: '#/components/schemas/ClubAction' }
        generalFundId:
          type: string
          description: Mỗi CLB có đúng một Quỹ chung (FR-FIN-06); khách của sự kiện nhận chuỗi rỗng.
        viewerRole:
          type: string
          enum: [MEMBER, EVENT_GUEST]
          description: '`EVENT_GUEST`: người ngoài CLB đang làm BTC một sự kiện của CLB; chỉ dùng được mục Sự kiện.'
        version: { type: integer }
    CreateClubRequest:
      type: object
      required: [name, shortName, field, description]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        shortName: { type: string, minLength: 2, maxLength: 10 }
        field: { type: string, minLength: 2, maxLength: 50 }
        description: { type: string, minLength: 10, maxLength: 1000 }
    UpdateClubRequest:
      allOf:
        - $ref: '#/components/schemas/CreateClubRequest'
        - type: object
          required: [contactEmail, contactPhone, contactUrl, rules, collectsStudentId, version]
          properties:
            contactEmail:
              type: [string, 'null']
              format: email
            contactPhone:
              type: [string, 'null']
              pattern: '^0\d{9,10}$'
            contactUrl:
              type: [string, 'null']
              maxLength: 200
              pattern: '^https?://'
            rules: { type: string, maxLength: 5000 }
            collectsStudentId: { type: boolean }
            version: { type: integer }
    ClubSettingsValues:
      type: object
      required:
        - probationStep
        - inviteLinkDays
        - registrationCancelHours
        - rescheduleConfirmHours
        - attendanceLeadMinutes
        - attendanceQrRotateSeconds
        - taskReminderDays
        - expenseReceiptThreshold
        - advanceSettleDays
        - semester1Start
        - semester2Start
        - summerStart
      properties:
        probationStep: { type: boolean, description: Có bước Thử việc khi duyệt gia nhập. }
        inviteLinkDays: { type: integer, minimum: 1, maximum: 30, description: Số ngày liên kết mời còn hiệu lực. }
        registrationCancelHours: { type: integer, minimum: 0, maximum: 168, description: Người đã nhận chỗ hủy được tới trước giờ bắt đầu số giờ này (FR-EVT-13). }
        rescheduleConfirmHours: { type: integer, minimum: 1, maximum: 168, description: Số giờ để xác nhận lại khi sự kiện dời thời gian (FR-EVT-14). }
        attendanceLeadMinutes: { type: integer, minimum: 0, maximum: 120, description: Số phút mở điểm danh trước giờ bắt đầu (BR-ATT-02). }
        attendanceQrRotateSeconds: { type: integer, minimum: 10, maximum: 300, description: Chu kỳ đổi mã QR, tính bằng giây. }
        taskReminderDays: { type: integer, minimum: 0, maximum: 14, description: 'Nhắc việc trước hạn N ngày tính theo ngày lịch giờ Việt Nam: nhắc khi hạn rơi vào từ hôm nay đến hết N ngày tới (1 là từ đầu ngày trước hạn); 0 là không nhắc (FR-TASK-06, SRS 9.2).' }
        expenseReceiptThreshold: { type: integer, minimum: 0, maximum: 100000000, description: Khoản chi trên ngưỡng này phải có chứng từ (BR-FIN-03), VND. }
        advanceSettleDays: { type: integer, minimum: 1, maximum: 90, description: Hạn quyết toán tạm ứng gợi ý, tính từ ngày đề xuất (FR-FIN-07). }
        semester1Start:
          type: string
          pattern: '^\d{2}-\d{2}$'
          description: Ngày bắt đầu học kỳ 1 dạng `MM-DD` (ngày có thật, không nhận 02-29), dùng cho báo cáo thu chi (FR-FIN-12).
        semester2Start:
          type: string
          pattern: '^\d{2}-\d{2}$'
          description: Ngày bắt đầu học kỳ 2 dạng `MM-DD`, khác học kỳ 1.
        summerStart:
          type: [string, 'null']
          pattern: '^\d{2}-\d{2}$'
          description: Ngày bắt đầu kỳ hè dạng `MM-DD`, nằm sau học kỳ 2 và trước học kỳ 1 năm sau theo vòng năm; null là không tách kỳ hè.
    ClubSettings:
      allOf:
        - $ref: '#/components/schemas/ClubSettingsValues'
        - type: object
          required: [updatedAt, updatedBy, version]
          properties:
            updatedAt:
              type: [string, 'null']
              format: date-time
            updatedBy:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            version: { type: integer }
    UpdateClubSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/ClubSettingsValues'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    MyClubMembership:
      type: object
      description: Tư cách gần nhất của người đang xem ở CLB; `rejectionReason` chỉ có khi yêu cầu bị từ chối.
      required: [status, exitKind, rejectionReason]
      properties:
        status: { $ref: '#/components/schemas/MemberStatus' }
        exitKind:
          oneOf:
            - $ref: '#/components/schemas/MembershipExit'
            - type: 'null'
        rejectionReason: { $ref: '#/components/schemas/NullableString' }
    ClubDirectoryEntry:
      type: object
      description: Thông tin công khai trong danh bạ (SRS 3.5).
      required: [id, name, shortName, field, description, logoUrl, contactEmail, contactPhone, contactUrl, collectsStudentId, myMembership, allowedActions]
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
        field: { type: string }
        description: { type: string }
        logoUrl: { $ref: '#/components/schemas/NullableString' }
        contactEmail: { $ref: '#/components/schemas/NullableString' }
        contactPhone: { $ref: '#/components/schemas/NullableString' }
        contactUrl:
          type: [string, 'null']
          description: Chỉ `http://` hoặc `https://`.
        collectsStudentId: { type: boolean }
        myMembership:
          oneOf:
            - $ref: '#/components/schemas/MyClubMembership'
            - type: 'null'
        allowedActions:
          type: array
          items:
            type: string
            enum: [REQUEST_TO_JOIN]
    ClubDirectoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ClubDirectoryEntry' }
    # Thành viên
    MemberTransitionAction:
      type: string
      description: Chuyển trạng thái tư cách thành viên theo ST-MEM.
      enum: [APPROVE_PROBATION, APPROVE_ACTIVE, REJECT, CONFIRM, PUT_ON_LEAVE, RETURN, REMOVE]
    MemberAction:
      type: string
      description: |
        Chuyển trạng thái, cộng `ASSIGN_POSITION` khi ban chủ nhiệm xem thành viên Chính thức và CLB đang gán được chức vụ
        thường trực mới (không đang bàn giao, nhiệm kỳ chưa quá ngày kết thúc; FR-ORG-02). Người có trong kết quả bầu của phiên
        bàn giao đang mở thì không có `PUT_ON_LEAVE`. `EDIT_INFO` (FR-MEM-05) khi người xem có quyền quản lý thành viên và
        người được xem chưa rời CLB. `TRANSFER_DEPARTMENT` (FR-MEM-10) khi người xem có quyền quản lý thành viên và người được
        xem đang Thử việc, Chính thức hoặc Tạm nghỉ.
      enum: [APPROVE_PROBATION, APPROVE_ACTIVE, REJECT, CONFIRM, PUT_ON_LEAVE, RETURN, REMOVE, ASSIGN_POSITION, EDIT_INFO, TRANSFER_DEPARTMENT]
    DepartmentStint:
      type: object
      description: Một khoảng thuộc một ban chính; `toOn` là ngày cuối, `null` là đang thuộc (BR-MEM-06).
      required: [department, fromOn, toOn, changedBy]
      properties:
        department: { $ref: '#/components/schemas/DepartmentRef' }
        fromOn: { type: string, format: date }
        toOn: { $ref: '#/components/schemas/NullableDate' }
        changedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
    DepartmentTransferRequest:
      type: object
      required: [toDepartmentId, members]
      properties:
        toDepartmentId: { type: string }
        members:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [membershipId, version]
            properties:
              membershipId: { type: string }
              version: { type: integer }
    DepartmentTransferResult:
      type: object
      required: [toDepartment, members]
      properties:
        toDepartment: { $ref: '#/components/schemas/DepartmentRef' }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberSummary' }
    MemberInfoField:
      type: string
      description: Trường sửa được ở FR-MEM-05.
      enum: [displayTitle, internalNote, studentId, joinedOn]
    MemberInfoChange:
      type: object
      required: [at, actor, field, from, to]
      properties:
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        field: { $ref: '#/components/schemas/MemberInfoField' }
        from: { $ref: '#/components/schemas/NullableString' }
        to: { $ref: '#/components/schemas/NullableString' }
    UpdateMemberInfoRequest:
      type: object
      required: [displayTitle, internalNote, studentId, joinedOn, version]
      properties:
        displayTitle:
          type: [string, 'null']
          maxLength: 60
        internalNote:
          type: [string, 'null']
          maxLength: 1000
        studentId:
          type: [string, 'null']
          description: 5–20 chữ hoặc số; bị bỏ qua khi CLB không thu thập MSSV.
        joinedOn: { type: string, format: date }
        version: { type: integer }
    MembershipExit:
      type: string
      description: Cách tư cách kết thúc ở Đã rời.
      enum: [REJECTED, REMOVED, RESIGNED]
    MemberRoleFilter:
      type: string
      description: Chức vụ thường trực dùng để lọc; `NONE` là người không giữ chức vụ nào.
      enum: [PRESIDENT, VICE_PRESIDENT, TREASURER, DEPARTMENT_HEAD, DEPARTMENT_VICE_HEAD, NONE]
    DepartmentRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    MemberContact:
      type: object
      description: Chỉ ban chủ nhiệm nhận được (SRS 3.5).
      required: [email, phone]
      properties:
        email: { type: string, format: email }
        phone: { $ref: '#/components/schemas/NullableString' }
    MemberSummary:
      type: object
      required: [membershipId, person, status, department, positionTitles, displayTitle, joinedOn, contact, studentId, version]
      properties:
        membershipId: { type: string }
        person: { $ref: '#/components/schemas/PersonRef' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        department:
          oneOf:
            - $ref: '#/components/schemas/DepartmentRef'
            - type: 'null'
        positionTitles:
          type: array
          items: { type: string }
        displayTitle:
          type: [string, 'null']
          description: Chức danh hiển thị do ban chủ nhiệm đặt, khác chức vụ được gán; mọi thành viên cùng CLB xem được (SRS 3.5).
        joinedOn: { $ref: '#/components/schemas/NullableDate' }
        contact:
          oneOf:
            - $ref: '#/components/schemas/MemberContact'
            - type: 'null'
        studentId:
          type: [string, 'null']
          description: Chỉ ban chủ nhiệm của CLB có thu thập MSSV nhận được.
        version:
          type: integer
          description: Gửi kèm khi chuyển ban nhiều người từ danh sách (NFR-REL-03).
    MemberStatusChange:
      type: object
      required: [at, actor, fromStatus, toStatus, reason]
      properties:
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/MemberStatus'
            - type: 'null'
        toStatus: { $ref: '#/components/schemas/MemberStatus' }
        reason: { $ref: '#/components/schemas/NullableString' }
    PastMembership:
      type: object
      description: Lần sinh hoạt trước của cùng người ở CLB này (FR-MEM-03).
      required: [membershipId, joinedOn, leftOn, exitKind, reason, departmentName]
      properties:
        membershipId: { type: string }
        joinedOn: { $ref: '#/components/schemas/NullableDate' }
        leftOn: { $ref: '#/components/schemas/NullableDate' }
        exitKind:
          oneOf:
            - $ref: '#/components/schemas/MembershipExit'
            - type: 'null'
        reason: { $ref: '#/components/schemas/NullableString' }
        departmentName: { $ref: '#/components/schemas/NullableString' }
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          description: Từ `leftOn` đến `backlogCount` chỉ ban chủ nhiệm nhận được giá trị; người khác nhận `null`.
          required: [leftOn, exitKind, leaveReason, internalNote, infoHistory, history, pastMemberships, departmentHistory, backlogCount, allowedActions, version]
          properties:
            leftOn: { $ref: '#/components/schemas/NullableDate' }
            exitKind:
              oneOf:
                - $ref: '#/components/schemas/MembershipExit'
                - type: 'null'
            leaveReason: { $ref: '#/components/schemas/NullableString' }
            internalNote: { $ref: '#/components/schemas/NullableString' }
            infoHistory:
              type: [array, 'null']
              description: Lịch sử sửa thông tin (FR-MEM-05), mới nhất trước.
              items: { $ref: '#/components/schemas/MemberInfoChange' }
            history:
              type: [array, 'null']
              items: { $ref: '#/components/schemas/MemberStatusChange' }
            pastMemberships:
              type: [array, 'null']
              items: { $ref: '#/components/schemas/PastMembership' }
            departmentHistory:
              type: [array, 'null']
              description: Các ban chính đã qua, mới nhất trước (FR-MEM-10).
              items: { $ref: '#/components/schemas/DepartmentStint' }
            backlogCount:
              type: [integer, 'null']
              description: Số mục tồn đọng chưa xử lý (trạng thái `OPEN` của `GET /backlog-items`) sau khi bị đưa ra (FR-MEM-08, 09).
            allowedActions:
              type: array
              items: { $ref: '#/components/schemas/MemberAction' }
            version: { type: integer }
    JoinRequest:
      type: object
      required: [membershipId, applicant, contact, studentId, introduction, requestedAt, invitedBy, pastMemberships, allowedActions, version]
      properties:
        membershipId: { type: string }
        applicant: { $ref: '#/components/schemas/PersonRef' }
        contact: { $ref: '#/components/schemas/MemberContact' }
        studentId: { $ref: '#/components/schemas/NullableString' }
        introduction: { type: string }
        requestedAt: { type: string, format: date-time }
        invitedBy:
          description: Người tạo lời mời mà yêu cầu này đã dùng (FR-MEM-01); null nếu tự tìm đến CLB.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        pastMemberships:
          type: array
          items: { $ref: '#/components/schemas/PastMembership' }
        allowedActions:
          type: array
          description: '`APPROVE_PROBATION` chỉ có khi CLB bật bước thử việc (SRS 9.2).'
          items: { $ref: '#/components/schemas/MemberTransitionAction' }
        version: { type: integer }
    JoinRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/JoinRequest' }
    VersionOnly:
      type: object
      required: [version]
      properties:
        version: { type: integer }
    LeaveRequest:
      type: object
      description: Yêu cầu xin tạm nghỉ (FR-MEM-07). `CLOSED` khi ban chủ nhiệm đưa người gửi ra khỏi CLB trước khi duyệt.
      required: [id, membershipId, member, department, reason, status, createdAt, decidedBy, decidedAt, decisionNote, blockers, allowedActions, version]
      properties:
        id: { type: string }
        membershipId: { type: string }
        member: { $ref: '#/components/schemas/PersonRef' }
        department:
          oneOf:
            - $ref: '#/components/schemas/DepartmentRef'
            - type: 'null'
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, CLOSED] }
        createdAt: { type: string, format: date-time }
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { $ref: '#/components/schemas/NullableString' }
        blockers:
          type: array
          description: Lý do hiện tại chưa cho tạm nghỉ được (BR-MEM-05); máy chủ kiểm lại khi duyệt.
          items: { type: string }
        allowedActions:
          type: array
          description: Chỉ khi đang chờ, người xem có quyền quản lý thành viên và không phải người gửi.
          items: { type: string, enum: [APPROVE, REJECT] }
        version: { type: integer }
    LeaveRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/LeaveRequest' }
    LeaveDecisionRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [APPROVE, REJECT] }
        note: { type: string, description: Bắt buộc khi từ chối, 5–500 ký tự. }
        version: { type: integer }
    ResignBlocker:
      type: object
      description: |
        Khoản còn tồn khiến chưa tự rời CLB được (BR-MEM-03), kể cả chức trưởng tiểu ban và việc ở sự kiện chung mà người này
        tham gia với tư cách nhân sự CLB đồng tổ chức (FR-EVT-08).
      required: [kind, refId, clubId, title]
      properties:
        kind: { type: string, enum: [POSITION, TASK, TASK_REVIEW, ADVANCE, APPOINTMENT], description: '`ADVANCE`: tạm ứng còn mở do người này ứng, `refId` là mã tạm ứng.' }
        refId: { type: string }
        clubId: { type: string, description: 'CLB của khoản; việc, chức vụ ở sự kiện chung thuộc CLB chủ trì.' }
        title: { type: string }
    MyMembership:
      type: object
      required: [membershipId, status, department, joinedOn, leaveRequest, leaveBlockers, resignBlockers, allowedActions, version]
      properties:
        membershipId: { type: string }
        status: { $ref: '#/components/schemas/MemberStatus' }
        department:
          oneOf:
            - $ref: '#/components/schemas/DepartmentRef'
            - type: 'null'
        joinedOn: { $ref: '#/components/schemas/NullableDate' }
        leaveRequest:
          oneOf:
            - $ref: '#/components/schemas/LeaveRequest'
            - type: 'null'
        leaveBlockers:
          type: array
          items: { type: string }
        resignBlockers:
          type: array
          items: { $ref: '#/components/schemas/ResignBlocker' }
        allowedActions:
          type: array
          items: { type: string, enum: [REQUEST_LEAVE, WITHDRAW_LEAVE_REQUEST, RETURN, RESIGN] }
        version: { type: integer }
    MyMembershipTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [RETURN, RESIGN] }
        reason: { type: string, description: Bắt buộc khi xin rời, 5–500 ký tự. }
        version: { type: integer }
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/MemberSummary' }
    BacklogKind:
      type: string
      description: Việc đang làm, việc chờ người giao nghiệm thu, hoặc chức vụ cần người thay (FR-MEM-08).
      enum: [TASK, TASK_REVIEW, POSITION]
    BacklogStatus:
      type: string
      enum: [OPEN, RESOLVED]
    BacklogAction:
      type: string
      description: '`REASSIGN` cho việc; `APPOINT`, `DISMISS` cho chức vụ.'
      enum: [REASSIGN, APPOINT, DISMISS]
    BacklogItem:
      type: object
      required: [id, kind, formerMember, status, title, task, position, resolution, resolvedNote, appointBlockedReason, createdAt, allowedActions, version]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/BacklogKind' }
        formerMember: { $ref: '#/components/schemas/PersonRef' }
        status: { $ref: '#/components/schemas/BacklogStatus' }
        title: { type: string, description: Tên việc hoặc tên chức vụ. }
        task:
          oneOf:
            - type: object
              required: [scopeName, eventName, status, dueAt, overdue, counterpart]
              properties:
                scopeName: { type: string }
                eventName: { $ref: '#/components/schemas/NullableString' }
                status: { $ref: '#/components/schemas/TaskStatus' }
                dueAt: { type: string, format: date-time }
                overdue: { type: boolean }
                counterpart:
                  allOf: [{ $ref: '#/components/schemas/PersonRef' }]
                  description: Người giao (với việc đang làm) hoặc người làm (với việc chờ nghiệm thu).
            - type: 'null'
        position:
          oneOf:
            - type: object
              required: [role, scopeName, eventName]
              properties:
                role: { $ref: '#/components/schemas/PositionRole' }
                scopeName: { type: string }
                eventName: { $ref: '#/components/schemas/NullableString' }
            - type: 'null'
        resolution:
          oneOf:
            - type: object
              required: [action, person, reason, by, at]
              properties:
                action: { $ref: '#/components/schemas/BacklogAction' }
                person:
                  oneOf:
                    - $ref: '#/components/schemas/PersonRef'
                    - type: 'null'
                reason: { $ref: '#/components/schemas/NullableString' }
                by: { $ref: '#/components/schemas/PersonRef' }
                at: { type: string, format: date-time }
            - type: 'null'
        resolvedNote:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Vì sao mục tự thành đã xử lý khi không ai xử lý.
        appointBlockedReason:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Vì sao chưa chỉ định được người giữ chức thường trực lúc này (khi đó không có `APPOINT`).
        createdAt: { type: string, format: date-time }
        allowedActions:
          type: array
          items: { $ref: '#/components/schemas/BacklogAction' }
        version: { type: integer }
    BacklogItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/BacklogItem' }
    ResolveBacklogRequest:
      type: object
      required: [action, version]
      properties:
        action: { $ref: '#/components/schemas/BacklogAction' }
        userId: { type: string, description: Bắt buộc với `REASSIGN`, `APPOINT`. }
        reason: { type: string, description: 'Bắt buộc với `DISMISS`, 5–500 ký tự.' }
        version: { type: integer }
    MemberTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action: { $ref: '#/components/schemas/MemberTransitionAction' }
        version: { type: integer }
        reason:
          type: string
          description: Bắt buộc từ 5 ký tự với mọi thao tác trừ duyệt.
        departmentId:
          type: string
          description: Ban chính, bắt buộc khi duyệt.
    MemberFacets:
      type: object
      required: [departments, joinYears]
      properties:
        departments:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DepartmentRef'
              - type: object
                required: [closed]
                properties:
                  closed: { type: boolean }
        joinYears:
          type: array
          items: { type: integer }
    CreateJoinRequest:
      type: object
      required: [introduction]
      properties:
        introduction: { type: string, minLength: 10, maxLength: 500 }
        studentId:
          type: string
          pattern: '^[A-Za-z0-9]{5,20}$'
          description: Bắt buộc khi CLB thu thập MSSV.
        invitationToken:
          type: string
          description: Mã lời mời khi gửi từ trang lời mời (FR-MEM-01).
    InvitationKind:
      type: string
      description: '`LINK` dùng nhiều lần tới khi hết hạn; `EMAIL` dùng một lần, đúng tài khoản có email đó.'
      enum: [LINK, EMAIL]
    InvitationStatus:
      type: string
      description: Suy ra ở máy chủ theo thứ tự đã thu hồi, đã dùng (email), hết hạn; còn lại là còn hiệu lực.
      enum: [ACTIVE, EXPIRED, REVOKED, USED]
    Invitation:
      type: object
      required: [id, kind, token, email, status, createdBy, createdAt, expiresAt, revokedAt, revokedBy, useCount, allowedActions, version]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/InvitationKind' }
        token: { type: string, description: Chỉ người quản lý lời mời nhận; web ghép thành `/invite/{token}`. }
        email: { $ref: '#/components/schemas/NullableString' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        createdBy: { $ref: '#/components/schemas/PersonRef' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt:
          type: [string, 'null']
          format: date-time
        revokedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        useCount: { type: integer, minimum: 0 }
        allowedActions:
          type: array
          items: { type: string, enum: [REVOKE] }
        version: { type: integer }
    InvitationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Invitation' }
    CreateInvitationRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/InvitationKind' }
        email:
          type: string
          format: email
          maxLength: 254
          description: Bắt buộc khi `kind` là `EMAIL`.
    InvitationPreview:
      type: object
      required: [token, kind, status, club, invitedBy, expiresAt, myMembership, allowedActions]
      properties:
        token: { type: string }
        kind: { $ref: '#/components/schemas/InvitationKind' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        club:
          type: object
          description: Thông tin công khai như ở danh bạ (SRS 3.5).
          required: [id, name, shortName, field, description, logoUrl, contactEmail, contactPhone, contactUrl, collectsStudentId]
          properties:
            id: { type: string }
            name: { type: string }
            shortName: { type: string }
            field: { type: string }
            description: { type: string }
            logoUrl: { $ref: '#/components/schemas/NullableString' }
            contactEmail: { $ref: '#/components/schemas/NullableString' }
            contactPhone: { $ref: '#/components/schemas/NullableString' }
            contactUrl: { $ref: '#/components/schemas/NullableString' }
            collectsStudentId: { type: boolean }
        invitedBy: { $ref: '#/components/schemas/PersonRef' }
        expiresAt: { type: string, format: date-time }
        myMembership:
          oneOf:
            - $ref: '#/components/schemas/MyClubMembership'
            - type: 'null'
        allowedActions:
          type: array
          description: '`REQUEST_TO_JOIN` khi lời mời còn hiệu lực và người xem chưa có tư cách đang hoạt động (BR-MEM-01).'
          items: { type: string, enum: [REQUEST_TO_JOIN] }
    JoinRequestReceipt:
      type: object
      required: [membershipId, status, requestedAt]
      properties:
        membershipId: { type: string }
        status:
          type: string
          const: PENDING
        requestedAt: { type: string, format: date-time }
    # Cơ cấu
    PositionRole:
      type: string
      enum: [PRESIDENT, VICE_PRESIDENT, TREASURER, DEPARTMENT_HEAD, DEPARTMENT_VICE_HEAD, EVENT_LEAD, SUBCOMMITTEE_LEAD]
    StandingRole:
      type: string
      description: Chức vụ thường trực theo nhiệm kỳ, gán ở màn Cơ cấu; chức vụ sự kiện gán ở module Sự kiện.
      enum: [PRESIDENT, VICE_PRESIDENT, TREASURER, DEPARTMENT_HEAD, DEPARTMENT_VICE_HEAD]
    DepartmentStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    PositionScope:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [CLUB, DEPARTMENT, EVENT, SUBCOMMITTEE]
        id: { type: string }
        name: { type: string }
    Position:
      type: object
      required: [id, role, scope, holder, startOn, endOn, status, untilHandover, revokedOn, revokeReason, assignedBy, allowedActions, version]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/PositionRole' }
        scope: { $ref: '#/components/schemas/PositionScope' }
        holder: { $ref: '#/components/schemas/PersonRef' }
        startOn: { type: string, format: date }
        endOn:
          type: [string, 'null']
          format: date
          description: Ngày hiệu lực cuối; `null` với chức vụ sự kiện còn chạy.
        status:
          type: string
          enum: [UPCOMING, ACTIVE, ENDED]
          description: '`UPCOMING`: đã gán nhưng chưa tới ngày bắt đầu, ví dụ người nhận bàn giao; `ENDED`: đã qua ngày hiệu lực cuối (hết hạn hoặc bị thu hồi).'
        revokedOn:
          type: [string, 'null']
          format: date
          description: |
            Ngày thao tác thu hồi (kể cả do rời CLB, hoàn tất bàn giao); null là chưa từng bị thu hồi. Thu hồi hẹn ngày chuyển giao
            thì `status` vẫn có thể là `ACTIVE` tới hết `endOn`.
        revokeReason:
          description: Lý do thu hồi; chỉ ban chủ nhiệm nhận (SRS 3.5), người khác nhận null.
          $ref: '#/components/schemas/NullableString'
        untilHandover:
          type: boolean
          description: |
            Chức vụ thường trực đã qua `endOn` (ngày cuối nhiệm kỳ) nhưng nhiệm kỳ chưa đóng, nên còn hiệu lực tới khi bàn giao
            hoàn tất (BR-TERM-02).
        assignedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        allowedActions:
          type: array
          items:
            type: string
            enum: [REVOKE]
        version: { type: integer }
    PositionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Position' }
    Department:
      type: object
      required:
        - id
        - name
        - description
        - status
        - closedOn
        - closeReason
        - leads
        - memberCount
        - openTaskCount
        - overdueTaskCount
        - dueSoonTaskCount
        - allowedActions
        - version
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/DepartmentStatus' }
        closedOn: { $ref: '#/components/schemas/NullableDate' }
        closeReason: { $ref: '#/components/schemas/NullableString' }
        leads:
          type: array
          description: Trưởng ban, phó ban đang hoặc sắp có hiệu lực.
          items: { $ref: '#/components/schemas/Position' }
        memberCount: { type: integer }
        openTaskCount:
          type: integer
          description: Việc của ban chưa Hoàn thành hoặc Đã hủy.
        overdueTaskCount:
          type: integer
          description: Số việc quá hạn trong số việc mở (BR-TASK-03).
        dueSoonTaskCount:
          type: integer
          description: Số việc mở đang sắp đến hạn, cùng quy tắc `TaskSummary.dueSoon` (theo `taskReminderDays` của CLB); dùng cho badge sơ đồ CLB.
        allowedActions:
          type: array
          description: '`TRANSFER_MEMBERS` khi ban đang hoạt động còn thành viên và người xem có quyền quản lý thành viên (FR-MEM-10).'
          items:
            type: string
            enum: [EDIT, CLOSE, ASSIGN_POSITION, TRANSFER_MEMBERS]
        version: { type: integer }
    DepartmentRequest:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    UpdateDepartmentRequest:
      allOf:
        - $ref: '#/components/schemas/DepartmentRequest'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    CloseDepartmentRequest:
      type: object
      required: [action, reason, version]
      properties:
        action:
          type: string
          enum: [CLOSE]
        reason: { type: string, minLength: 5 }
        version: { type: integer }
    CreatePositionRequest:
      type: object
      required: [userId, role, scopeId, startOn, endOn]
      properties:
        userId: { type: string }
        role: { $ref: '#/components/schemas/StandingRole' }
        scopeId:
          type: string
          description: '`clubId` với chức vụ ban chủ nhiệm; id ban với trưởng, phó ban.'
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
    RevokePositionRequest:
      type: object
      required: [reason, handoverOn, version]
      properties:
        reason: { type: string, minLength: 5 }
        handoverOn:
          type: string
          format: date
          description: Ngày người mới nhận bàn giao; chức vụ cũ hết hiệu lực từ ngày này.
        version: { type: integer }
    PositionCandidate:
      allOf:
        - $ref: '#/components/schemas/PersonRef'
        - type: object
          required: [departmentName]
          properties:
            departmentName: { $ref: '#/components/schemas/NullableString' }
    # Nhiệm kỳ
    TermStatus:
      type: string
      description: ST-TERM. Chuẩn bị, Đang chạy, Đang bàn giao, Đã đóng.
      enum: [PREPARING, RUNNING, HANDING_OVER, CLOSED]
    DepartmentPlanEntry:
      type: object
      description: Một dòng trong kế hoạch ban của nhiệm kỳ Chuẩn bị (FR-TERM-01).
      required: [id, departmentId, name, description, dropped, currentName, memberCount, dropBlockedReason]
      properties:
        id: { type: string }
        departmentId:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Ban đang hoạt động được giữ hoặc bỏ; null là ban sẽ tạo mới khi hoàn tất bàn giao.
        name: { type: string }
        description: { type: string }
        dropped:
          type: boolean
          description: Ban sẽ chuyển Đã đóng khi hoàn tất bàn giao (BR-TERM-04).
        currentName:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Tên hiện tại của ban đã có; khác `name` là ban sẽ được đổi tên.
        memberCount:
          type: integer
          description: Số thành viên có ban chính là ban này.
        dropBlockedReason:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Lý do chưa bỏ được ban; null là bỏ được.
    Term:
      type: object
      required: [id, name, startOn, endOn, status, createdAt, createdBy, closedAt, departmentPlan, handoverId, handoverProgress, allowedActions, version]
      properties:
        id: { type: string }
        name: { type: string }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/TermStatus' }
        createdAt: { type: string, format: date-time }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        closedAt: { $ref: '#/components/schemas/NullableDateTime' }
        departmentPlan:
          description: Chỉ nhiệm kỳ Chuẩn bị mới có; các trạng thái khác là null.
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/DepartmentPlanEntry' }
            - type: 'null'
        handoverId:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Phiên bàn giao gần nhất mà nhiệm kỳ này là bên giao hoặc bên nhận.
        handoverProgress:
          description: Số mục bàn giao chờ và đã xác nhận, chỉ có khi phiên `handoverId` còn mở; mọi thành viên CLB xem được.
          oneOf:
            - $ref: '#/components/schemas/HandoverProgress'
            - type: 'null'
        allowedActions:
          type: array
          description: |
            `EDIT` và `START_HANDOVER` ở nhiệm kỳ Chuẩn bị cho ban chủ nhiệm (`START_HANDOVER` khi nhiệm kỳ hiện tại còn Đang chạy).
            `VIEW_HANDOVER` khi người xem mở được phiên bàn giao `handoverId`.
          items:
            type: string
            enum: [EDIT, START_HANDOVER, VIEW_HANDOVER]
        version: { type: integer }
    CreateTermRequest:
      type: object
      required: [name, startOn, endOn]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
    DepartmentPlanEntryRequest:
      type: object
      required: [id, departmentId, name, description, dropped]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Mã dòng đã có; null là dòng mới thêm.
        departmentId: { $ref: '#/components/schemas/NullableString' }
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        dropped: { type: boolean }
    UpdateTermRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
        departmentPlan:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DepartmentPlanEntryRequest' }
        version: { type: integer }
    HandoverStatus:
      type: string
      description: Đang mở hoặc đã hoàn tất.
      enum: [OPEN, COMPLETED]
    DepartmentOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name:
          type: string
          description: Tên ban theo kế hoạch của nhiệm kỳ mới.
    Appointment:
      type: object
      description: Một dòng kết quả bầu; chỉ thành chức vụ khi bàn giao hoàn tất (BR-TERM-02).
      required: [id, role, department, person, eligible, ineligibleReason]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/StandingRole' }
        department:
          oneOf:
            - $ref: '#/components/schemas/DepartmentOption'
            - type: 'null'
        person: { $ref: '#/components/schemas/PersonRef' }
        eligible:
          type: boolean
          description: Tính lại mỗi lần đọc; người được bầu có thể đã đổi trạng thái hoặc đổi ban.
        ineligibleReason: { $ref: '#/components/schemas/NullableString' }
    Handover:
      type: object
      required:
        - id
        - fromTerm
        - toTerm
        - status
        - startedAt
        - startedBy
        - completedAt
        - completedBy
        - appointments
        - departmentOptions
        - counts
        - blockers
        - completionPreview
        - allowedActions
        - version
      properties:
        id: { type: string }
        fromTerm: { $ref: '#/components/schemas/TermSummary' }
        toTerm: { $ref: '#/components/schemas/TermSummary' }
        status: { $ref: '#/components/schemas/HandoverStatus' }
        startedAt: { type: string, format: date-time }
        startedBy: { $ref: '#/components/schemas/PersonRef' }
        completedAt: { $ref: '#/components/schemas/NullableDateTime' }
        completedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        appointments:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        departmentOptions:
          type: array
          description: Ban được giữ trong kế hoạch của nhiệm kỳ mới; chỉ các ban này bầu trưởng, phó ban trước được.
          items: { $ref: '#/components/schemas/DepartmentOption' }
        counts: { $ref: '#/components/schemas/HandoverCounts' }
        blockers:
          type: array
          description: Lý do chưa hoàn tất được (BR-ORG-02, BR-TERM-01, BR-TERM-03, BR-TERM-04); rỗng là đủ điều kiện.
          items: { type: string }
        completionPreview:
          description: Những gì sẽ đổi khi hoàn tất; null khi phiên đã hoàn tất.
          oneOf:
            - $ref: '#/components/schemas/HandoverCompletionPreview'
            - type: 'null'
        allowedActions:
          type: array
          description: |
            Khi phiên còn mở:
            - `EDIT_APPOINTMENTS` và `COMPLETE` cho ban chủ nhiệm đang hiệu lực (ban chủ nhiệm cũ, BR-TERM-02).
            - `CONFIRM` cho người được bầu Chủ nhiệm, Phó chủ nhiệm, Thủ quỹ mới còn đủ điều kiện (kể cả người tái đắc cử).
          items:
            type: string
            enum: [EDIT_APPOINTMENTS, CONFIRM, COMPLETE]
        version:
          type: integer
          description: Tăng mỗi lần sửa kết quả bầu hoặc có lượt xác nhận.
    HandoverCompletionPreview:
      type: object
      required:
        - endingPositionCount
        - grantedPositionCount
        - closingDepartments
        - newDepartments
        - renamedDepartments
        - leadReplacements
        - fromTermEndOn
        - toTermStartOn
      properties:
        endingPositionCount:
          type: integer
          description: Chức vụ thường trực còn mở sẽ kết thúc, kể cả chức đang giữ tới khi bàn giao xong.
        grantedPositionCount: { type: integer, description: Chức vụ theo kết quả bầu, hiệu lực từ ngày hoàn tất. }
        closingDepartments:
          type: array
          items: { type: string }
        newDepartments:
          type: array
          items: { type: string }
        renamedDepartments:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
        leadReplacements:
          type: array
          items:
            type: object
            required: [eventName, from, to]
            properties:
              eventName: { type: string }
              from:
                oneOf:
                  - $ref: '#/components/schemas/PersonRef'
                  - type: 'null'
              to: { $ref: '#/components/schemas/PersonRef' }
        fromTermEndOn:
          type: string
          format: date
          description: Hôm qua, nhưng không trước ngày bắt đầu của nhiệm kỳ cũ.
        toTermStartOn: { type: string, format: date, description: Hôm nay. }
    CompleteHandoverRequest:
      type: object
      required: [action, version]
      properties:
        action:
          type: string
          enum: [COMPLETE]
        version: { type: integer, description: Version của phiên lúc người dùng xem. }
    HandoverProgress:
      type: object
      required: [pending, confirmed]
      properties:
        pending: { type: integer }
        confirmed: { type: integer }
    HandoverItemCounts:
      type: object
      required: [total, pending, confirmed, resolved]
      properties:
        total: { type: integer }
        pending: { type: integer }
        confirmed: { type: integer }
        resolved:
          type: integer
          description: Mục không cần bàn giao nữa; không tính vào tiến độ.
    HandoverCounts:
      allOf:
        - $ref: '#/components/schemas/HandoverItemCounts'
        - type: object
          required: [byKind]
          properties:
            byKind:
              type: object
              required: [FUND, EVENT, TASK]
              properties:
                FUND: { $ref: '#/components/schemas/HandoverItemCounts' }
                EVENT: { $ref: '#/components/schemas/HandoverItemCounts' }
                TASK: { $ref: '#/components/schemas/HandoverItemCounts' }
    HandoverItemKind:
      type: string
      description: |
        FR-TERM-04 với các loại đã có dữ liệu: quỹ đang mở (Quỹ chung, quỹ sự kiện), sự kiện chưa đóng (trừ Dự thảo, Đã đóng,
        Đã hủy), công việc của ban chưa xong. Việc của tiểu ban đi theo sự kiện. Tạm ứng, tài sản, tài liệu thêm khi có module.
      enum: [FUND, EVENT, TASK]
    HandoverItemStatus:
      type: string
      description: |
        Chờ xác nhận, Đã xác nhận, Không cần bàn giao (đối tượng đã xong, đã đóng, đã quyết toán; không ai xác nhận).
        Mục đã xác nhận mà dữ liệu đổi (số dư, khoản chờ mới, Trưởng BTC, người làm) thì về Chờ xác nhận, kèm `note`.
      enum: [PENDING, CONFIRMED, RESOLVED]
    HandoverFundInfo:
      type: object
      required: [fundKind, balance, pendingCount, eventName]
      properties:
        fundKind: { $ref: '#/components/schemas/FundKind' }
        balance: { type: integer, description: Số dư tính từ giao dịch Đã ghi sổ (VND). }
        pendingCount: { type: integer, description: Khoản chờ duyệt hoặc đã duyệt chưa ghi sổ. }
        eventName: { $ref: '#/components/schemas/NullableString' }
    HandoverTaskInfo:
      type: object
      required: [departmentName, owner, assigner, status, dueAt, overdue]
      properties:
        departmentName: { type: string }
        owner: { $ref: '#/components/schemas/PersonRef' }
        assigner: { $ref: '#/components/schemas/PersonRef' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        dueAt: { type: string, format: date-time }
        overdue: { type: boolean }
    HandoverEventInfo:
      type: object
      required: [status, startAt, endAt, lead, openTaskCount, needsLeadDecision]
      properties:
        status: { $ref: '#/components/schemas/EventStatus' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        lead:
          description: Trưởng BTC đang hiệu lực.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        openTaskCount: { type: integer, description: Việc chưa xong của các tiểu ban. }
        needsLeadDecision:
          type: boolean
          description: Sự kiện đã duyệt, chưa đóng; xác nhận phải kèm quyết định giữ hoặc thay Trưởng BTC.
    EventLeadAction:
      type: string
      enum: [KEEP, REPLACE]
    EventLeadDecision:
      type: object
      required: [action, person]
      properties:
        action: { $ref: '#/components/schemas/EventLeadAction' }
        person:
          allOf: [{ $ref: '#/components/schemas/PersonRef' }]
          description: Giữ thì là Trưởng BTC lúc xác nhận; thay thì là người sẽ nhận chức khi bàn giao hoàn tất.
    HandoverItem:
      type: object
      description: Mục bàn giao kèm sẵn dữ liệu cần xem, vì người được bầu chưa có quyền mở quỹ, sự kiện, công việc.
      required: [id, kind, status, title, fund, task, event, eventLead, note, confirmedBy, confirmedAt, allowedActions, version]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/HandoverItemKind' }
        status: { $ref: '#/components/schemas/HandoverItemStatus' }
        title: { type: string }
        fund:
          oneOf:
            - $ref: '#/components/schemas/HandoverFundInfo'
            - type: 'null'
        task:
          oneOf:
            - $ref: '#/components/schemas/HandoverTaskInfo'
            - type: 'null'
        event:
          oneOf:
            - $ref: '#/components/schemas/HandoverEventInfo'
            - type: 'null'
        eventLead:
          oneOf:
            - $ref: '#/components/schemas/EventLeadDecision'
            - type: 'null'
        note:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Vì sao mục quay về Chờ xác nhận hoặc không cần bàn giao nữa.
        confirmedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        confirmedAt: { $ref: '#/components/schemas/NullableDateTime' }
        allowedActions:
          type: array
          description: |
            `CONFIRM` cho người được bầu vào ban chủ nhiệm mới còn đủ điều kiện, với mục Chờ xác nhận và với mục sự kiện
            đã xác nhận (đổi quyết định Trưởng BTC tới lúc hoàn tất).
          items:
            type: string
            enum: [CONFIRM]
        version: { type: integer }
    HandoverItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/HandoverItem' }
    EventLeadDecisionRequest:
      type: object
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/EventLeadAction' }
        userId:
          type: string
          description: Bắt buộc khi `REPLACE`; thành viên Thử việc hoặc Chính thức. Chọn đúng Trưởng BTC hiện tại thì coi như giữ.
    ItemConfirmationRequest:
      type: object
      required: [itemId, version]
      properties:
        itemId: { type: string }
        version: { type: integer, description: Version của mục lúc người dùng xem. }
        eventLead:
          allOf: [{ $ref: '#/components/schemas/EventLeadDecisionRequest' }]
          description: Bắt buộc với mục sự kiện có `needsLeadDecision`; không gửi với mục khác.
    ConfirmItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ItemConfirmationRequest' }
    StartHandoverRequest:
      type: object
      required: [fromTermId, toTermId]
      properties:
        fromTermId: { type: string }
        toTermId: { type: string }
    AppointmentRequest:
      type: object
      required: [role, departmentId, userId]
      properties:
        role: { $ref: '#/components/schemas/StandingRole' }
        departmentId:
          allOf: [{ $ref: '#/components/schemas/NullableString' }]
          description: Bắt buộc với trưởng, phó ban; null với ban chủ nhiệm.
        userId: { type: string }
    SaveAppointmentsRequest:
      type: object
      required: [appointments, version]
      properties:
        appointments:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/AppointmentRequest' }
        version: { type: integer }
    # Công việc
    TaskStatus:
      type: string
      description: ST-TASK. Mới giao, Đang làm, Chờ nghiệm thu, Hoàn thành, Đã hủy.
      enum: [ASSIGNED, IN_PROGRESS, PENDING_REVIEW, DONE, CANCELLED]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    TaskTransitionAction:
      type: string
      enum: [START, SUBMIT, APPROVE, REQUEST_CHANGES, CANCEL]
    TaskAction:
      type: string
      description: Chuyển trạng thái, cộng `REASSIGN` (đổi người chính, người phối hợp) và `CHANGE_DUE` (đổi hạn) của FR-TASK-05.
      enum: [START, SUBMIT, APPROVE, REQUEST_CHANGES, CANCEL, REASSIGN, CHANGE_DUE]
    TaskChange:
      type: object
      description: |
        Một lần đổi người hoặc đổi hạn (FR-TASK-05). `field` là `DUE_AT` thì có `fromDueAt`, `toDueAt`; còn lại có
        `fromPeople`, `toPeople` là họ tên chụp lúc đổi (BR-DATA-02). `ASSIGNER` chỉ sinh khi xử lý tồn đọng (FR-MEM-09).
      required: [id, at, actor, field, reason]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        field:
          type: string
          enum: [OWNER, COLLABORATORS, ASSIGNER, DUE_AT]
        reason: { type: string }
        fromDueAt: { type: string, format: date-time }
        toDueAt: { type: string, format: date-time }
        fromPeople:
          type: array
          items: { type: string }
        toPeople:
          type: array
          items: { type: string }
    UpdateTaskRequest:
      type: object
      description: Gửi trường nào thì đổi trường đó; ít nhất một trường phải khác giá trị hiện tại.
      required: [reason, version]
      properties:
        ownerId: { type: string }
        collaboratorIds:
          type: array
          items: { type: string }
        dueAt: { type: string, format: date-time }
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer }
    TaskScopeType:
      type: string
      enum: [DEPARTMENT, SUBCOMMITTEE]
    DueFilter:
      type: string
      description: Quá hạn; hạn trong 7 ngày tới; hạn sau 7 ngày.
      enum: [OVERDUE, THIS_WEEK, LATER]
    TaskScope:
      type: object
      required: [type, id, name, eventId, eventName]
      properties:
        type: { $ref: '#/components/schemas/TaskScopeType' }
        id: { type: string }
        name: { type: string }
        eventId: { $ref: '#/components/schemas/NullableString' }
        eventName: { $ref: '#/components/schemas/NullableString' }
    FileRef:
      type: object
      required: [id, name, size, contentType]
      properties:
        id: { type: string }
        name: { type: string }
        size:
          type: integer
          description: Byte.
        contentType: { type: string }
    TaskSubmission:
      type: object
      required: [note, attachments, submittedAt]
      properties:
        note: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        submittedAt: { type: string, format: date-time }
    TaskHistoryEntry:
      type: object
      required: [id, at, actor, fromStatus, toStatus, note]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/PersonRef' }
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/TaskStatus'
            - type: 'null'
        toStatus: { $ref: '#/components/schemas/TaskStatus' }
        note: { $ref: '#/components/schemas/NullableString' }
    TaskSummary:
      type: object
      required: [id, clubId, clubName, title, scope, assigner, owner, collaborators, dueAt, priority, status, overdue, dueSoon, allowedActions, version]
      properties:
        id: { type: string }
        clubId: { type: string }
        clubName: { type: string }
        title: { type: string }
        scope: { $ref: '#/components/schemas/TaskScope' }
        assigner: { $ref: '#/components/schemas/PersonRef' }
        owner: { $ref: '#/components/schemas/PersonRef' }
        collaborators:
          type: array
          items: { $ref: '#/components/schemas/PersonRef' }
        dueAt: { type: string, format: date-time }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        overdue:
          type: boolean
          description: Cờ quá hạn do máy chủ tính, không phải trạng thái (BR-TASK-03). Việc Hoàn thành, Đã hủy, việc của sự kiện Đã đóng, Đã hủy không bị gắn cờ.
        dueSoon:
          type: boolean
          description: 'Việc còn cần làm, chưa quá hạn và hạn rơi vào từ bây giờ đến hết N ngày tới theo ngày lịch giờ Việt Nam, với N là `taskReminderDays` của CLB (không phải N×24 giờ); N = 0 thì luôn false (FR-TASK-06).'
        allowedActions:
          type: array
          items: { $ref: '#/components/schemas/TaskAction' }
        version: { type: integer }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [description, submission, reviewComment, readOnlyReason, cancelReason, history, changes, overdueHistory, createdAt]
          properties:
            description: { type: string }
            submission:
              oneOf:
                - $ref: '#/components/schemas/TaskSubmission'
                - type: 'null'
            reviewComment: { $ref: '#/components/schemas/NullableString' }
            readOnlyReason:
              $ref: '#/components/schemas/NullableString'
              description: Vì sao việc chỉ xem được (sự kiện Đã đóng, Đã hủy); null khi không bị khóa.
            cancelReason:
              $ref: '#/components/schemas/NullableString'
              description: Lý do hủy khi việc Đã hủy.
            history:
              type: array
              items: { $ref: '#/components/schemas/TaskHistoryEntry' }
            changes:
              type: array
              description: Các lần đổi người, đổi hạn, mới nhất trước.
              items: { $ref: '#/components/schemas/TaskChange' }
            overdueHistory:
              type: array
              description: Các lần hệ thống ghi nhận quá hạn, mỗi hạn một lần, mới nhất trước; đổi hạn không xóa (BR-TASK-03, FR-TASK-06).
              items:
                type: object
                required: [dueAt, flaggedAt]
                properties:
                  dueAt: { type: string, format: date-time }
                  flaggedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/TaskSummary' }
    TaskTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action: { $ref: '#/components/schemas/TaskTransitionAction' }
        version: { type: integer }
        note:
          type: string
          description: Ghi chú khi nộp kết quả.
        reason:
          type: string
          description: Nhận xét bắt buộc khi yêu cầu làm lại (FR-TASK-04); lý do 5–500 ký tự bắt buộc khi hủy (FR-TASK-05).
        attachmentIds:
          type: array
          items: { type: string }
    CreateTaskRequest:
      type: object
      required: [title, description, scopeType, scopeId, ownerId, collaboratorIds, dueAt, priority]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string }
        scopeType: { $ref: '#/components/schemas/TaskScopeType' }
        scopeId: { type: string }
        ownerId: { type: string }
        collaboratorIds:
          type: array
          items: { type: string }
        dueAt: { type: string, format: date-time }
        priority: { $ref: '#/components/schemas/TaskPriority' }
    AssignableMember:
      allOf:
        - $ref: '#/components/schemas/PersonRef'
        - type: object
          required: [departmentName]
          properties:
            departmentName: { $ref: '#/components/schemas/NullableString' }
    AssignableScope:
      type: object
      description: Phạm vi người dùng được giao việc kèm người nhận hợp lệ (BR-TASK-01).
      required: [type, id, name, eventName, members]
      properties:
        type: { $ref: '#/components/schemas/TaskScopeType' }
        id: { type: string }
        name: { type: string }
        eventName: { $ref: '#/components/schemas/NullableString' }
        members:
          type: array
          items: { $ref: '#/components/schemas/AssignableMember' }
    TaskFacets:
      type: object
      required: [clubs, events]
      properties:
        clubs:
          type: array
          description: CLB còn việc hiện ở danh sách mặc định (không tính việc của sự kiện Đã đóng, Đã hủy).
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        events:
          type: array
          description: Mọi sự kiện có việc của người gọi, kể cả Đã đóng, Đã hủy, để lọc tra cứu (FR-EVT-16).
          items:
            type: object
            required: [id, name, clubName]
            properties:
              id: { type: string }
              name: { type: string }
              clubName: { type: string }
    # Thông báo
    NotificationKind:
      type: string
      description: Hệ thống tự sinh (FR-NOT-02) hay người gửi soạn (FR-NOT-01).
      enum: [SYSTEM, MANUAL]
    NotificationCategory:
      type: string
      description: Gia nhập, chức vụ, công việc, sự kiện, buổi sinh hoạt, tài chính, nhiệm kỳ và bàn giao, thông báo của CLB.
      enum: [MEMBERSHIP, POSITION, TASK, EVENT, SESSION, FINANCE, TERM, ANNOUNCEMENT]
    NotificationTarget:
      type: object
      description: |
        Màn hình liên quan; màn đó tự kiểm tra quyền khi mở (BR-SEC-02). `FINANCE` trỏ tới một giao dịch (`id`), `SESSION` tới
        một buổi sinh hoạt, `TERM` tới trang Nhiệm kỳ, `HANDOVER` tới một phiên bàn giao (`id`), `EVENT_SHARED` tới tab Sự kiện
        chung của CLB được mời đồng tổ chức, `ADVANCE` tới một tạm ứng (`id`, mở trong sheet ở trang Tài chính).
      required: [type, clubId, id]
      properties:
        type:
          type: string
          description: '`MEMBERS` mở trang Thành viên; `id` là tab cần mở (ví dụ `leave`), `null` là tab mặc định. `INVITATION` mở trang lời mời; `id` là mã lời mời.'
          enum: [CLUB, STRUCTURE, MEMBERS, TASK, EVENT, EVENT_SHARED, SESSION, FINANCE, ADVANCE, DUES, TERM, HANDOVER, DIRECTORY, INVITATION]
        clubId: { $ref: '#/components/schemas/NullableString' }
        id: { $ref: '#/components/schemas/NullableString' }
    NotificationSummary:
      type: object
      required: [id, kind, category, title, clubId, clubName, createdAt, readAt, target]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        title: { type: string }
        clubId: { $ref: '#/components/schemas/NullableString' }
        clubName: { $ref: '#/components/schemas/NullableString' }
        createdAt: { type: string, format: date-time }
        readAt: { $ref: '#/components/schemas/NullableDateTime' }
        target:
          oneOf:
            - $ref: '#/components/schemas/NotificationTarget'
            - type: 'null'
    NotificationDetail:
      allOf:
        - $ref: '#/components/schemas/NotificationSummary'
        - type: object
          required: [body, sender]
          properties:
            body:
              type: string
              description: Văn bản thuần, không phải HTML.
            sender:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/NotificationSummary' }
    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    AnnouncementAudienceRef:
      type: object
      required: [kind, scopeId]
      properties:
        kind:
          type: string
          enum: [CLUB, DEPARTMENT, EVENT_STAFF]
          description: Toàn CLB, một ban, hoặc ban tổ chức một sự kiện.
        scopeId:
          type: string
          description: Mã CLB, ban hoặc sự kiện tùy `kind`.
    AnnouncementAudience:
      allOf:
        - $ref: '#/components/schemas/AnnouncementAudienceRef'
        - type: object
          required: [label, recipientCount]
          properties:
            label: { type: string, examples: ['Ban Truyền thông'] }
            recipientCount:
              type: integer
              minimum: 0
              description: Số người sẽ nhận, không tính chính người gửi.
    SendAnnouncementRequest:
      type: object
      required: [audience, title, body, sendEmail]
      properties:
        audience: { $ref: '#/components/schemas/AnnouncementAudienceRef' }
        title: { type: string, minLength: 3, maxLength: 150 }
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Văn bản thuần, không phải HTML.
        sendEmail:
          type: boolean
          description: Gửi kèm email qua SMTP (IF-03); mock chỉ lưu cờ.
    SendAnnouncementResult:
      type: object
      required: [id, recipientCount]
      properties:
        id: { type: string }
        recipientCount: { type: integer, minimum: 1 }
    # Sự kiện
    EventStatus:
      type: string
      description: ST-EVT theo báo cáo 17/11; quyết toán là trạng thái của quỹ (`FundStatus`), không phải của sự kiện.
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REGISTRATION_OPEN, ONGOING, ENDED, CLOSED, CANCELLED]
    EventTransitionAction:
      type: string
      enum: [SUBMIT, APPROVE, REJECT, OPEN_REGISTRATION, CANCEL, CLOSE]
    EventAction:
      type: string
      description: |
        Chuyển trạng thái cộng các quyền khác do máy chủ tính: `MANAGE_SUBCOMMITTEES`, `REGISTER`, `RESCHEDULE` (dời thời gian, FR-EVT-14),
        `VIEW_STAFF`, `VIEW_REGISTRATIONS`, `VIEW_FUND`, `VIEW_ATTENDANCE` (dữ liệu BTC, danh sách tham dự, quỹ sự kiện, điểm danh chỉ BTC và ban chủ nhiệm xem, SRS 3.5).
        `VIEW_PROGRESS`: số việc theo tiểu ban (FR-EVT-09). Ban chủ nhiệm CLB đồng tổ chức (đang Chấp nhận, sự kiện còn hoạt
        động) chỉ có `VIEW_PROGRESS`, `VIEW_STAFF`, `VIEW_FUND`: không có `VIEW_REGISTRATIONS`, `VIEW_ATTENDANCE` và không thao tác ghi nào.
      enum: [SUBMIT, APPROVE, REJECT, OPEN_REGISTRATION, CANCEL, CLOSE, MANAGE_SUBCOMMITTEES, REGISTER, RESCHEDULE, VIEW_STAFF, VIEW_PROGRESS, VIEW_REGISTRATIONS, VIEW_FUND, VIEW_ATTENDANCE]
    EventFormat:
      type: string
      enum: [OFFLINE, ONLINE]
    RegistrationStatus:
      type: string
      description: ST-REG. Nhận chỗ, Danh sách chờ, Chờ xác nhận lại, Đã hủy.
      enum: [CONFIRMED, WAITLISTED, RECONFIRM_PENDING, CANCELLED]
    MyRegistration:
      type: object
      required: [id, status, waitlistPosition, registeredAt, promotedAt, cancelDeadline, reconfirmDeadline, allowedActions]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        waitlistPosition: { type: [integer, 'null'] }
        registeredAt: { type: string, format: date-time }
        promotedAt:
          type: [string, 'null']
          format: date-time
          description: Lúc được đôn từ danh sách chờ; null khi nhận chỗ ngay.
        cancelDeadline:
          type: string
          format: date-time
          description: |
            Hạn tự hủy; người giữ chỗ theo `registrationCancelHours` trước giờ bắt đầu, người ở danh sách chờ tới giờ bắt đầu,
            người đang Chờ xác nhận lại tới hạn xác nhận (được từ chối giờ mới).
        reconfirmDeadline:
          $ref: '#/components/schemas/NullableDateTime'
          description: Hạn xác nhận tham dự sau khi sự kiện dời giờ; chỉ có khi `RECONFIRM_PENDING` (FR-EVT-14).
        allowedActions:
          type: array
          items:
            type: string
            enum: [CANCEL, RECONFIRM]
    EventSummary:
      type: object
      required:
        - id
        - clubId
        - name
        - startAt
        - endAt
        - format
        - location
        - capacity
        - confirmedCount
        - waitlistCount
        - registrationDeadline
        - openToGuests
        - status
        - lead
        - myRegistration
      properties:
        id: { type: string }
        clubId: { type: string }
        name: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        format: { $ref: '#/components/schemas/EventFormat' }
        location: { $ref: '#/components/schemas/NullableString' }
        capacity:
          type: [integer, 'null']
          description: Không giới hạn chỗ khi `null` (BR-EVT-01).
        confirmedCount: { type: integer, description: Số đăng ký đang giữ chỗ (Nhận chỗ và Chờ xác nhận lại). }
        waitlistCount: { type: integer }
        registrationDeadline: { $ref: '#/components/schemas/NullableDateTime' }
        openToGuests: { type: boolean }
        status: { $ref: '#/components/schemas/EventStatus' }
        lead:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        myRegistration:
          oneOf:
            - $ref: '#/components/schemas/MyRegistration'
            - type: 'null'
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [description, onlineUrl, proposer, approver, rejectionReason, cancellationReason, statusBeforeCancel, allowedActions, version, createdAt, fundId, fundStatus, openAdvanceCount, lastScheduleChange, viewingAsCoHost]
          properties:
            description: { type: string }
            onlineUrl: { $ref: '#/components/schemas/NullableString' }
            proposer: { $ref: '#/components/schemas/PersonRef' }
            approver:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            rejectionReason: { $ref: '#/components/schemas/NullableString' }
            cancellationReason: { $ref: '#/components/schemas/NullableString' }
            statusBeforeCancel:
              description: Trạng thái cuối cùng đạt được trước khi hủy, để hiện tiến trình.
              oneOf:
                - $ref: '#/components/schemas/EventStatus'
                - type: 'null'
            allowedActions:
              type: array
              items: { $ref: '#/components/schemas/EventAction' }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            fundId:
              $ref: '#/components/schemas/NullableString'
              description: Quỹ sự kiện, có từ khi sự kiện sang Đã duyệt.
            fundStatus:
              description: |
                Trạng thái quỹ sự kiện; `null` khi chưa có quỹ hoặc người gọi không xem được quỹ (SRS 3.5). Giao diện dùng để
                nhắc quyết toán quỹ trước khi đóng sự kiện (BR-EVT-05).
              oneOf:
                - $ref: '#/components/schemas/FundStatus'
                - type: 'null'
            openAdvanceCount:
              type: [integer, 'null']
              minimum: 0
              description: Số tạm ứng còn mở ở quỹ sự kiện (chặn đóng sự kiện, BR-EVT-05); `null` như `fundStatus`.
            lastScheduleChange:
              description: Lần dời thời gian gần nhất (FR-EVT-14); `null` khi chưa dời lần nào.
              oneOf:
                - $ref: '#/components/schemas/ScheduleChange'
                - type: 'null'
            viewingAsCoHost:
              description: CLB đồng tổ chức khi người gọi chỉ là ban chủ nhiệm của CLB đó (FR-EVT-09, chỉ xem); `null` với người khác.
              oneOf:
                - $ref: '#/components/schemas/CoHostClubRef'
                - type: 'null'
    TaskProgressCounts:
      type: object
      description: Số việc theo trạng thái, không tính việc Đã hủy; `overdue` đếm trùng với các trạng thái còn làm.
      required: [total, assigned, inProgress, pendingReview, done, overdue]
      properties:
        total: { type: integer }
        assigned: { type: integer }
        inProgress: { type: integer }
        pendingReview: { type: integer }
        done: { type: integer }
        overdue: { type: integer }
    EventProgress:
      type: object
      required: [total, subcommittees]
      properties:
        total: { $ref: '#/components/schemas/TaskProgressCounts' }
        subcommittees:
          type: array
          items:
            type: object
            required: [id, name, counts]
            properties:
              id: { type: string }
              name: { type: string }
              counts: { $ref: '#/components/schemas/TaskProgressCounts' }
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/EventSummary' }
    StaffKind:
      type: string
      description: Thành viên CLB chủ trì, CTV, nhân sự CLB đồng tổ chức.
      enum: [MEMBER, COLLABORATOR, CO_HOST]
    StaffMember:
      allOf:
        - $ref: '#/components/schemas/PersonRef'
        - type: object
          required: [departmentName, kind, homeClubName]
          properties:
            departmentName:
              $ref: '#/components/schemas/NullableString'
              description: Ban ở CLB chủ trì; nhân sự CLB đồng tổ chức thì ban ở CLB của họ.
            kind: { $ref: '#/components/schemas/StaffKind' }
            homeClubName:
              $ref: '#/components/schemas/NullableString'
              description: CLB gốc của nhân sự `CO_HOST`; `null` với thành viên CLB chủ trì và CTV.
    Subcommittee:
      type: object
      required: [id, name, description, quota, lead, members, allowedActions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        quota:
          type: [integer, 'null']
          description: Chỉ tiêu nhân sự; `null` là không đặt chỉ tiêu.
        lead:
          oneOf:
            - $ref: '#/components/schemas/StaffMember'
            - type: 'null'
        members:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }
        allowedActions:
          type: array
          description: |
            `INVITE_MEMBER` (Trưởng tiểu ban cũng có); `ADD_COLLABORATOR`, `SET_LEAD` cần quyền ở cả sự kiện;
            `ADD_CO_HOST_STAFF` thêm khi sự kiện có CLB đồng tổ chức đang Chấp nhận.
          items:
            type: string
            enum: [INVITE_MEMBER, ADD_COLLABORATOR, ADD_CO_HOST_STAFF, SET_LEAD]
    StaffCandidate:
      description: Khi mời chỉ thấy tên và ban (FR-EVT-05).
      allOf:
        - $ref: '#/components/schemas/PersonRef'
        - type: object
          required: [departmentName]
          properties:
            departmentName: { $ref: '#/components/schemas/NullableString' }
    Registration:
      type: object
      required: [id, attendee, status, waitlistPosition, registeredAt, promotedAt]
      properties:
        id: { type: string }
        attendee: { $ref: '#/components/schemas/PersonRef' }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        waitlistPosition: { type: [integer, 'null'] }
        registeredAt: { type: string, format: date-time }
        promotedAt:
          type: [string, 'null']
          format: date-time
          description: Lúc được đôn từ danh sách chờ (FR-EVT-13).
    RegistrationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Registration' }
    CreateEventRequest:
      type: object
      required: [name, description, startAt, endAt, format, location, onlineUrl, capacity, registrationDeadline, openToGuests, leadUserId]
      properties:
        name: { type: string, minLength: 3 }
        description: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        format: { $ref: '#/components/schemas/EventFormat' }
        location: { $ref: '#/components/schemas/NullableString' }
        onlineUrl: { $ref: '#/components/schemas/NullableString' }
        capacity: { type: [integer, 'null'], minimum: 1 }
        registrationDeadline: { $ref: '#/components/schemas/NullableDateTime' }
        openToGuests: { type: boolean }
        leadUserId:
          type: [string, 'null']
          description: Ban chủ nhiệm tạo sự kiện thì chỉ định Trưởng BTC (FR-EVT-01); đề xuất thì để `null`.
    EventTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action: { $ref: '#/components/schemas/EventTransitionAction' }
        version: { type: integer }
        reason:
          type: string
          description: Bắt buộc từ 5 ký tự khi `REJECT`, `CANCEL`.
        leadUserId:
          type: string
          description: Khi duyệt đề xuất; mặc định là người đề xuất (FR-EVT-03).
    RescheduleEventRequest:
      type: object
      required: [startAt, endAt, reason, version]
      properties:
        startAt: { type: string, format: date-time, description: Sau thời điểm hiện tại. }
        endAt: { type: string, format: date-time, description: Sau `startAt`. }
        registrationDeadline:
          $ref: '#/components/schemas/NullableDateTime'
          description: Không gửi thì giữ hạn hiện tại, gửi `null` để bỏ hạn. Hạn (mới hoặc giữ nguyên) không được sau `startAt` mới.
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer }
    ScheduleChange:
      type: object
      required: [at, actor, fromStartAt, fromEndAt, toStartAt, toEndAt, reason]
      properties:
        at: { type: string, format: date-time }
        actor:
          $ref: '#/components/schemas/PersonRef'
          description: Họ tên chụp lúc dời.
        fromStartAt: { type: string, format: date-time }
        fromEndAt: { type: string, format: date-time }
        toStartAt: { type: string, format: date-time }
        toEndAt: { type: string, format: date-time }
        reason: { type: string }
    CreateSubcommitteeRequest:
      type: object
      required: [name, description, quota, leadUserId]
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        quota: { type: [integer, 'null'], minimum: 1 }
        leadUserId: { $ref: '#/components/schemas/NullableString' }
    AddStaffRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        coHostId:
          $ref: '#/components/schemas/NullableString'
          description: Id lời mời đồng tổ chức đang Chấp nhận khi thêm nhân sự của CLB đó (FR-EVT-08).
    SetSubcommitteeLeadRequest:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string, description: Nhân sự hiện có của tiểu ban. }
        reason:
          type: [string, 'null']
          description: Bắt buộc 5–500 ký tự khi tiểu ban đang có trưởng.
    CoHostStatus:
      type: string
      description: ST-COH. Đã gửi, Chấp nhận, Từ chối, Đã gỡ.
      enum: [SENT, ACCEPTED, DECLINED, REMOVED]
    CoHostClubRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CoHost:
      type: object
      description: CLB đồng tổ chức nhìn từ CLB chủ trì (FR-EVT-08). Quỹ sự kiện vẫn thuộc CLB chủ trì (BR-FIN-07).
      required: [id, club, status, message, invitedBy, invitedAt, decidedAt, decisionNote, removedAt, removeReason, staffCount, allowedActions, version]
      properties:
        id: { type: string }
        club: { $ref: '#/components/schemas/CoHostClubRef' }
        status: { $ref: '#/components/schemas/CoHostStatus' }
        message: { type: string }
        invitedBy: { $ref: '#/components/schemas/PersonRef' }
        invitedAt: { type: string, format: date-time }
        decidedAt: { $ref: '#/components/schemas/NullableDateTime' }
        decisionNote: { $ref: '#/components/schemas/NullableString' }
        removedAt: { $ref: '#/components/schemas/NullableDateTime' }
        removeReason: { $ref: '#/components/schemas/NullableString' }
        staffCount: { type: integer, description: Số người của CLB này đang trong BTC. }
        allowedActions:
          type: array
          items: { type: string, enum: [REMOVE] }
        version: { type: integer }
    SharedEvent:
      type: object
      description: Lời mời đồng tổ chức nhìn từ CLB được mời (tab Sự kiện chung).
      required: [id, event, status, message, invitedBy, invitedAt, decidedBy, decidedAt, decisionNote, removedAt, removeReason, staffCount, allowedActions, version]
      properties:
        id: { type: string }
        event:
          type: object
          required: [id, name, clubId, clubName, startAt, endAt, status]
          properties:
            id: { type: string }
            name: { type: string }
            clubId: { type: string, description: CLB chủ trì. }
            clubName: { type: string }
            startAt: { type: string, format: date-time }
            endAt: { type: string, format: date-time }
            status: { $ref: '#/components/schemas/EventStatus' }
        status: { $ref: '#/components/schemas/CoHostStatus' }
        message: { type: string }
        invitedBy: { $ref: '#/components/schemas/PersonRef' }
        invitedAt: { type: string, format: date-time }
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decidedAt: { $ref: '#/components/schemas/NullableDateTime' }
        decisionNote: { $ref: '#/components/schemas/NullableString' }
        removedAt: { $ref: '#/components/schemas/NullableDateTime' }
        removeReason: { $ref: '#/components/schemas/NullableString' }
        staffCount: { type: integer, description: Số thành viên CLB này đang trong BTC sự kiện. }
        allowedActions:
          type: array
          items: { type: string, enum: [ACCEPT, DECLINE] }
        version: { type: integer }
    InviteCoHostRequest:
      type: object
      required: [clubId, message]
      properties:
        clubId: { type: string }
        message: { type: string, maxLength: 500 }
    CoHostDecisionRequest:
      type: object
      required: [decision, note, version]
      properties:
        decision: { type: string, enum: [ACCEPT, DECLINE] }
        note:
          type: [string, 'null']
          description: Bắt buộc 5–500 ký tự khi `DECLINE`.
        version: { type: integer }
    RemoveCoHostRequest:
      type: object
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer }
    AddCollaboratorRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email tài khoản của người ngoài CLB; không có gợi ý theo email để không dò được tài khoản.
    # Sinh hoạt, điểm danh
    SessionScopeType:
      type: string
      description: Buổi toàn CLB hoặc buổi của một ban.
      enum: [CLUB, DEPARTMENT]
    SessionScope:
      type: object
      required: [type, departmentId, departmentName]
      properties:
        type: { $ref: '#/components/schemas/SessionScopeType' }
        departmentId: { $ref: '#/components/schemas/NullableString' }
        departmentName: { $ref: '#/components/schemas/NullableString' }
    SessionScopeOption:
      type: object
      required: [type, departmentId, name]
      properties:
        type: { $ref: '#/components/schemas/SessionScopeType' }
        departmentId: { $ref: '#/components/schemas/NullableString' }
        name: { type: string }
    SessionSummary:
      type: object
      required: [id, clubId, title, scope, startAt, endAt, location, capacity, registrationDeadline, attendanceClosed]
      properties:
        id: { type: string }
        clubId: { type: string }
        title: { type: string }
        scope: { $ref: '#/components/schemas/SessionScope' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string }
        capacity:
          type: [integer, 'null']
          minimum: 1
          description: '`null` là không giới hạn chỗ.'
        registrationDeadline: { $ref: '#/components/schemas/NullableDateTime' }
        attendanceClosed:
          type: boolean
          description: Đã chốt điểm danh (FR-ATT-08), danh sách chỉ xem được.
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [description, creator, createdAt, allowedActions, version]
          properties:
            description: { type: string }
            creator: { $ref: '#/components/schemas/PersonRef' }
            createdAt: { type: string, format: date-time }
            allowedActions:
              type: array
              items:
                type: string
                enum: [VIEW_ATTENDANCE]
            version: { type: integer }
    SessionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }
    CreateSessionRequest:
      type: object
      required: [scopeType, departmentId, title, description, startAt, endAt, location, capacity, registrationDeadline]
      properties:
        scopeType: { $ref: '#/components/schemas/SessionScopeType' }
        departmentId:
          $ref: '#/components/schemas/NullableString'
          description: Bắt buộc khi `scopeType` là `DEPARTMENT`.
        title: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, maxLength: 3000 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string, minLength: 1, maxLength: 200 }
        capacity: { type: [integer, 'null'], minimum: 1, maximum: 99999 }
        registrationDeadline: { $ref: '#/components/schemas/NullableDateTime' }
    AttendanceStatus:
      type: string
      description: Có mặt, Đi muộn, Vắng có phép, Vắng không phép.
      enum: [PRESENT, LATE, EXCUSED, ABSENT]
    AttendanceFilter:
      type: string
      description: Lọc theo trạng thái, cộng `UNMARKED` (thuộc đối tượng, chưa có bản ghi) và `EXTRA` (người phát sinh).
      enum: [PRESENT, LATE, EXCUSED, ABSENT, UNMARKED, EXTRA]
    AttendanceRecord:
      type: object
      required: [status, method, recordedAt, recordedBy, version]
      properties:
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        method:
          type: string
          enum: [MANUAL, QR]
        recordedAt: { type: string, format: date-time }
        recordedBy: { $ref: '#/components/schemas/PersonRef' }
        version: { type: integer }
    AttendanceRow:
      type: object
      required: [person, departmentName, extra, record]
      properties:
        person: { $ref: '#/components/schemas/PersonRef' }
        departmentName: { $ref: '#/components/schemas/NullableString' }
        extra:
          type: boolean
          description: Người phát sinh, ghi nhận lúc tạo bản ghi (FR-ATT-07).
        record:
          oneOf:
            - $ref: '#/components/schemas/AttendanceRecord'
            - type: 'null'
    AttendanceCounts:
      type: object
      required: [expected, present, late, excused, absent, unmarked, extra]
      properties:
        expected:
          type: integer
          description: Số người thuộc đối tượng, không tính người phát sinh.
        present: { type: integer }
        late: { type: integer }
        excused: { type: integer }
        absent: { type: integer }
        unmarked: { type: integer }
        extra: { type: integer }
    AttendanceSheet:
      type: object
      required: [activity, day, days, opensAt, closedAt, closedBy, readOnlyReason, counts, allowedActions, version, rows]
      properties:
        activity:
          type: object
          required: [type, id, name]
          properties:
            type:
              type: string
              enum: [SESSION, EVENT]
            id: { type: string }
            name: { type: string }
        day: { $ref: '#/components/schemas/NullableDate' }
        days:
          type: array
          description: Các ngày của sự kiện; buổi sinh hoạt để rỗng.
          items: { type: string, format: date }
        opensAt:
          type: string
          format: date-time
          description: Giờ mở điểm danh, mặc định 15 phút trước giờ bắt đầu (SRS 9.2); ngày thứ hai trở đi của sự kiện mở lúc 00:00.
        closedAt: { $ref: '#/components/schemas/NullableDateTime' }
        closedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        readOnlyReason: { $ref: '#/components/schemas/NullableString' }
        counts: { $ref: '#/components/schemas/AttendanceCounts' }
        allowedActions:
          type: array
          description: '`MARK` điểm danh tay, `SHOW_QR` mở mã QR, `CLOSE` chốt.'
          items:
            type: string
            enum: [MARK, SHOW_QR, CLOSE]
        version:
          type: integer
          description: Tăng mỗi khi có bản ghi đổi; chốt gửi kèm.
        rows:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              required: [content]
              properties:
                content:
                  type: array
                  items: { $ref: '#/components/schemas/AttendanceRow' }
    AttendanceCode:
      type: object
      required: [day, payload, expiresAt, refreshSeconds]
      properties:
        day: { $ref: '#/components/schemas/NullableDate' }
        payload:
          type: string
          description: Nội dung mã QR, dạng `clubee://attendance?type=SESSION&club=…&id=…&code=…` (sự kiện thêm `&day=…`).
        expiresAt:
          type: string
          format: date-time
          description: Cuối chu kỳ hiện tại; sau mốc này phải lấy mã mới.
        refreshSeconds:
          type: integer
          description: Độ dài chu kỳ đổi mã của CLB (SRS 9.2).
    AttendanceCheckInRequest:
      type: object
      required: [code, day]
      properties:
        code:
          type: string
          description: Giá trị `code` đọc từ mã QR.
        day:
          $ref: '#/components/schemas/NullableDate'
          description: Giá trị `day` đọc từ mã QR; buổi sinh hoạt để `null`.
    AttendanceCheckIn:
      type: object
      required: [activity, clubName, day, status, recordedAt, alreadyRecorded]
      properties:
        activity:
          type: object
          required: [type, id, name]
          properties:
            type:
              type: string
              enum: [SESSION, EVENT]
            id: { type: string }
            name: { type: string }
        clubName: { type: string }
        day: { $ref: '#/components/schemas/NullableDate' }
        status:
          description: '`PRESENT` hoặc `LATE` khi vừa ghi; quét lại thì là trạng thái của bản ghi cũ.'
          allOf:
            - $ref: '#/components/schemas/AttendanceStatus'
        recordedAt: { type: string, format: date-time }
        alreadyRecorded:
          type: boolean
          description: '`true` khi người này đã có bản ghi từ trước (BR-ATT-01).'
    MarkAttendanceRequest:
      type: object
      required: [day, status, version]
      properties:
        day: { $ref: '#/components/schemas/NullableDate' }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        version:
          type: integer
          description: Phiên bản bản ghi đang thấy, 0 khi chưa có.
    CloseAttendanceRequest:
      type: object
      required: [action, day, version]
      properties:
        action:
          type: string
          enum: [CLOSE]
        day: { $ref: '#/components/schemas/NullableDate' }
        version: { type: integer }
    AttendanceCandidate:
      type: object
      required: [id, fullName, departmentName]
      properties:
        id: { type: string }
        fullName: { type: string }
        departmentName: { $ref: '#/components/schemas/NullableString' }
    # Tài chính
    FundKind:
      type: string
      description: Quỹ chung của CLB hoặc quỹ riêng của một sự kiện.
      enum: [GENERAL, EVENT]
    FundStatus:
      type: string
      description: Quỹ sự kiện sang `SETTLED` sau khi quyết toán (FR-FIN-11); Quỹ chung luôn `OPEN`.
      enum: [OPEN, SETTLED]
    FundAction:
      type: string
      enum: [RECORD_INCOME, PROPOSE_EXPENSE, PROPOSE_ADVANCE, VIEW_REQUESTS, VIEW_ADVANCES, SETTLE]
    AdvanceStatus:
      type: string
      description: |
        ST-ADV, có thêm `APPROVED` giữa Đề xuất và Đã ứng (quyết định 16/11; ST-ADV trong báo cáo thiếu bước này, đã báo nhóm).
        `PARTIALLY_SETTLED`, `SETTLED` dùng khi quyết toán tạm ứng (FR-FIN-08).
      enum: [PROPOSED, APPROVED, DISBURSED, PARTIALLY_SETTLED, SETTLED, REJECTED]
    AdvanceSummary:
      type: object
      required: [id, fundId, fundName, requester, amount, purpose, category, settleBy, status, overdue, createdAt]
      properties:
        id: { type: string }
        fundId: { type: string }
        fundName: { type: string }
        requester: { $ref: '#/components/schemas/PersonRef' }
        amount: { type: integer }
        purpose: { type: string }
        category: { $ref: '#/components/schemas/FinanceCategory' }
        settleBy: { type: string, format: date, description: Hạn quyết toán. }
        status: { $ref: '#/components/schemas/AdvanceStatus' }
        overdue: { type: boolean, description: 'Đã ứng hoặc Quyết toán một phần mà qua hạn (BR-FIN-05), tính lúc đọc.' }
        createdAt: { type: string, format: date-time }
    AdvanceDetail:
      allOf:
        - $ref: '#/components/schemas/AdvanceSummary'
        - type: object
          required: [approver, decidedAt, rejectionReason, disbursedBy, disbursedOn, disbursementTxId, lines, confirmedAmount, closure, allowedActions, version]
          properties:
            approver:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            decidedAt: { $ref: '#/components/schemas/NullableDateTime' }
            rejectionReason: { $ref: '#/components/schemas/NullableString' }
            disbursedBy:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            disbursedOn: { type: [string, 'null'], format: date }
            disbursementTxId:
              $ref: '#/components/schemas/NullableString'
              description: Khoản chi Đã ghi sổ sinh khi ghi Đã ứng.
            lines:
              type: array
              description: Các lần nộp chứng từ, mới nhất trước (FR-FIN-08).
              items: { $ref: '#/components/schemas/AdvanceLine' }
            confirmedAmount: { type: integer, description: Tổng các lần nộp đã xác nhận. }
            closure:
              oneOf:
                - $ref: '#/components/schemas/AdvanceClosure'
                - type: 'null'
            allowedActions:
              type: array
              description: |
                `SUBMIT_SETTLEMENT` (người ứng nộp chứng từ), `DECIDE_LINES` (người giữ sổ, còn lần nộp chờ), `CLOSE` (người giữ
                sổ, không còn lần nộp chờ).
              items: { type: string, enum: [APPROVE, REJECT, DISBURSE, SUBMIT_SETTLEMENT, DECIDE_LINES, CLOSE] }
            version: { type: integer }
    AdvanceLine:
      type: object
      required: [id, amount, description, spentOn, attachments, status, submittedAt, decidedBy, decidedAt, note]
      properties:
        id: { type: string }
        amount: { type: integer }
        description: { type: string }
        spentOn: { type: string, format: date }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
        status: { type: string, enum: [SUBMITTED, CONFIRMED, RETURNED] }
        submittedAt: { type: string, format: date-time }
        decidedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decidedAt: { $ref: '#/components/schemas/NullableDateTime' }
        note: { $ref: '#/components/schemas/NullableString' }
    AdvanceClosure:
      type: object
      required: [kind, amount, transactionId, closedBy, closedAt]
      properties:
        kind: { type: string, enum: [REFUND, TOP_UP, EXACT], description: 'Hoàn phần thừa, chi bổ sung phần thiếu, hoặc khớp.' }
        amount: { type: integer, description: Số tiền hoàn hoặc chi bổ sung; 0 khi khớp. }
        transactionId:
          $ref: '#/components/schemas/NullableString'
          description: Điều chỉnh tăng quỹ (hoàn) hoặc khoản chi Đề xuất (chi bổ sung); `null` khi khớp.
        closedBy: { $ref: '#/components/schemas/PersonRef' }
        closedAt: { type: string, format: date-time }
    SubmitSettlementLineRequest:
      type: object
      required: [amount, description, spentOn, attachmentIds, version]
      properties:
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        description: { type: string, minLength: 3, maxLength: 200 }
        spentOn: { type: string, format: date, description: Không sau hôm nay. }
        attachmentIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
        version: { type: integer }
    SettlementLineDecisionRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [CONFIRM, RETURN] }
        note: { type: string, description: Bắt buộc 5–500 ký tự khi `RETURN`. }
        version: { type: integer, description: Phiên bản tạm ứng. }
    CloseAdvanceRequest:
      type: object
      required: [version]
      properties:
        refundOn: { type: string, format: date, description: 'Ngày nhận lại tiền thừa; từ ngày ứng tới hôm nay, bỏ trống là hôm nay.' }
        version: { type: integer }
    AdvancePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdvanceSummary' }
    ProposeAdvanceRequest:
      type: object
      required: [fundId, amount, purpose, category, settleBy]
      properties:
        fundId: { type: string }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        purpose: { type: string, minLength: 5, maxLength: 500 }
        category: { type: string, enum: [EQUIPMENT, VENUE, PRINTING, FOOD, TRAVEL, OTHER_EXPENSE] }
        settleBy: { type: string, format: date }
    AdvanceTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [APPROVE, REJECT, DISBURSE] }
        version: { type: integer }
        reason: { type: string, description: Bắt buộc 5–500 ký tự khi `REJECT`. }
        disbursedOn: { type: string, format: date, description: 'Khi `DISBURSE`; không sau hôm nay, bỏ trống là hôm nay.' }
    DuesCampaignStatus:
      type: string
      description: Đang mở thì nhận khoản nộp; đã đóng thì không sửa, không nhận thêm (BR-FIN-06).
      enum: [OPEN, CLOSED]
    DuesItemStatus:
      type: string
      description: Tính từ mức phải đóng sau miễn giảm, số đã nộp và miễn giảm.
      enum: [UNPAID, PARTIAL, PAID, EXEMPT]
    DuesExemption:
      type: object
      required: [kind, reason, by, at]
      properties:
        kind: { type: string, enum: [EXEMPT, REDUCED] }
        reason: { type: string }
        by: { $ref: '#/components/schemas/PersonRef' }
        at: { type: string, format: date-time }
    DuesCampaignSummary:
      type: object
      required: [id, name, amount, dueOn, status, memberCount, settledCount, expectedAmount, collectedAmount, openedAt, closedAt]
      properties:
        id: { type: string }
        name: { type: string }
        amount: { type: integer, description: Mức đóng mỗi người. }
        dueOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/DuesCampaignStatus' }
        memberCount: { type: integer, description: Số người trong danh sách chụp lúc mở. }
        settledCount: { type: integer, description: Số người đã nộp đủ hoặc được miễn. }
        expectedAmount: { type: integer, description: Tổng phải thu sau miễn giảm. }
        collectedAmount: { type: integer, description: Tổng đã thu. }
        openedAt: { type: string, format: date-time }
        closedAt: { $ref: '#/components/schemas/NullableDateTime' }
    DuesCampaignDetail:
      allOf:
        - $ref: '#/components/schemas/DuesCampaignSummary'
        - type: object
          required: [openedBy, closedBy, hasPayments, allowedActions, version]
          properties:
            openedBy: { $ref: '#/components/schemas/PersonRef' }
            closedBy:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            hasPayments: { type: boolean }
            allowedActions:
              type: array
              description: '`EDIT_AMOUNT` chỉ khi chưa ai nộp; `RECORD_PAYMENT` dùng ở FR-FIN-10.'
              items: { type: string, enum: [EDIT, EDIT_AMOUNT, SET_EXEMPTION, RECORD_PAYMENT, CLOSE] }
            version: { type: integer }
    DuesCampaignPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/DuesCampaignSummary' }
    DuesItem:
      type: object
      required: [id, member, departmentName, amountDue, paidAmount, status, exemption, payments, version]
      properties:
        id: { type: string }
        member:
          $ref: '#/components/schemas/PersonRef'
          description: Họ tên chụp lúc mở đợt (BR-DATA-02).
        departmentName: { $ref: '#/components/schemas/NullableString' }
        amountDue: { type: integer, description: 'Mức phải đóng sau miễn giảm; 0 khi được miễn.' }
        paidAmount: { type: integer }
        status: { $ref: '#/components/schemas/DuesItemStatus' }
        exemption:
          oneOf:
            - $ref: '#/components/schemas/DuesExemption'
            - type: 'null'
        payments:
          type: array
          description: Các lần nộp, mới nhất trước (FR-FIN-10).
          items: { $ref: '#/components/schemas/DuesPayment' }
        version: { type: integer }
    DuesPayment:
      type: object
      required: [id, amount, paidOn, confirmedBy, confirmedAt, transactionId]
      properties:
        id: { type: string }
        amount: { type: integer }
        paidOn: { type: string, format: date }
        confirmedBy: { $ref: '#/components/schemas/PersonRef' }
        confirmedAt: { type: string, format: date-time }
        transactionId: { type: string, description: Khoản thu Đã ghi sổ ở Quỹ chung. }
    RecordDuesPaymentRequest:
      type: object
      required: [amount, paidOn, version]
      properties:
        amount: { type: integer, minimum: 1, description: Không vượt số còn thiếu. }
        paidOn: { type: string, format: date, description: Không sau hôm nay. }
        version: { type: integer, description: Phiên bản của dòng. }
    DuesItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/DuesItem' }
    OpenDuesRequest:
      type: object
      required: [name, amount, dueOn, exemptions]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        dueOn: { type: string, format: date }
        exemptions:
          type: array
          items:
            type: object
            required: [userId, kind, reason]
            properties:
              userId: { type: string }
              kind: { type: string, enum: [EXEMPT, REDUCED] }
              amount: { type: integer, description: 'Mức sau giảm khi `REDUCED`: từ 1 tới dưới mức đóng.' }
              reason: { type: string, minLength: 5, maxLength: 500 }
    UpdateDuesCampaignRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        dueOn: { type: string, format: date }
        amount: { type: integer, minimum: 1, maximum: 1000000000, description: Chỉ khi chưa ai nộp. }
        version: { type: integer }
    SetExemptionRequest:
      type: object
      required: [kind, version]
      properties:
        kind: { type: string, enum: [EXEMPT, REDUCED, NONE] }
        amount: { type: integer, description: Mức sau giảm khi `REDUCED`. }
        reason: { type: string, description: Bắt buộc 5–500 ký tự khi `EXEMPT`, `REDUCED`. }
        version: { type: integer, description: Phiên bản của dòng. }
    ReportPeriodOption:
      type: object
      required: [kind, key, label, from, to]
      properties:
        kind: { type: string, enum: [MONTH, SEMESTER, TERM] }
        key: { type: string, description: '`yyyy-mm` (tháng), `yyyy-S1`, `yyyy-S2`, `yyyy-SUMMER` (học kỳ, năm bắt đầu năm học), mã nhiệm kỳ.' }
        label: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
    ReportPeriods:
      type: object
      required: [months, semesters, terms]
      properties:
        months: { type: array, items: { $ref: '#/components/schemas/ReportPeriodOption' } }
        semesters: { type: array, items: { $ref: '#/components/schemas/ReportPeriodOption' } }
        terms: { type: array, items: { $ref: '#/components/schemas/ReportPeriodOption' } }
    FinanceReport:
      type: object
      required: [from, to, label, category, event, totalIncome, totalExpense, net, byCategory, byFund, byMonth, overdueAdvanceCount, unpaidDuesCount, flagged]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        label: { type: string }
        category:
          oneOf:
            - $ref: '#/components/schemas/FinanceCategory'
            - type: 'null'
        event:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        totalIncome: { type: integer }
        totalExpense: { type: integer }
        net: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            required: [category, income, expense]
            properties:
              category: { $ref: '#/components/schemas/FinanceCategory' }
              income: { type: integer }
              expense: { type: integer }
        byFund:
          type: array
          items:
            type: object
            required: [fundId, fundName, eventId, income, expense]
            properties:
              fundId: { type: string }
              fundName: { type: string }
              eventId: { $ref: '#/components/schemas/NullableString' }
              income: { type: integer }
              expense: { type: integer }
        byMonth:
          type: array
          items:
            type: object
            required: [month, income, expense]
            properties:
              month: { type: string, description: yyyy-mm }
              income: { type: integer }
              expense: { type: integer }
        overdueAdvanceCount: { type: integer }
        unpaidDuesCount: { type: integer }
        flagged:
          type: array
          description: Khoản chi Đã ghi sổ do cùng một người duyệt và ghi sổ (R-01).
          items:
            type: object
            required: [transactionId, description, amount, occurredOn, fundName, person]
            properties:
              transactionId: { type: string }
              description: { type: string }
              amount: { type: integer }
              occurredOn: { type: string, format: date }
              fundName: { type: string }
              person: { $ref: '#/components/schemas/PersonRef' }
    UnpaidDuesRow:
      type: object
      required: [itemId, campaignId, campaignName, member, owed, dueOn, overdue]
      properties:
        itemId: { type: string }
        campaignId: { type: string }
        campaignName: { type: string }
        member: { $ref: '#/components/schemas/PersonRef' }
        owed: { type: integer }
        dueOn: { type: string, format: date }
        overdue: { type: boolean }
    UnpaidDuesPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/UnpaidDuesRow' }
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE, ADJUSTMENT, TRANSFER]
    TransactionStatus:
      type: string
      description: |
        ST-EXP theo báo cáo 17/11 (có Đã duyệt → Đã hủy cho khoản chi). Khoản thu, chuyển quỹ và điều chỉnh tăng quỹ được
        ghi thẳng vào `POSTED`.
      enum: [PROPOSED, APPROVED, POSTED, REJECTED, WITHDRAWN, CANCELLED]
    TransactionFlow:
      type: string
      description: Tiền vào hay ra khỏi quỹ đang xem.
      enum: [IN, OUT]
    TransactionAction:
      type: string
      enum: [WITHDRAW, APPROVE, REJECT, POST, CANCEL, ADJUST]
    FinanceCategory:
      type: string
      description: |
        Hạng mục cố định. Thu: `MEMBER_DUES`, `SPONSORSHIP`, `EVENT_REVENUE`, `OTHER_INCOME`.
        Chi: `EQUIPMENT`, `VENUE`, `PRINTING`, `FOOD`, `TRAVEL`, `OTHER_EXPENSE`. `FUND_TRANSFER` (chuyển số dư về Quỹ chung)
        và `CO_HOST_SHARE` (khoản chia cho CLB đồng tổ chức) chỉ hệ thống dùng khi quyết toán.
      enum: [MEMBER_DUES, SPONSORSHIP, EVENT_REVENUE, OTHER_INCOME, EQUIPMENT, VENUE, PRINTING, FOOD, TRAVEL, OTHER_EXPENSE, FUND_TRANSFER, CO_HOST_SHARE]
    FundEventRef:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/EventStatus' }
    FundSummary:
      type: object
      required: [id, kind, name, event, status, balance]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/FundKind' }
        name: { type: string, examples: ['Quỹ chung', 'Quỹ Đêm nhạc Mùa đông'] }
        event:
          oneOf:
            - $ref: '#/components/schemas/FundEventRef'
            - type: 'null'
        status: { $ref: '#/components/schemas/FundStatus' }
        balance:
          type: integer
          description: VND, tính từ giao dịch Đã ghi sổ tại thời điểm đọc, không lưu sẵn (BR-FIN-02).
    FundDetail:
      allOf:
        - $ref: '#/components/schemas/FundSummary'
        - type: object
          required: [receiptThreshold, pendingCount, settledAt, settledBy, coHosts, advanceSettleDays, openAdvanceCount, allowedActions, version]
          properties:
            receiptThreshold:
              type: integer
              description: Khoản chi trên mức này phải có chứng từ (BR-FIN-03, SRS 9.2).
            pendingCount:
              type: [integer, 'null']
              minimum: 0
              description: Số khoản chi, điều chỉnh còn chờ duyệt hoặc chờ ghi sổ; `null` với người không được xem các khoản chưa ghi sổ.
            settledAt: { $ref: '#/components/schemas/NullableDateTime' }
            settledBy:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            coHosts:
              type: array
              description: CLB đồng tổ chức đang Chấp nhận của sự kiện, để chia khi quyết toán (FR-FIN-11); rỗng với Quỹ chung.
              items: { $ref: '#/components/schemas/CoHostClubRef' }
            advanceSettleDays: { type: integer, description: 'Số ngày gợi ý cho hạn quyết toán tạm ứng (tham số CLB, SRS 9.2).' }
            openAdvanceCount:
              type: [integer, 'null']
              minimum: 0
              description: Số tạm ứng còn mở (chặn quyết toán quỹ, FR-FIN-11); `null` với người không xem được tạm ứng của quỹ.
            allowedActions:
              type: array
              items: { $ref: '#/components/schemas/FundAction' }
            version: { type: integer }
    FundPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/FundSummary' }
    TransactionSummary:
      type: object
      required: [id, fundId, fundName, type, flow, amount, category, description, occurredOn, status, proposer, originalId, createdAt]
      properties:
        id: { type: string }
        fundId: { type: string }
        fundName: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        flow: { $ref: '#/components/schemas/TransactionFlow' }
        amount:
          type: integer
          minimum: 1
          description: VND, luôn dương (BR-FIN-04); chiều tiền nằm ở `flow`.
        category: { $ref: '#/components/schemas/FinanceCategory' }
        description: { type: string }
        occurredOn:
          $ref: '#/components/schemas/NullableDate'
          description: Ngày tiền vào, ra thật; chỉ có khi đã ghi sổ.
        status: { $ref: '#/components/schemas/TransactionStatus' }
        proposer: { $ref: '#/components/schemas/PersonRef' }
        originalId:
          $ref: '#/components/schemas/NullableString'
          description: Giao dịch gốc của một điều chỉnh (BR-FIN-01).
        createdAt: { type: string, format: date-time }
    TransactionRef:
      type: object
      required: [id, type, flow, amount, description, status]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        flow: { $ref: '#/components/schemas/TransactionFlow' }
        amount: { type: integer, minimum: 1 }
        description: { type: string }
        status: { $ref: '#/components/schemas/TransactionStatus' }
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          required: [approver, poster, attachments, original, adjustments, counterpartFundName, rejectionReason, decidedAt, postedAt, cancelledBy, cancelledAt, cancellationReason, advanceId, allowedActions, version]
          properties:
            advanceId:
              $ref: '#/components/schemas/NullableString'
              description: Tạm ứng sinh ra khoản chi này khi ghi Đã ứng (FR-FIN-07).
            approver:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            poster:
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            attachments:
              type: array
              items: { $ref: '#/components/schemas/FileRef' }
            original:
              oneOf:
                - $ref: '#/components/schemas/TransactionRef'
                - type: 'null'
            adjustments:
              type: array
              items: { $ref: '#/components/schemas/TransactionRef' }
            counterpartFundName:
              $ref: '#/components/schemas/NullableString'
              description: Quỹ nhận của giao dịch chuyển quỹ.
            rejectionReason: { $ref: '#/components/schemas/NullableString' }
            decidedAt: { $ref: '#/components/schemas/NullableDateTime' }
            postedAt: { $ref: '#/components/schemas/NullableDateTime' }
            cancelledBy:
              description: Người hủy khoản chi đã duyệt (`CANCEL`).
              oneOf:
                - $ref: '#/components/schemas/PersonRef'
                - type: 'null'
            cancelledAt: { $ref: '#/components/schemas/NullableDateTime' }
            cancellationReason: { $ref: '#/components/schemas/NullableString' }
            allowedActions:
              type: array
              items: { $ref: '#/components/schemas/TransactionAction' }
            version: { type: integer }
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/TransactionSummary' }
    CreateTransactionRequest:
      type: object
      required: [fundId, type, amount, description, attachmentIds]
      properties:
        fundId: { type: string }
        type:
          type: string
          enum: [INCOME, EXPENSE, ADJUSTMENT]
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        category:
          $ref: '#/components/schemas/FinanceCategory'
          description: Bắt buộc với khoản thu, khoản chi; điều chỉnh lấy theo giao dịch gốc.
        description: { type: string, minLength: 3, maxLength: 200 }
        occurredOn:
          type: string
          format: date
          description: Ngày thu, chỉ dùng cho `INCOME`.
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string }
        originalTransactionId:
          type: string
          description: Giao dịch gốc, chỉ dùng cho `ADJUSTMENT`.
        direction:
          $ref: '#/components/schemas/TransactionFlow'
          description: Tăng (`IN`) hay giảm (`OUT`) quỹ, chỉ dùng cho `ADJUSTMENT`.
    FundTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action:
          type: string
          enum: [SETTLE]
        version: { type: integer }
        shares:
          type: array
          description: Khoản chia cho CLB đồng tổ chức; không gửi hoặc rỗng thì toàn bộ số dư về Quỹ chung.
          items: { $ref: '#/components/schemas/SettleShare' }
    SettleShare:
      type: object
      required: [clubId, amount, note]
      properties:
        clubId: { type: string }
        amount: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 200 }
    TransactionTransitionRequest:
      type: object
      required: [action, version]
      properties:
        action:
          type: string
          enum: [WITHDRAW, APPROVE, REJECT, POST, CANCEL]
        version: { type: integer }
        reason:
          type: string
          maxLength: 500
          description: Bắt buộc từ 5 đến 500 ký tự khi `REJECT` hoặc `CANCEL`.
