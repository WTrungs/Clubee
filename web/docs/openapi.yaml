openapi: 3.1.0
info:
  title: Clubee API
  version: 0.1.0-draft
  summary: Bản nháp hợp đồng REST giữa web và backend Spring Boot.
  description: |
    Viết theo mock MSW ở `src/api/mocks/handlers/`. Test `src/api/mocks/openapiSync.test.ts` kiểm tra mọi route mock
    đều có ở đây và ngược lại.

    Quy ước chung (phân trang, Problem Details, CSRF, `version` + 409, `allowedActions`): `docs/apiConventions.md`.
    Khi backend có spec do springdoc sinh thì spec đó là nguồn chuẩn; chỗ nào khác thì sửa mock và client trong `src/api/`.

    - Ngày giờ ISO 8601 có offset (`2026-11-02T18:30:00+07:00`); ngày không có giờ dạng `2026-11-02`.
    - Không có `DELETE` cho dữ liệu nghiệp vụ (BR-DATA-01): ẩn, đóng, hủy là chuyển trạng thái.
    - `allowedActions` do máy chủ tính tại thời điểm đọc; web chỉ dùng để ẩn, hiện nút. Máy chủ vẫn kiểm tra lại mọi request.
  license:
    name: Đồ án môn học SE100, Nhóm 18
servers:
  - url: /api/v1
    description: Cùng origin với web; khi dev, Vite proxy hoặc MSW xử lý.
tags:
  - name: ACC
    description: Tài khoản (SRS 5.1)
  - name: CLB
    description: CLB, danh bạ (SRS 5.2)
  - name: MEM
    description: Thành viên (SRS 5.3)
  - name: ORG
    description: Cơ cấu, chức vụ (SRS 5.4)
  - name: TERM
    description: Nhiệm kỳ, bàn giao (SRS 5.5)
  - name: ATT
    description: Sinh hoạt, điểm danh (SRS 5.7)
  - name: EVT
    description: Sự kiện, ban tổ chức (SRS 5.8)
  - name: TASK
    description: Công việc (SRS 5.9)
  - name: FIN
    description: Tài chính (SRS 5.10)
  - name: NOT
    description: Thông báo (SRS 5.13)
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [ACC]
      operationId: login
      summary: Đăng nhập (FR-ACC-02)
      description: |
        Tạo phiên cookie của Spring Session và trả người dùng hiện tại.
        Lỗi: 401 `BAD_CREDENTIALS`; 403 `EMAIL_NOT_VERIFIED` (tài khoản Chờ xác thực), `ACCOUNT_LOCKED` (ST-ACC).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [ACC]
      operationId: logout
      summary: Đăng xuất (FR-ACC-02)
      description: Thu hồi phiên trên thiết bị này. Phiên đã hết hoặc chưa đăng nhập vẫn trả 204.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Đã đăng xuất.
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/register:
    post:
      tags: [ACC]
      operationId: register
      summary: Đăng ký tài khoản (FR-ACC-01)
      description: |
        Tạo tài khoản ở Chờ xác thực và gửi email xác thực.
        Lỗi: 400 `VALIDATION` (họ tên từ 2 ký tự, email hợp lệ, mật khẩu 8–72 ký tự); 409 `EMAIL_TAKEN`.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản, chờ xác thực email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/password-reset-requests:
    post:
      tags: [ACC]
      operationId: requestPasswordReset
      summary: Quên mật khẩu (FR-ACC-03)
      description: Trả 202 với mọi email để không lộ email nào đã đăng ký. Liên kết dùng một lần, hết hạn sau 30 phút (SRS 9.2).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Đã nhận yêu cầu.
        '403': { $ref: '#/components/responses/Forbidden' }
  /me:
    get:
      tags: [ACC]
      operationId: getCurrentUser
      summary: Người dùng hiện tại (FR-ACC-06)
      description: |
        Người dùng, các CLB đang tham gia (gồm tư cách Chờ duyệt, không gồm Đã rời) và sự kiện đang làm BTC ở CLB khác.
        Chưa đăng nhập, hết phiên hoặc tài khoản vừa bị khóa (`ACCOUNT_LOCKED`, khóa là thu hồi phiên) thì 401.
      responses:
        '200':
          description: Người dùng hiện tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/metrics:
    get:
      tags: [ACC]
      operationId: getAdminMetrics
      summary: Số liệu vận hành cho quản trị hệ thống (FR-ACC-09)
      description: |
        Chỉ tài khoản Admin. Số CLB, số tài khoản người dùng theo trạng thái, số người đăng nhập trong 30 ngày,
        số yêu cầu chuyển quyền chờ xử lý, số lỗi hệ thống 24 giờ qua. Không có dữ liệu nội bộ của CLB (SRS 3.4).
        Lỗi: 403 `ADMIN_ONLY`.
      responses:
        '200':
          description: Số liệu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/accounts:
    get:
      tags: [ACC]
      operationId: searchAdminAccounts
      summary: Tìm tài khoản theo email (FR-ACC-09)
      description: |
        Chỉ tài khoản Admin. Bắt buộc `email` từ 3 ký tự (khớp chứa, không phân biệt hoa thường) để không liệt kê toàn bộ
        người dùng. Không trả SĐT, ngày sinh, tên CLB; chỉ số CLB đang tham gia (SRS 3.4).
        Lỗi: 400 `VALIDATION`; 403 `ADMIN_ONLY`.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, minLength: 3 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang tài khoản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/accounts/{userId}/transitions:
    post:
      tags: [ACC]
      operationId: transitionAccount
      summary: Khóa, mở khóa tài khoản (FR-ACC-09, ST-ACC)
      description: |
        Chỉ tài khoản Admin. Thứ tự kiểm: quyền → version → trạng thái → lý do. Khóa thu hồi luôn phiên đang mở của người đó.
        Ghi nhật ký giá trị trước, sau và lý do (NFR-SEC-05).
        Lỗi: 400 `VALIDATION` (lý do 5–500 ký tự); 403 `ADMIN_ONLY`; 404 `ACCOUNT_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `SELF_LOCK`, `ADMIN_TARGET`, `INVALID_TRANSITION` (chưa xác thực, đã khóa, mở khóa tài khoản không bị khóa).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountTransitionRequest' }
      responses:
        '200':
          description: Tài khoản sau khi đổi trạng thái.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/accounts/{userId}/password-reset-links:
    post:
      tags: [ACC]
      operationId: sendPasswordResetLink
      summary: Gửi lại liên kết đặt mật khẩu (FR-ACC-09)
      description: |
        Chỉ tài khoản Admin, chỉ tài khoản Hoạt động. Máy chủ gửi thư (IF-03) và ghi nhật ký.
        Lỗi: 403 `ADMIN_ONLY`; 404 `ACCOUNT_NOT_FOUND`; 422 `ACCOUNT_LOCKED`, `INVALID_TRANSITION` (chưa xác thực).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Đã nhận yêu cầu gửi thư.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/presidency-transfer-requests:
    get:
      tags: [ACC]
      operationId: listAdminTransferRequests
      summary: Yêu cầu chuyển quyền Chủ nhiệm cho Admin (FR-ACC-08)
      description: |
        Chỉ tài khoản Admin. `PENDING` cũ nhất trước; `HANDLED` (đã duyệt, từ chối, hủy) mới xử lý nhất trước.
        Yêu cầu đang chờ có `checkNow` để so với kết quả kiểm lúc gửi.
        Lỗi: 400 `VALIDATION`; 403 `ADMIN_ONLY`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, HANDLED]
            default: PENDING
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTransferRequestPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/presidency-transfer-requests/{requestId}/candidates:
    get:
      tags: [ACC]
      operationId: listTransferCandidates
      summary: Thành viên Chính thức của CLB có yêu cầu (FR-ACC-08, R-04)
      description: |
        Chỉ tài khoản Admin, chỉ khi yêu cầu còn chờ. Chỉ tên, ban, ngày gia nhập của thành viên Chính thức của đúng CLB đó,
        trừ người đang là Chủ nhiệm.
        Mỗi lần gọi ghi nhật ký (SRS 3.4).
        Lỗi: 403 `ADMIN_ONLY`; 404 `TRANSFER_REQUEST_NOT_FOUND`; 422 `TRANSFER_NOT_PENDING`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Danh sách người có thể nhận chức.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/presidency-transfer-requests/{requestId}/decision:
    post:
      tags: [ACC]
      operationId: decideTransferRequest
      summary: Chuyển quyền hoặc từ chối (FR-ACC-08)
      description: |
        Chỉ tài khoản Admin. Ghi chú bắt buộc (5–1000 ký tự) cho cả hai nhánh. Thứ tự kiểm: quyền → version → trạng thái →
        kiểm lại ban chủ nhiệm (chỉ khi duyệt) → dữ liệu.
        Duyệt: kết thúc mọi chức Chủ nhiệm còn mở (ngày cuối là hôm qua), gán Chủ nhiệm mới tới hết nhiệm kỳ; Phó chủ nhiệm,
        Thủ quỹ giữ nguyên; không xét nhiệm kỳ quá hạn hay đang bàn giao. Cả CLB nhận thông báo kèm lý do. Từ chối thì báo người gửi.
        Ghi nhật ký trước, sau, lý do (BR-DATA-03).
        Lỗi: 400 `VALIDATION` (ghi chú; người nhận không phải thành viên Chính thức của CLB hoặc đang là Chủ nhiệm);
        403 `ADMIN_ONLY`; 404; 409 `VERSION_CONFLICT`; 422 `TRANSFER_NOT_PENDING`, `BOARD_ACTIVE` (ban chủ nhiệm đã đăng nhập lại).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferDecisionRequest' }
      responses:
        '200':
          description: Yêu cầu sau khi xử lý.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTransferRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /me/profile:
    get:
      tags: [ACC]
      operationId: getProfile
      summary: Hồ sơ cá nhân (FR-ACC-05)
      description: Hồ sơ dùng chung cho mọi CLB. `pendingEmail` là email mới đang chờ xác thực.
      responses:
        '200':
          description: Hồ sơ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [ACC]
      operationId: updateProfile
      summary: Sửa hồ sơ cá nhân (FR-ACC-05)
      description: |
        Họ tên 2–100 ký tự; SĐT `null` hoặc 10 chữ số bắt đầu bằng 0, đã bỏ dấu cách, dấu chấm, gạch ngang;
        ngày sinh `null` hoặc từ 1900-01-01 đến trước hôm nay. Email đổi qua `email-change-requests`.
        Lỗi: 400 `VALIDATION`; 409 `VERSION_CONFLICT`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Hồ sơ sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/avatar:
    post:
      tags: [ACC]
      operationId: uploadAvatar
      summary: Đổi ảnh đại diện (FR-ACC-05)
      description: |
        Trường `file`: chỉ JPG, PNG (đuôi tệp và kiểu khớp nhau), tối đa 15 MB (IF-05). Thay ảnh cũ, tăng `version` của hồ sơ.
        Lỗi: 400 `VALIDATION` (thiếu tệp), `INVALID_FILE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '200':
          description: Hồ sơ với ảnh mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/email-change-requests:
    post:
      tags: [ACC]
      operationId: requestEmailChange
      summary: Đổi email, xác thực lại (FR-ACC-05)
      description: |
        Gửi liên kết xác thực tới email mới; email cũ vẫn dùng để đăng nhập đến khi người dùng mở liên kết. Yêu cầu mới
        thay yêu cầu đang chờ. Cần mật khẩu hiện tại.
        Lỗi: 400 `VALIDATION` (email sai, trùng email hiện tại), `WRONG_PASSWORD`; 409 `EMAIL_TAKEN`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: Đã gửi liên kết xác thực.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/password:
    post:
      tags: [ACC]
      operationId: changePassword
      summary: Đổi mật khẩu (FR-ACC-04)
      description: |
        Cần mật khẩu hiện tại; mật khẩu mới 8–72 ký tự, khác mật khẩu cũ. Đổi xong máy chủ thu hồi mọi phiên khác của
        người dùng, phiên đang dùng giữ nguyên (NFR-SEC-01).
        Lỗi: 400 `VALIDATION`, `WRONG_PASSWORD` (gắn vào ô `currentPassword`).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Đã đổi mật khẩu.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/notifications:
    get:
      tags: [NOT]
      operationId: listNotifications
      summary: Hộp thông báo (FR-NOT-03)
      description: |
        Thông báo của người gọi từ mọi CLB, mới nhất trước. Chỉ trả tiêu đề và đích đến, không trả nội dung (xem chi tiết).
        Lọc theo loại, chỉ chưa đọc, từ khóa trong tiêu đề hoặc tên CLB. Lỗi: 400 `VALIDATION` (loại sai).
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/NotificationCategory' }
        - name: unread
          in: query
          description: '`true` để chỉ lấy thông báo chưa đọc.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang thông báo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications/unread-count:
    get:
      tags: [NOT]
      operationId: getUnreadNotificationCount
      summary: Số thông báo chưa đọc (FR-NOT-03)
      description: Web hỏi lại mỗi 60 giây để cập nhật chuông thông báo; SRS không yêu cầu thời gian thực.
      responses:
        '200':
          description: Số chưa đọc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications/{notificationId}:
    get:
      tags: [NOT]
      operationId: getNotification
      summary: Chi tiết thông báo (FR-NOT-03, BR-SEC-02)
      description: |
        Kiểm tra quyền tại thời điểm mở (BR-SEC-02). Thông báo do người gửi soạn (`MANUAL`) chỉ mở được khi người nhận còn
        thuộc nhóm nhận lúc gửi: toàn CLB thì còn là thành viên; ban thì ban chính vẫn là ban đó; BTC sự kiện thì còn trong BTC
        (gồm CTV, nhân sự CLB đồng tổ chức khi sự kiện còn hoạt động). Không còn là thành viên trả 403 `NOT_A_MEMBER`, còn là
        thành viên nhưng đã rời nhóm (hoặc người ngoài CLB đã rời BTC) trả 403 `NOT_IN_AUDIENCE`, kèm lý do. Thông báo loại `FINANCE` nêu số tiền,
        quỹ, người đề xuất nên chỉ mở được khi người nhận còn xem được giao dịch `target.id`, nếu không trả 403 `FORBIDDEN`.
        Thông báo hệ thống khác nói về chính người nhận; màn hình đích (`target`) tự kiểm tra quyền khi mở.
        Không phải người nhận thì 404 `NOTIFICATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Chi tiết thông báo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/notifications/{notificationId}/read:
    post:
      tags: [NOT]
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc (FR-NOT-03)
      description: Đã đọc rồi thì giữ nguyên thời điểm đọc. Lỗi 404 `NOTIFICATION_NOT_FOUND`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Thông báo sau khi đánh dấu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/notifications/read-all:
    post:
      tags: [NOT]
      operationId: markAllNotificationsRead
      summary: Đánh dấu tất cả đã đọc (FR-NOT-03)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Đã đánh dấu.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs:
    get:
      tags: [CLB]
      operationId: listClubDirectory
      summary: Danh bạ CLB (FR-CLB-05)
      description: |
        Thông tin công khai của CLB (SRS 3.5): tên, logo, lĩnh vực, mô tả, liên hệ công khai. Kèm `myMembership` là
        tư cách gần nhất của người gọi.
        `allowedActions` có `REQUEST_TO_JOIN` khi người gọi chưa có tư cách đang hoạt động ở CLB đó.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 12 }
      responses:
        '200':
          description: Trang CLB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [CLB]
      operationId: createClub
      summary: Tạo CLB (FR-CLB-01)
      description: |
        Ai có tài khoản cũng tạo được, không cần duyệt; không chặn trùng tên (nền tảng phục vụ nhiều trường). Một lần ghi
        tạo: CLB ở Hoạt động (thu thập MSSV tắt, có bước thử việc, SRS 9.2), nhiệm kỳ đầu "Nhiệm kỳ đầu tiên" Đang chạy
        từ hôm nay đến hết 12 tháng, tư cách Chính thức và chức Chủ nhiệm cho người tạo, bảng phân quyền mặc định
        (mock dùng quyền cố định cho tới khi có FR-ORG-05).
        Kiểm tra: tên 3–100 ký tự, tên viết tắt 2–10, lĩnh vực 2–50 (chữ tự do), mô tả 10–1000.
        Lỗi: 400 `VALIDATION`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClubRequest' }
      responses:
        '201':
          description: CLB mới, người gọi là Chủ nhiệm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}:
    get:
      tags: [CLB]
      operationId: getClub
      summary: Thông tin CLB hiện hành
      description: |
        Thông tin CLB (gồm liên hệ công khai; nội quy chỉ thành viên xem), nhiệm kỳ đang phụ trách (`currentTerm`: Đang chạy hoặc Đang bàn giao) và
        `allowedActions` cấp CLB. Khách của sự kiện (người ngoài CLB đang làm CTV hoặc nhân sự CLB đồng tổ chức của một sự kiện
        còn hoạt động) nhận `viewerRole: EVENT_GUEST` và chỉ thông tin công khai: `rules` rỗng, `memberCount` 0,
        `currentTerm` null, `myPositionTitles`, `allowedActions` rỗng, `generalFundId` rỗng (SRS 3.5, FR-EVT-07).
        Lỗi: 404 `CLUB_NOT_FOUND`; 403 `MEMBERSHIP_PENDING` (yêu cầu gia nhập đang chờ duyệt), `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Thông tin CLB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [CLB]
      operationId: updateClub
      summary: Cập nhật hồ sơ CLB (FR-CLB-02)
      description: |
        Chỉ ban chủ nhiệm (`allowedActions` có `EDIT_CLUB`). Sửa tên, tên viết tắt, lĩnh vực, mô tả, liên hệ công khai,
        nội quy (văn bản thuần, tối đa 5000 ký tự), cờ thu thập MSSV. `contactUrl` chỉ nhận `http://`, `https://`;
        SĐT 10–11 chữ số bắt đầu bằng 0. Tắt thu thập MSSV thì MSSV đã lưu không còn được trả về (SRS 3.5).
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`; 409 `VERSION_CONFLICT`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClubRequest' }
      responses:
        '200':
          description: CLB sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/permission-matrix:
    get:
      tags: [ORG]
      operationId: getPermissionMatrix
      summary: Bảng phân quyền theo chức vụ của CLB (FR-ORG-05)
      description: |
        Ban chủ nhiệm xem được. Mỗi ô có trạng thái với người xem: `LOCKED` (BR-ACL-04, 05, kèm lý do), `OWN_ROLE` (chức vụ
        người xem đang giữ, BR-ACL-03), `NOT_APPLICABLE` (vô nghĩa với phạm vi của chức vụ, BR-ACL-02), `EDITABLE`.
        `allowedActions` có `EDIT`, `RESET` khi người xem có quyền chỉnh bảng phân quyền. Quyền xem thông tin (SRS 3.5) không nằm ở đây.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Bảng phân quyền.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [ORG]
      operationId: updatePermissionMatrix
      summary: Sửa nhiều ô bảng phân quyền một lần (FR-ORG-05)
      description: |
        Tất cả hoặc không gì. Thứ tự kiểm: quyền chỉnh bảng phân quyền (403) → hàng của chức vụ người gọi đang giữ (403 `OWN_ROLE`) →
        version (409) → ô khóa hoặc không áp dụng (422 `PERMISSION_LOCKED`, `errors[]` theo `changes[i]`). Ô trở về mặc định thì
        bỏ bản ghi khác mặc định. Mỗi ô đổi ghi nhật ký trước, sau (BR-DATA-03); người đang giữ chức vụ bị đổi nhận một thông báo
        gộp theo chức vụ (R-02). Có hiệu lực ngay: lần đọc sau mọi `allowedActions` tính theo bảng phân quyền mới.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`, `OWN_ROLE`; 409 `VERSION_CONFLICT`; 422 `PERMISSION_LOCKED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePermissionMatrixRequest' }
      responses:
        '200':
          description: Bảng phân quyền sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionMatrix' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/permission-matrix/reset:
    post:
      tags: [ORG]
      operationId: resetPermissionMatrix
      summary: Khôi phục bảng phân quyền về mặc định (FR-ORG-05)
      description: |
        Đưa mọi ô người gọi sửa được về mặc định; hàng của chức vụ người gọi đang giữ giữ nguyên, số ô còn lệch ở
        `changedFromDefault`. Ghi nhật ký từng ô, thông báo như khi sửa.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 409 `VERSION_CONFLICT`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionOnly' }
      responses:
        '200':
          description: Bảng phân quyền sau khi khôi phục.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/permission-matrix/changes:
    get:
      tags: [ORG]
      operationId: listPermissionMatrixChanges
      summary: Thay đổi gần đây của bảng phân quyền (FR-ORG-05)
      description: Ban chủ nhiệm xem được; mới nhất trước, giá trị trước và sau của từng ô. Lỗi 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionMatrixChangePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/presidency-transfer-request:
    get:
      tags: [ACC]
      operationId: getPresidencyTransferOverview
      summary: Điều kiện và yêu cầu chuyển quyền Chủ nhiệm của CLB (FR-ACC-08)
      description: |
        Mọi thành viên xem được. `boardInactive` khi mọi người giữ chức ban chủ nhiệm không đăng nhập quá 30 ngày (tham số hệ
        thống) hoặc không còn ai giữ chức. `request` là yêu cầu đang chờ của CLB, không có thì yêu cầu gần nhất của người xem;
        lý do, ghi chú xử lý chỉ người gửi nhận.
        Lỗi: 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Điều kiện và yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresidencyTransferOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/presidency-transfer-requests:
    post:
      tags: [ACC]
      operationId: requestPresidencyTransfer
      summary: Yêu cầu Admin chuyển quyền Chủ nhiệm (FR-ACC-08)
      description: |
        Chỉ thành viên Chính thức. Lưu kết quả kiểm ban chủ nhiệm lúc gửi.
        Lỗi: 400 `VALIDATION` (lý do 10–1000 ký tự); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 409 `TRANSFER_REQUEST_EXISTS`;
        422 `BOARD_ACTIVE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201':
          description: Yêu cầu vừa gửi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTransferRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/presidency-transfer-requests/{requestId}/cancellation:
    post:
      tags: [ACC]
      operationId: cancelPresidencyTransfer
      summary: Hủy yêu cầu chuyển quyền (FR-ACC-08)
      description: |
        Chỉ người gửi, chỉ khi yêu cầu còn chờ.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `TRANSFER_REQUEST_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `TRANSFER_NOT_PENDING`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionOnly' }
      responses:
        '200':
          description: Yêu cầu sau khi hủy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTransferRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/settings:
    get:
      tags: [CLB]
      operationId: getClubSettings
      summary: Tham số CLB (FR-CLB-03)
      description: |
        Các tham số cấp CLB đang dùng (SRS 9.2): bước thử việc, hạn liên kết mời, hạn hủy đăng ký, hạn xác nhận lại khi dời giờ,
        số phút mở điểm danh trước giờ, chu kỳ đổi mã QR, nhắc hạn công việc, ngưỡng chi bắt buộc chứng từ, hạn quyết toán tạm ứng,
        mốc học kỳ cho báo cáo. Chỉ người có quyền cấu hình CLB theo bảng phân quyền (mặc định là ban chủ nhiệm).
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Tham số hiện hành.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [CLB]
      operationId: updateClubSettings
      summary: Sửa tham số CLB (FR-CLB-03)
      description: |
        Gửi đủ mọi tham số kèm `version` của tham số (tách khỏi `version` hồ sơ CLB). Giá trị mới chỉ áp cho thao tác từ nay:
        khoản chi Đã duyệt, Đã ghi sổ không bị xét lại theo ngưỡng mới (khoản đang Đề xuất thì xét khi duyệt); lời mời đã tạo
        giữ hạn cũ; tắt bước thử việc không đổi người đang Thử việc; buổi điểm danh đã chốt giữ nguyên.
        Thứ tự kiểm: quyền → version → giá trị.
        Lỗi: 400 `VALIDATION` (từng ô trong `errors[]`); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`; 409 `VERSION_CONFLICT`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClubSettingsRequest' }
      responses:
        '200':
          description: Tham số sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/logo:
    post:
      tags: [CLB]
      operationId: uploadClubLogo
      summary: Đổi logo CLB (FR-CLB-02)
      description: |
        Chỉ ban chủ nhiệm. Trường `file`: JPG, PNG (đuôi tệp và kiểu khớp nhau), tối đa 15 MB (IF-05). Tăng `version` của CLB.
        Lỗi: 400 `VALIDATION` (thiếu tệp), `INVALID_FILE`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '200':
          description: CLB với logo mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/announcement-audiences:
    get:
      tags: [NOT]
      operationId: listAnnouncementAudiences
      summary: Nhóm nhận thông báo người gọi được chọn (FR-NOT-01)
      description: |
        Theo phạm vi chức vụ tại thời điểm gọi. Ban chủ nhiệm: toàn CLB (Thử việc, Chính thức, Tạm nghỉ), mọi ban đang
        hoạt động, ban tổ chức mọi sự kiện đang chạy (Đã duyệt đến Đã kết thúc). Trưởng ban, Phó ban: ban mình.
        Trưởng BTC: ban tổ chức sự kiện mình (Trưởng BTC, trưởng tiểu ban, nhân sự còn hiệu lực). Người không có chức vụ
        nhận danh sách rỗng. Lỗi: 403 `NOT_A_MEMBER`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Các nhóm nhận, có thể rỗng.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnnouncementAudience' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/announcements:
    post:
      tags: [NOT]
      operationId: sendAnnouncement
      summary: Soạn và gửi thông báo (FR-NOT-01)
      description: |
        Ghi một thông báo loại MANUAL, nhóm Thông báo CLB, cho mọi người trong nhóm nhận trừ chính người gửi. Người nhận
        mở nội dung qua `GET /me/notifications/{notificationId}`, máy chủ kiểm tra lại tư cách lúc mở (BR-SEC-02).
        `sendEmail` bật thì gửi kèm email (IF-03); mock chỉ lưu cờ.
        Kiểm tra theo thứ tự: tư cách thành viên, nhóm nhận thuộc phạm vi chức vụ, nội dung, người nhận.
        Lỗi: 400 `VALIDATION` (thiếu nhóm nhận; tiêu đề 3–150 ký tự; nội dung 1–2000 ký tự); 403 `NOT_A_MEMBER`,
        `FORBIDDEN` (nhóm nhận ngoài phạm vi chức vụ); 404 `CLUB_NOT_FOUND`; 422 `NO_RECIPIENTS` (nhóm không có ai ngoài người gửi).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendAnnouncementRequest' }
      responses:
        '201':
          description: Đã gửi; kèm số người đã nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAnnouncementResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/join-requests:
    post:
      tags: [MEM]
      operationId: requestToJoin
      summary: Gửi yêu cầu gia nhập (FR-MEM-02)
      description: |
        Tạo tư cách Chờ duyệt. Lời giới thiệu 10–500 ký tự; MSSV (5–20 chữ hoặc số) bắt buộc khi CLB thu thập.
        Gửi từ trang lời mời thì kèm `invitationToken` (FR-MEM-01): vẫn tạo Chờ duyệt, ghi lại lời mời và tăng số lần dùng.
        Lỗi: 404 `CLUB_NOT_FOUND`; 400 `VALIDATION`; 403 `INVITATION_FOR_OTHER` (lời mời email của tài khoản khác);
        409 `ALREADY_MEMBER` khi đang có tư cách hoạt động (BR-MEM-01); 422 `INVITATION_NOT_ACTIVE` (mã sai, hết hạn, đã thu hồi, đã dùng).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJoinRequest' }
      responses:
        '201':
          description: Đã gửi yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [MEM]
      operationId: listJoinRequests
      summary: Yêu cầu gia nhập đang chờ (FR-MEM-03)
      description: |
        Chỉ ban chủ nhiệm. Mỗi yêu cầu kèm `pastMemberships` (lịch sử cũ và lý do rời) nếu người này từng là thành viên.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang yêu cầu Chờ duyệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/invitations:
    get:
      tags: [MEM]
      operationId: listInvitations
      summary: Lời mời gia nhập của CLB (FR-MEM-01)
      description: |
        Người có quyền quản lý thành viên theo bảng phân quyền (mặc định ban chủ nhiệm). Mới nhất trước; lọc theo trạng thái suy ra.
        Lỗi: 400 `VALIDATION` (trạng thái lọc sai); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang lời mời.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [MEM]
      operationId: createInvitation
      summary: Tạo liên kết mời hoặc mời qua email (FR-MEM-01)
      description: |
        Hạn = lúc tạo + tham số `inviteLinkDays` của CLB tại thời điểm đó (FR-CLB-03); đổi tham số sau này không đổi hạn.
        Liên kết dùng nhiều lần tới khi hết hạn; lời mời qua email dùng một lần, chỉ tài khoản có đúng email đó mở được.
        Máy chủ gửi thư (IF-03); email trùng tài khoản đã có thì người đó nhận thêm thông báo trong app (đích `INVITATION`).
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`;
        409 `ALREADY_MEMBER` (người có email này đang có tư cách hoạt động, kể cả Chờ duyệt), `INVITATION_EXISTS` (email đã có lời mời còn hiệu lực).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Lời mời vừa tạo, kèm `token` để ghép đường dẫn `/invite/{token}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/invitations/{invitationId}/revocation:
    post:
      tags: [MEM]
      operationId: revokeInvitation
      summary: Thu hồi lời mời (FR-MEM-01)
      description: |
        Thứ tự kiểm: quyền → version → trạng thái. Yêu cầu đã gửi bằng lời mời này vẫn giữ nguyên.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`, `INVITATION_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `INVITATION_NOT_ACTIVE` (đã hết hạn, đã thu hồi, đã dùng).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionOnly' }
      responses:
        '200':
          description: Lời mời sau khi thu hồi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /invitations/{token}:
    get:
      tags: [MEM]
      operationId: getInvitationPreview
      summary: Mở liên kết mời (FR-MEM-01)
      description: |
        Cần đăng nhập. Chỉ trả thông tin công khai của CLB (SRS 3.5), tên người mời, hạn, trạng thái và tư cách gần nhất
        của người xem ở CLB. Hết hạn, đã thu hồi, đã dùng vẫn trả 200 kèm trạng thái để trang nêu lý do.
        Lỗi: 403 `INVITATION_FOR_OTHER` (lời mời email của tài khoản khác; không nêu trạng thái); 404 `INVITATION_NOT_FOUND`.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thông tin lời mời.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/members/facets:
    get:
      tags: [MEM]
      operationId: getMemberFacets
      summary: Giá trị lọc danh sách thành viên
      description: Các ban (kèm cờ đã đóng) và các năm gia nhập. Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Giá trị lọc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberFacets' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/members:
    get:
      tags: [MEM]
      operationId: listMembers
      summary: Danh sách thành viên (FR-MEM-04)
      description: |
        Mặc định gồm Thử việc, Chính thức, Tạm nghỉ; `status=LEFT` để xem người đã rời (không gồm yêu cầu bị từ chối).
        `contact`, `studentId` là `null` với người không thuộc ban chủ nhiệm (SRS 3.5). Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          description: Lặp lại tham số để lọc nhiều trạng thái.
          schema:
            type: array
            items:
              type: string
              enum: [PROBATION, ACTIVE, ON_LEAVE, LEFT]
          style: form
          explode: true
        - name: departmentId
          in: query
          description: Ban chính.
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/MemberRoleFilter' }
        - name: joinYear
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Trang thành viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/members/{membershipId}:
    get:
      tags: [MEM]
      operationId: getMember
      summary: Chi tiết thành viên
      description: |
        `leftOn`, `exitKind`, `leaveReason`, `internalNote`, `infoHistory`, `history`, `pastMemberships`, `backlogCount` chỉ có giá trị với ban chủ nhiệm;
        người khác nhận `null`. Yêu cầu chờ duyệt hoặc bị từ chối không phải thành viên nên trả 404 `MEMBER_NOT_FOUND`
        (xem ở `join-requests`, `pastMemberships`). Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Chi tiết thành viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [MEM]
      operationId: updateMemberInfo
      summary: Sửa thông tin thành viên trong CLB (FR-MEM-05)
      description: |
        Người có quyền quản lý thành viên theo bảng phân quyền (mặc định ban chủ nhiệm). Gửi đủ bốn trường; chuỗi rỗng là xóa.
        `studentId` bị bỏ qua khi CLB không thu thập MSSV. Mỗi trường đổi ghi một dòng `infoHistory`; không đổi gì thì
        `version` giữ nguyên.

        Ngày gia nhập, chỉ kiểm khi khác giá trị đang lưu: ngày có thật, không sau hôm nay, không trước ngày thành lập CLB,
        không trước ngày rời CLB lần trước (yêu cầu bị từ chối không tính), không sau ngày bắt đầu chức vụ đầu tiên của lần
        sinh hoạt này (không tính trưởng tiểu ban là nhân sự CLB đồng tổ chức).

        Thứ tự kiểm: quyền → tồn tại → `version` → trạng thái → dữ liệu. Lỗi:
        - 400 `VALIDATION` (lỗi theo ô `displayTitle`, `internalNote`, `studentId`, `joinedOn`; thiếu trường nào thì lỗi ở
          trường đó, không coi là xóa).
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `MEMBER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `MEMBER_LEFT` (hồ sơ người đã rời giữ nguyên, BR-DATA-02).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberInfoRequest' }
      responses:
        '200':
          description: Thành viên sau khi lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/members/{membershipId}/transitions:
    post:
      tags: [MEM]
      operationId: transitionMember
      summary: Duyệt yêu cầu, chuyển trạng thái thành viên (FR-MEM-03, 06, 08)
      description: |
        Chỉ ban chủ nhiệm, theo ST-MEM. Duyệt (`APPROVE_PROBATION`, `APPROVE_ACTIVE`) bắt buộc `departmentId` là ban đang
        hoạt động; các thao tác khác bắt buộc lý do từ 5 ký tự. `APPROVE_PROBATION` chỉ khi CLB bật bước thử việc.
        `REMOVE` thu hồi mọi chức vụ, chuyển việc còn mở vào danh sách tồn đọng (FR-MEM-08).

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `MEMBER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION` (ngoài bảng ST-MEM), `SELF_TRANSITION` (tự chuyển cho mình),
          `HOLDS_STANDING_POSITION` (cho tạm nghỉ khi còn chức vụ thường trực, BR-MEM-05),
          `HANDOVER_APPOINTEE` (cho tạm nghỉ người có trong kết quả bầu của phiên bàn giao đang mở, BR-MEM-05),
          `LAST_PRESIDENT` (đưa Chủ nhiệm cuối cùng ra, BR-ORG-02).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberTransitionRequest' }
      responses:
        '200':
          description: Thành viên sau khi chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/my-membership:
    get:
      tags: [MEM]
      operationId: getMyMembership
      summary: Tư cách của tôi ở CLB (FR-MEM-07)
      description: |
        Chỉ người đang Thử việc, Chính thức hoặc Tạm nghỉ ở CLB (403 `NOT_A_MEMBER` với người khác). Kèm yêu cầu tạm nghỉ
        gần nhất, lý do chưa xin tạm nghỉ được (BR-MEM-05) và các khoản còn tồn khiến chưa tự rời được (BR-MEM-03).
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Tư cách của người gọi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/my-membership/leave-requests:
    post:
      tags: [MEM]
      operationId: requestLeave
      summary: Xin tạm nghỉ (FR-MEM-07)
      description: |
        Chỉ thành viên Chính thức. Ban chủ nhiệm duyệt; người có quyền quản lý thành viên nhận thông báo `MEMBERSHIP`.

        Lỗi:
        - 400 `VALIDATION` (lý do 5–500 ký tự, lỗi ở `reason`).
        - 403 `NOT_A_MEMBER`.
        - 409 `LEAVE_REQUEST_EXISTS` (đã có yêu cầu chờ duyệt).
        - 422 `INVALID_TRANSITION` (không phải Chính thức), `HOLDS_STANDING_POSITION` (còn chức vụ thường trực hoặc có tên
          trong kết quả bầu, BR-MEM-05).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201':
          description: Tư cách sau khi gửi yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/my-membership/leave-requests/{requestId}/withdrawal:
    post:
      tags: [MEM]
      operationId: withdrawLeaveRequest
      summary: Rút yêu cầu tạm nghỉ đang chờ
      description: Lỗi 403 `NOT_A_MEMBER`; 404 `LEAVE_REQUEST_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `REQUEST_CLOSED` (đã được xử lý).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionOnly' }
      responses:
        '200':
          description: Tư cách sau khi rút yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/my-membership/transitions:
    post:
      tags: [MEM]
      operationId: transitionMyMembership
      summary: Tự quay lại sinh hoạt, tự xin rời CLB (FR-MEM-07)
      description: |
        `RETURN`: người đang Tạm nghỉ về Chính thức ngay, không gia nhập lại. `RESIGN`: có hiệu lực ngay khi không còn tồn
        (BR-MEM-03), không cần duyệt; người có quyền quản lý thành viên nhận thông báo. Yêu cầu tạm nghỉ đang chờ thành Đã rút.

        Lỗi:
        - 400 `VALIDATION` (`RESIGN` cần lý do 5–500 ký tự).
        - 403 `NOT_A_MEMBER`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION` (`RETURN` khi không Tạm nghỉ), `RESIGN_BLOCKED` (còn chức vụ, việc chưa xong hoặc chờ mình
          nghiệm thu, có tên trong kết quả bầu; từng khoản ở `errors[]` với `field: 'blockers'`).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyMembershipTransitionRequest' }
      responses:
        '200':
          description: Tư cách sau khi chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/leave-requests:
    get:
      tags: [MEM]
      operationId: listLeaveRequests
      summary: Yêu cầu tạm nghỉ (FR-MEM-07)
      description: |
        Người có quyền quản lý thành viên theo bảng phân quyền (mặc định ban chủ nhiệm). `status=PENDING` (mặc định, cũ trước)
        hoặc `DECIDED` (đã xử lý, mới nhất trước). Lỗi 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, DECIDED], default: PENDING }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Trang yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/leave-requests/{requestId}/decision:
    post:
      tags: [MEM]
      operationId: decideLeaveRequest
      summary: Duyệt hoặc từ chối yêu cầu tạm nghỉ (FR-MEM-07)
      description: |
        Duyệt thì kiểm lại BR-MEM-05 rồi chuyển người gửi sang Tạm nghỉ; từ chối cần ghi chú 5–500 ký tự. Người gửi nhận
        thông báo. Thứ tự kiểm: quyền → tồn tại → `version` → trạng thái.

        Lỗi:
        - 400 `VALIDATION` (`note` khi từ chối).
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `LEAVE_REQUEST_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `REQUEST_CLOSED`, `SELF_TRANSITION` (tự duyệt yêu cầu của mình), `INVALID_TRANSITION` (người gửi không còn
          Chính thức), `HOLDS_STANDING_POSITION`, `HANDOVER_APPOINTEE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecisionRequest' }
      responses:
        '200':
          description: Yêu cầu sau khi xử lý.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/department-transfers:
    post:
      tags: [MEM]
      operationId: transferDepartment
      summary: Chuyển ban chính (FR-MEM-10)
      description: |
        Người có quyền quản lý thành viên theo bảng phân quyền (mặc định ban chủ nhiệm). Chuyển 1–50 người sang một ban đang
        hoạt động, tất cả hoặc không ai. Ban cũ kết thúc ngày hôm qua, ban mới bắt đầu hôm nay (BR-MEM-06); công việc ở ban
        cũ giữ nguyên. Người được chuyển nhận thông báo `MEMBERSHIP`.

        Thứ tự kiểm: quyền → dữ liệu gửi lên → tồn tại → `version` → trạng thái → trùng ban. Lỗi:
        - 400 `VALIDATION`: `toDepartmentId` không phải ban đang hoạt động của CLB; `members` rỗng, quá 50 hoặc trùng người;
          người đã thuộc ban đích (lỗi ở `members[i]`).
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `MEMBER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT` (lỗi ở `members[i]` của từng người đã đổi).
        - 422 `INVALID_TRANSITION` (người đã rời CLB), `HOLDS_DEPARTMENT_POSITION` (còn giữ Trưởng ban, Phó ban chưa kết
          thúc của ban cũ, kể cả chưa hiệu lực; thu hồi trước, BR-ORG-01).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentTransferRequest' }
      responses:
        '200':
          description: Ban đích và những người đã chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentTransferResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/backlog-items:
    get:
      tags: [MEM]
      operationId: listBacklogItems
      summary: Tồn đọng của người bị đưa ra khỏi CLB (FR-MEM-09)
      description: |
        Chỉ ban chủ nhiệm. Trạng thái suy ra mỗi lần đọc: mục đã xử lý khi ban chủ nhiệm đã xử lý (`resolution`), hoặc khi đối
        tượng không còn cần thay (`resolvedNote`):
        - Việc đang làm, việc chờ nghiệm thu: việc đã Hoàn thành hoặc Đã hủy, hoặc đã đổi sang người khác; việc của tiểu ban mà
          sự kiện Đã đóng hoặc Đã hủy (chỉ còn để tra cứu). Việc tự giao cho mình sinh cả hai mục.
        - Chức vụ sự kiện: sự kiện Đã đóng hoặc Đã hủy, hoặc vai trò đã có người giữ.
        - Chức vụ của ban: ban Đã đóng. Chức vụ thường trực: nhiệm kỳ của chức đó đã đóng.

        Thứ tự: theo người cũ (theo tên), rồi chức vụ, việc đang làm, việc chờ nghiệm thu. `size` mặc định 50.
        Lỗi: 400 `VALIDATION` (bộ lọc sai); 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BacklogStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/BacklogKind' }
        - name: formerMemberId
          in: query
          description: Mã người dùng của người đã rời.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang mục tồn đọng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/backlog-items/{itemId}/candidates:
    get:
      tags: [MEM]
      operationId: listBacklogCandidates
      summary: Ứng viên nhận lại mục tồn đọng (FR-MEM-09)
      description: |
        Chỉ ban chủ nhiệm. Theo loại mục:
        - Việc đang làm: thành viên Thử việc, Chính thức (không Tạm nghỉ, BR-MEM-05) của ban; với việc của tiểu ban là nhân sự còn trong
          tiểu ban (BR-TASK-01).
        - Việc chờ nghiệm thu: người quản lý phạm vi của việc (ban chủ nhiệm, trưởng, phó ban, Trưởng BTC, trưởng tiểu ban).
        - Chức vụ thường trực: thành viên Chính thức, với trưởng, phó ban phải có ban chính là ban đó (BR-ORG-01); bỏ người đang giữ.
        - Trưởng BTC: thành viên Thử việc, Chính thức. Trưởng tiểu ban: như trên, bỏ người đang làm trưởng tiểu ban khác của sự kiện
          (BR-ORG-04).
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `BACKLOG_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/BacklogItemId'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Ứng viên, theo tên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/backlog-items/{itemId}/resolution:
    post:
      tags: [MEM]
      operationId: resolveBacklogItem
      summary: Xử lý một mục tồn đọng (FR-MEM-09)
      description: |
        Chỉ ban chủ nhiệm. Thứ tự kiểm: ban chủ nhiệm (403) → mục có tồn tại (404) → `version` (409) → mục đã xử lý
        (422 `BACKLOG_RESOLVED`) → thao tác có được phép lúc này (422, hoặc 403 khi chỉ định Chủ nhiệm, Phó chủ nhiệm mà người gọi
        không phải Chủ nhiệm, Phó chủ nhiệm) → người được chọn (400).
        - `REASSIGN` (việc): việc đang làm đổi người làm (người đó thôi là người phối hợp của việc), việc chờ nghiệm thu đổi người giao;
          ghi lịch sử việc "Giao lại cho … (thay … đã rời CLB)", báo người nhận (FR-NOT-02).
        - `APPOINT` (chức vụ): chức thường trực được cấp từ hôm nay tới hết nhiệm kỳ; đang bàn giao thì 422 `HANDOVER_IN_PROGRESS`,
          nhiệm kỳ quá hạn thì 422 `TERM_OVERDUE`, Chủ nhiệm, Phó chủ nhiệm chỉ Chủ nhiệm, Phó chủ nhiệm chỉ định (403). Trưởng BTC thì thay
          từ hôm nay; trưởng tiểu ban thì thêm vào tiểu ban nếu chưa có, đã làm trưởng tiểu ban khác thì 422 `LEAD_TAKEN`.
        - `DISMISS` (chỉ chức vụ): không cần thay, bắt buộc `reason` 5–500 ký tự.
        Người được chọn phải thuộc danh sách ứng viên (`userId`, 400).

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `BACKLOG_NOT_FOUND`; dữ liệu gốc của mục không còn: `TASK_NOT_FOUND`, `POSITION_NOT_FOUND`, `EVENT_NOT_FOUND`, `NOT_FOUND`
          (tiểu ban).
        - 409 `VERSION_CONFLICT`.
        - 422 `BACKLOG_RESOLVED`, `HANDOVER_IN_PROGRESS`, `TERM_OVERDUE`, `NO_RUNNING_TERM`, `LEAD_TAKEN`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/BacklogItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveBacklogRequest' }
      responses:
        '200':
          description: Mục sau khi xử lý.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/departments:
    get:
      tags: [ORG]
      operationId: listDepartments
      summary: Danh sách ban (FR-ORG-01, 07)
      description: |
        Mảng (không phân trang). Mỗi ban kèm `leads` (trưởng, phó ban đang hoặc sắp có hiệu lực, xem `upcoming`),
        `memberCount`, số việc mở, quá hạn, sắp đến hạn (theo `taskReminderDays` của CLB, cùng quy tắc `TaskSummary.dueSoon`) và `allowedActions`
        (`EDIT`, `CLOSE`, `ASSIGN_POSITION` cho ban chủ nhiệm khi ban đang hoạt động; đang bàn giao hoặc nhiệm kỳ đã quá
        ngày kết thúc thì không có `ASSIGN_POSITION`). Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DepartmentStatus'
            default: ACTIVE
      responses:
        '200':
          description: Các ban.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ORG]
      operationId: createDepartment
      summary: Khai báo ban chuyên môn (FR-ORG-01)
      description: |
        Chỉ ban chủ nhiệm; ban gắn với nhiệm kỳ Đang chạy. Tên 2–80 ký tự, không trùng ban đang hoạt động; mô tả tối đa 500 ký tự.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 422 `NO_RUNNING_TERM`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentRequest' }
      responses:
        '201':
          description: Ban mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/departments/{departmentId}:
    patch:
      tags: [ORG]
      operationId: updateDepartment
      summary: Sửa thông tin ban (FR-ORG-01)
      description: |
        Chỉ ban chủ nhiệm. Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `DEPARTMENT_NOT_FOUND`;
        409 `VERSION_CONFLICT`; 422 `DEPARTMENT_CLOSED` (ban đã đóng chỉ để tra cứu, BR-TERM-04).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDepartmentRequest' }
      responses:
        '200':
          description: Ban sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/departments/{departmentId}/transitions:
    post:
      tags: [ORG]
      operationId: transitionDepartment
      summary: Đóng ban (FR-ORG-01)
      description: |
        Chỉ ban chủ nhiệm; lý do từ 5 ký tự. Ban đã đóng không bị xóa, vẫn tra cứu được (BR-TERM-04).

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `DEPARTMENT_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION` (đã đóng), `DEPARTMENT_NOT_EMPTY` (còn thành viên có ban chính là ban này, BR-MEM-06),
          `DEPARTMENT_HAS_POSITIONS` (còn chức vụ chưa kết thúc).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseDepartmentRequest' }
      responses:
        '200':
          description: Ban sau khi đóng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/positions:
    get:
      tags: [ORG]
      operationId: listPositions
      summary: Tra cứu ai đang giữ chức gì, chức vụ của nhiệm kỳ đã qua (FR-ORG-02, 06)
      description: |
        Mọi thành viên xem được tên, chức vụ, phạm vi, thời hạn (SRS 3.5); `revokeReason` chỉ ban chủ nhiệm nhận.
        Không có `termId` (hoặc `termId` của nhiệm kỳ đang phụ trách): chức vụ đang và sắp có hiệu lực mà người giữ còn đủ tư cách.
        `termId` của nhiệm kỳ Đã đóng: chức vụ thường trực từng có hiệu lực trong khoảng nhiệm kỳ đó, kể cả người đã rời CLB và
        chức bị thu hồi sớm; tên ban theo lúc nhiệm kỳ đóng (BR-DATA-02).
        `status`: `UPCOMING` khi chưa tới `startOn`, `ENDED` khi đã hết hạn hoặc bị thu hồi. `endOn` là ngày hiệu lực cuối.
        `allowedActions: [REVOKE]` với người có quyền gán chức vụ, chỉ ở chức vụ thường trực chưa kết thúc; chức vụ sự kiện đổi ở trang sự kiện.
        Sắp xếp theo chức vụ (Chủ nhiệm trước), tên phạm vi, ngày bắt đầu. Mặc định 50 dòng một trang.
        Lỗi: 400 `VALIDATION` (`scopeType` sai, nhiệm kỳ Chuẩn bị); 403 `NOT_A_MEMBER`; 404 `TERM_NOT_FOUND` (nhiệm kỳ không thuộc CLB).
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: termId
          in: query
          schema: { type: string }
        - name: scopeType
          in: query
          schema:
            type: string
            enum: [CLUB, DEPARTMENT, EVENT, SUBCOMMITTEE]
        - name: scopeId
          in: query
          description: CLB, ban, sự kiện hoặc tiểu ban.
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Tìm theo tên người giữ hoặc tên phạm vi, không phân biệt dấu.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang chức vụ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ORG]
      operationId: assignPosition
      summary: Gán chức vụ thường trực (FR-ORG-02)
      description: |
        Chỉ ban chủ nhiệm; riêng chức Chủ nhiệm, Phó chủ nhiệm chỉ Chủ nhiệm, Phó chủ nhiệm đang giữ chức gán được.
        Người được gán phải là thành viên Chính thức; trưởng, phó ban phải thuộc đúng ban (BR-ORG-01).
        `startOn`, `endOn` nằm trong nhiệm kỳ Đang chạy (BR-ORG-03).
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 409 `ALREADY_HOLDS`; 422 `NO_RUNNING_TERM`,
        `HANDOVER_IN_PROGRESS` (đang bàn giao: người của nhiệm kỳ mới ghi ở kết quả bầu, FR-TERM-03),
        `TERM_OVERDUE` (nhiệm kỳ đã quá ngày kết thúc mà chưa bàn giao: bắt đầu bàn giao, khai báo nhiệm kỳ mới trước nếu chưa có).
        Thứ tự kiểm: chức vụ hợp lệ, quyền gán Chủ nhiệm/Phó chủ nhiệm, `HANDOVER_IN_PROGRESS`, `TERM_OVERDUE`, rồi mới tới ngày và người.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePositionRequest' }
      responses:
        '201':
          description: Chức vụ mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/position-candidates:
    get:
      tags: [ORG]
      operationId: listPositionCandidates
      summary: Người đủ điều kiện nhận chức vụ (FR-ORG-02)
      description: |
        Chỉ ban chủ nhiệm; với chức Chủ nhiệm, Phó chủ nhiệm thì chỉ Chủ nhiệm, Phó chủ nhiệm đang giữ chức.
        Thành viên Chính thức; với trưởng, phó ban phải thuộc đúng ban (BR-ORG-01); bỏ người đang giữ chức vụ đó ở phạm vi đó. Lỗi: 400 `VALIDATION` (chức vụ, phạm vi sai); 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: role
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StandingRole' }
        - name: scopeId
          in: query
          required: true
          description: '`clubId` với chức vụ ban chủ nhiệm; id ban với trưởng, phó ban.'
          schema: { type: string }
      responses:
        '200':
          description: Ứng viên, sắp theo tên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PositionCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/positions/{positionId}/revocation:
    post:
      tags: [ORG]
      operationId: revokePosition
      summary: Thu hồi chức vụ (FR-ORG-03)
      description: |
        Chỉ ban chủ nhiệm. Chức vụ hết hiệu lực từ `handoverOn` (`endOn` thành ngày trước đó), không xóa bản ghi.
        Chức vụ chưa bắt đầu mà `handoverOn` không muộn hơn `startOn` thì bị hủy hẳn, không còn được liệt kê; muộn hơn thì
        vẫn có hiệu lực từ `startOn` đến trước `handoverOn`.

        Lỗi:
        - 400 `VALIDATION` (lý do từ 5 ký tự; `handoverOn` từ hôm nay đến hết hạn chức vụ).
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `POSITION_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `EVENT_POSITION` (chức vụ sự kiện đổi ở trang sự kiện), `INVALID_TRANSITION` (đã kết thúc),
          `LAST_PRESIDENT` (các Chủ nhiệm còn lại không phủ kín mọi ngày đến hết nhiệm kỳ, BR-ORG-02).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokePositionRequest' }
      responses:
        '200':
          description: Chức vụ sau khi thu hồi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/terms:
    get:
      tags: [TERM]
      operationId: listTerms
      summary: Danh sách nhiệm kỳ (ST-TERM)
      description: |
        Mảng (không phân trang): nhiệm kỳ Chuẩn bị đứng đầu, rồi nhiệm kỳ đang phụ trách (Đang chạy hoặc Đang bàn giao),
        rồi các nhiệm kỳ Đã đóng, mới nhất trước. Mọi thành viên CLB xem được. Chỉ nhiệm kỳ Chuẩn bị có `departmentPlan`
        và `allowedActions` (`EDIT` cho ban chủ nhiệm). Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Các nhiệm kỳ của CLB.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Term' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [TERM]
      operationId: createTerm
      summary: Khai báo nhiệm kỳ mới (FR-TERM-01)
      description: |
        Chỉ ban chủ nhiệm (`CREATE_TERM` ở `ClubDetail.allowedActions`). Nhiệm kỳ mới ở Chuẩn bị; máy chủ chép các ban đang
        hoạt động thành `departmentPlan` để sửa. Mỗi CLB có tối đa một nhiệm kỳ Chuẩn bị. Nhiệm kỳ đang chạy không đổi cho
        tới khi bàn giao hoàn tất (BR-TERM-01, BR-TERM-02).

        Tên 3–80 ký tự, không trùng nhiệm kỳ khác của CLB. `endOn` sau `startOn` và sau hôm nay. `startOn` là ngày dự kiến;
        ngày thật được đặt lúc hoàn tất bàn giao.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 409 `TERM_PREPARING_EXISTS`.
        - 422 `NO_RUNNING_TERM` (nhiệm kỳ hiện tại không ở Đang chạy).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTermRequest' }
      responses:
        '201':
          description: Nhiệm kỳ mới ở Chuẩn bị.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/terms/{termId}:
    patch:
      tags: [TERM]
      operationId: updateTerm
      summary: Sửa nhiệm kỳ Chuẩn bị và kế hoạch ban (FR-TERM-01)
      description: |
        Chỉ ban chủ nhiệm, chỉ khi nhiệm kỳ ở Chuẩn bị. Chỉ gửi phần cần sửa: `name`, `startOn`, `endOn` (kiểm như lúc tạo)
        hoặc `departmentPlan`. Gửi `departmentPlan` thì thay cả kế hoạch; chỉ gửi kế hoạch thì máy chủ không xét lại tên và ngày.

        Kế hoạch ban (tối đa 50 dòng):
        - Dòng có `departmentId` là ban đang hoạt động được giữ lại; sửa được `name`, `description` (áp dụng khi hoàn tất bàn giao).
          Gửi đúng tên, mô tả hiện tại là không sửa: dòng đó tiếp tục theo ban ở Cơ cấu, kể cả khi ban được đổi tên sau này.
        - `dropped: true` là bỏ ban khi hoàn tất (ban chuyển Đã đóng, BR-TERM-04); chỉ được khi ban không còn thành viên
          có ban chính là ban đó.
        - Dòng có `departmentId` null là ban mới, được tạo khi hoàn tất.
        - Tên ban 2–80 ký tự, không trùng nhau trong kế hoạch; mô tả tối đa 500 ký tự.
        - Ban đang hoạt động mà kế hoạch không nhắc tới vẫn được giữ; dòng của ban đã đóng bị bỏ qua.

        Lỗi theo dòng dùng `field` dạng `departmentPlan[0].name`.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `TERM_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `TERM_NOT_EDITABLE` (nhiệm kỳ không ở Chuẩn bị).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TermId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTermRequest' }
      responses:
        '200':
          description: Nhiệm kỳ sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/handovers:
    post:
      tags: [TERM]
      operationId: startHandover
      summary: Bắt đầu bàn giao (FR-TERM-03, ST-TERM)
      description: |
        Ban chủ nhiệm đang hiệu lực (Chủ nhiệm, Phó chủ nhiệm, Thủ quỹ). Tạo phiên bàn giao từ nhiệm kỳ Đang chạy (`fromTermId`)
        sang nhiệm kỳ Chuẩn bị (`toTermId`); nhiệm kỳ cũ chuyển Đang bàn giao, nhiệm kỳ mới vẫn Chuẩn bị tới khi hoàn tất.

        Trong lúc bàn giao (BR-TERM-02):
        - Ban chủ nhiệm cũ giữ quyền; chức vụ thường trực hết hạn cùng nhiệm kỳ vẫn hiệu lực dù đã qua ngày kết thúc (`Position.untilHandover`).
        - Không gán chức vụ thường trực mới (`ASSIGN_POSITION` vắng mặt, gán thì 422 `HANDOVER_IN_PROGRESS`); thu hồi, khai báo ban vẫn được.

        Lỗi:
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 409 `HANDOVER_EXISTS` (đã có phiên đang mở).
        - 422 `NO_PREPARING_TERM`, `INVALID_TRANSITION` (nhiệm kỳ giao hoặc nhận không còn đúng).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartHandoverRequest' }
      responses:
        '201':
          description: Phiên bàn giao mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/handovers/{handoverId}:
    get:
      tags: [TERM]
      operationId: getHandover
      summary: Phiên bàn giao (FR-TERM-03)
      description: |
        Ban chủ nhiệm đang hiệu lực và người được bầu vào ban chủ nhiệm mới xem được. Kèm kết quả bầu (đủ điều kiện hay không tính lại
        mỗi lần đọc), ban được giữ trong kế hoạch (`departmentOptions`), số mục bàn giao (`counts`, khớp danh mục trước khi đếm)
        và lý do chưa hoàn tất được (`blockers`, gồm số mục còn chờ xác nhận theo BR-TERM-03).
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `HANDOVER_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/HandoverId'
      responses:
        '200':
          description: Phiên bàn giao.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/handovers/{handoverId}/appointments:
    put:
      tags: [TERM]
      operationId: saveAppointments
      summary: Ghi kết quả bầu (FR-TERM-03, BR-ORG-01)
      description: |
        Ban chủ nhiệm đang hiệu lực (gồm cả Thủ quỹ, kể cả khi ghi Chủ nhiệm, Phó chủ nhiệm mới). Thay cả danh sách. Chức vụ chỉ có
        hiệu lực khi bàn giao hoàn tất (BR-TERM-02).
        - Ban chủ nhiệm (`departmentId` null): thành viên Chính thức.
        - Trưởng, phó ban: thành viên Chính thức có ban chính là ban đó; ban phải được giữ trong kế hoạch (ban mới gán trưởng sau ở Cơ cấu).
        - Không trùng (người, chức vụ, ban). Tối đa 60 dòng. Chưa bắt buộc có Chủ nhiệm lúc lưu; thiếu thì nằm trong `blockers`.
        - Người mới được bầu vào ban chủ nhiệm nhận thông báo `TERM` để xác nhận bàn giao (FR-NOT-02).

        Lỗi theo dòng dùng `field` dạng `appointments[0].userId`.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `HANDOVER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `HANDOVER_CLOSED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/HandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAppointmentsRequest' }
      responses:
        '200':
          description: Phiên bàn giao sau khi lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/handovers/{handoverId}/items:
    get:
      tags: [TERM]
      operationId: listHandoverItems
      summary: Danh mục bàn giao (FR-TERM-04)
      description: |
        Ban chủ nhiệm đang hiệu lực và người được bầu vào ban chủ nhiệm mới xem được. Khi phiên còn mở, máy chủ khớp danh mục với
        dữ liệu hiện tại mỗi lần đọc (và trước mỗi lượt xác nhận):
        - Thêm mục cho đối tượng mới cần bàn giao (ví dụ việc vừa giao, sự kiện vừa gửi duyệt).
        - Mục đã xác nhận mà dữ liệu đổi (số dư, khoản chờ mới, Trưởng BTC, người làm) về Chờ xác nhận, tăng `version`, kèm `note`.
        - Mục chờ xác nhận mà số liệu đổi cũng tăng `version`, để lượt xác nhận theo số liệu cũ nhận 409.
        - Đối tượng đã xong (việc Hoàn thành hoặc Đã hủy, sự kiện Đã đóng hoặc Đã hủy, quỹ đã quyết toán) thành `RESOLVED`.

        Thứ tự: theo loại (quỹ, sự kiện, công việc), mục chờ xác nhận trước; Quỹ chung trước quỹ sự kiện, sự kiện theo ngày bắt đầu,
        việc theo hạn. Phân trang, `size` mặc định 50.

        Lỗi: 400 `VALIDATION` (bộ lọc sai); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `HANDOVER_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/HandoverId'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/HandoverItemKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/HandoverItemStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang mục bàn giao.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/handovers/{handoverId}/confirmations:
    post:
      tags: [TERM]
      operationId: confirmHandoverItems
      summary: Ban chủ nhiệm mới xác nhận mục bàn giao (FR-TERM-05)
      description: |
        Chỉ người được bầu Chủ nhiệm, Phó chủ nhiệm, Thủ quỹ mới và còn đủ điều kiện (kể cả người tái đắc cử). Tất cả hoặc không gì:
        một dòng lỗi thì không mục nào được ghi.

        Thứ tự kiểm: quyền (403) → dạng dữ liệu (400) → khớp danh mục rồi so `version` từng mục (409 `VERSION_CONFLICT`, `errors`
        nêu từng mục đã cũ dạng `items[0]`) → phiên còn mở (422 `HANDOVER_CLOSED`) → trạng thái từng mục (422) → quyết định Trưởng BTC (400).
        - Mục `RESOLVED`, hoặc đã xác nhận mà không phải sự kiện cần quyết định Trưởng BTC: 422 `ITEM_NOT_CONFIRMABLE`,
          `errors` ở `items[i].itemId`.
        - Sự kiện có `needsLeadDecision` bắt buộc có `eventLead`: `KEEP` cần Trưởng BTC đang hiệu lực; `REPLACE` cần thành viên
          Thử việc hoặc Chính thức (`items[i].eventLead.userId`). Mục khác gửi `eventLead` thì 400.
        - Quyết định Trưởng BTC chỉ áp dụng khi bàn giao hoàn tất (BR-TERM-02); trước đó đổi được bằng cách xác nhận lại mục.

        Mỗi lượt xác nhận tăng `version` của từng mục và của phiên. Hai người xác nhận các mục khác nhau không chặn nhau.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `HANDOVER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `HANDOVER_CLOSED`, `ITEM_NOT_CONFIRMABLE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/HandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmItemsRequest' }
      responses:
        '200':
          description: Phiên bàn giao sau khi xác nhận (số đếm, `blockers`, `version` mới).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/handovers/{handoverId}/transitions:
    post:
      tags: [TERM]
      operationId: completeHandover
      summary: Hoàn tất chuyển nhiệm kỳ (FR-TERM-06)
      description: |
        Ban chủ nhiệm đang hiệu lực (ban chủ nhiệm cũ, giữ quyền tới thời điểm này theo BR-TERM-02). Thứ tự kiểm: quyền (403) →
        `version` của phiên (409, có lượt xác nhận hay sửa kết quả bầu sau lúc xem) → phiên còn mở (422 `HANDOVER_CLOSED`) → khớp
        danh mục rồi xét điều kiện (422 `HANDOVER_BLOCKED`, `errors` dạng `{field: 'blockers', message}` cho từng lý do, giống
        `Handover.blockers`). Kiểm hết trước, chưa đổi dữ liệu.

        Khi đạt, máy chủ áp dụng theo thứ tự (để không kết thúc nhầm chức mới của người tái đắc cử):
        1. Kết thúc mọi chức vụ thường trực còn mở của CLB từ hôm nay (ngày hiệu lực cuối là hôm qua), kể cả chức đang giữ tới khi
           bàn giao xong; lý do "Kết thúc {tên nhiệm kỳ}".
        2. Ban bị bỏ chuyển Đã đóng (BR-TERM-04); ban giữ lại đổi tên, mô tả theo kế hoạch; ban mới được tạo cho nhiệm kỳ mới.
        3. Cấp chức theo kết quả bầu, từ hôm nay đến ngày kết thúc nhiệm kỳ mới.
        4. Áp dụng quyết định thay Trưởng BTC đã xác nhận.
        5. Nhiệm kỳ cũ Đã đóng (ngày kết thúc là hôm qua, không trước ngày bắt đầu); nhiệm kỳ mới Đang chạy từ hôm nay; phiên
           `COMPLETED`.
        6. Thông báo `TERM` cho mọi thành viên, `POSITION` cho từng người nhận chức, `EVENT` cho Trưởng BTC cũ và mới.

        Lỗi:
        - 400 `VALIDATION` (`action` khác `COMPLETE`).
        - 403 `NOT_A_MEMBER`, `FORBIDDEN`.
        - 404 `HANDOVER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `HANDOVER_CLOSED`, `HANDOVER_BLOCKED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/HandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteHandoverRequest' }
      responses:
        '200':
          description: Phiên bàn giao đã hoàn tất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /me/tasks/facets:
    get:
      tags: [TASK]
      operationId: getMyTaskFacets
      summary: Giá trị lọc Công việc của tôi
      description: |
        `clubs`: các CLB còn việc của người gọi hiện ở danh sách mặc định của `GET /me/tasks`, tức không tính việc của tiểu ban
        thuộc sự kiện Đã đóng, Đã hủy. `events`: mọi sự kiện có việc của người gọi, kể cả sự kiện Đã đóng, Đã hủy, để lọc tra cứu
        các việc đó (FR-EVT-16).
      responses:
        '200':
          description: Giá trị lọc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFacets' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/tasks:
    get:
      tags: [TASK]
      operationId: listMyTasks
      summary: Công việc của tôi (FR-TASK-02)
      description: |
        Việc người gọi là người chính hoặc phối hợp, từ mọi ban, tiểu ban và CLB còn quyền truy cập.
        Việc của tiểu ban thuộc sự kiện Đã đóng, Đã hủy chỉ có khi lọc đúng `eventId` của sự kiện đó (FR-EVT-16).
        Mặc định sắp việc quá hạn trước, rồi theo hạn tăng dần.
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/TaskDueFilter'
        - name: clubId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/TaskEventFilter'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Trang công việc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /clubs/{clubId}/tasks:
    get:
      tags: [TASK]
      operationId: listClubTasks
      summary: Công việc trong CLB (FR-TASK-01, 04)
      description: |
        Ban chủ nhiệm thấy mọi việc của CLB; người khác thấy việc mình giao, nhận, phối hợp hoặc thuộc phạm vi mình quản lý.
        Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/TaskDueFilter'
        - $ref: '#/components/parameters/TaskEventFilter'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Trang công việc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [TASK]
      operationId: createTask
      summary: Tạo và giao việc (FR-TASK-01)
      description: |
        Phạm vi phải nằm trong `task-scopes` của người gọi (BR-TASK-01). Tên từ 3 ký tự; người chính thuộc phạm vi;
        người phối hợp thuộc phạm vi và khác người chính; hạn sau hiện tại. Khách của sự kiện (nhân sự CLB đồng tổ chức làm
        trưởng tiểu ban) gọi được, phạm vi chỉ là tiểu ban mình phụ trách (FR-EVT-08).
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `SCOPE_FORBIDDEN`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Việc mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/task-scopes:
    get:
      tags: [TASK]
      operationId: listAssignableScopes
      summary: Phạm vi được giao việc (BR-TASK-01)
      description: Ban, tiểu ban người gọi được giao việc, kèm người nhận hợp lệ; khách của sự kiện cũng gọi được (FR-EVT-08). Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Các phạm vi.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignableScope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/tasks/{taskId}:
    get:
      tags: [TASK]
      operationId: getTask
      summary: Chi tiết công việc
      description: 'Lỗi: 404 `TASK_NOT_FOUND`; 403 `FORBIDDEN` khi không còn quyền xem việc.'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Chi tiết công việc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [TASK]
      operationId: updateTask
      summary: Đổi người chính, người phối hợp hoặc hạn (FR-TASK-05)
      description: |
        Chỉ người giao. Đổi người cần thêm quyền giao việc ở phạm vi của việc theo bảng phân quyền và phạm vi còn hoạt động; đổi hạn thì không.
        Trạng thái việc giữ nguyên. Mỗi trường đổi ghi một `TaskChange` (giá trị cũ, mới, lý do) và báo người liên quan.
        Người chính, người phối hợp mới phải là thành viên đang hoạt động của phạm vi (BR-TASK-01, BR-MEM-05); người phối hợp cũ được giữ.
        Đổi hạn không xóa lịch sử quá hạn đã ghi (BR-TASK-03). Thứ tự kiểm: quyền → version → trạng thái → giá trị.

        Lỗi:
        - 400 `VALIDATION` (từng ô trong `errors[]`; không trường nào đổi).
        - 403 `FORBIDDEN` (không phải người giao, hoặc thiếu quyền giao việc ở phạm vi khi đổi người).
        - 404 `TASK_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `EVENT_READ_ONLY`, `TASK_CLOSED` (Hoàn thành, Đã hủy), `SCOPE_CLOSED` (ban đã đóng hoặc sự kiện không còn hoạt động, khi đổi người).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Việc sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/tasks/{taskId}/attachments:
    post:
      tags: [TASK]
      operationId: uploadTaskAttachment
      summary: Đính kèm tệp cho công việc (FR-TASK-03)
      description: |
        Chỉ người chính và người phối hợp. Trường `file`: JPG, PNG, PDF, DOCX, XLSX, PPTX, tối đa 15 MB (IF-05).
        Trả `FileRef` để gửi kèm `attachmentIds` khi nộp kết quả.
        Lỗi: 400 `VALIDATION` (thiếu tệp), `INVALID_FILE`; 403 `FORBIDDEN`; 404 `TASK_NOT_FOUND`;
        422 `EVENT_READ_ONLY` (việc của tiểu ban thuộc sự kiện Đã đóng hoặc Đã hủy, FR-EVT-16).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '201':
          description: Tệp đã lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/tasks/{taskId}/transitions:
    post:
      tags: [TASK]
      operationId: transitionTask
      summary: Cập nhật, nộp, nghiệm thu, hủy công việc (FR-TASK-03, 04, 05)
      description: |
        ST-TASK. `START`, `SUBMIT` do người chính; `APPROVE`, `REQUEST_CHANGES`, `CANCEL` do người giao (BR-TASK-02).
        `SUBMIT` cần ghi chú hoặc tệp; `REQUEST_CHANGES` bắt buộc nhận xét từ 5 ký tự (`reason`).
        `CANCEL` từ Mới giao, Đang làm, Chờ nghiệm thu, bắt buộc lý do 5–500 ký tự; báo người chính và người phối hợp.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `FORBIDDEN`.
        - 404 `TASK_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `EVENT_READ_ONLY`: việc của tiểu ban thuộc sự kiện Đã đóng hoặc Đã hủy chỉ xem được (FR-EVT-16).
        - 422 `INVALID_TRANSITION`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTransitionRequest' }
      responses:
        '200':
          description: Việc sau khi chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events:
    get:
      tags: [EVT]
      operationId: listEvents
      summary: Danh sách sự kiện
      description: |
        Sự kiện người gọi được xem. Dự thảo chỉ người đề xuất xem, và ban chủ nhiệm khi đề xuất đã bị từ chối;
        Chờ duyệt thì người đề xuất và ban chủ nhiệm. Khách của sự kiện (`viewerRole: EVENT_GUEST`) chỉ thấy các sự kiện
        mình đang làm BTC. Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          description: Lặp lại tham số để lọc nhiều trạng thái.
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventStatus' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 12 }
      responses:
        '200':
          description: Trang sự kiện.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [EVT]
      operationId: createEvent
      summary: Tạo hoặc đề xuất sự kiện (FR-EVT-01, 02)
      description: |
        Ban chủ nhiệm tạo thì sự kiện vào thẳng Đã duyệt và bắt buộc `leadUserId` (Trưởng BTC, thành viên Thử việc hoặc
        Chính thức). Thành viên khác đề xuất thì sự kiện ở Dự thảo, `leadUserId` để `null`.
        Kiểm tra: tên từ 3 ký tự; kết thúc sau bắt đầu (BR-EVT-01); hạn đăng ký trước giờ bắt đầu; `ONLINE` cần `onlineUrl`
        `http(s)://`, `OFFLINE` cần `location`; `capacity` nguyên dương hoặc `null`.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN` (không phải thành viên Thử việc hoặc Chính thức).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Sự kiện mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/event-lead-candidates:
    get:
      tags: [EVT]
      operationId: listEventLeadCandidates
      summary: Ứng viên Trưởng BTC (FR-EVT-01, 03)
      description: |
        Ban chủ nhiệm, hoặc người được bầu vào ban chủ nhiệm mới của phiên bàn giao đang mở (chọn Trưởng BTC thay thế khi
        tiếp nhận sự kiện, FR-TERM-05). Thành viên Thử việc hoặc Chính thức, chỉ tên và ban. Lỗi 403 `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Ứng viên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/events/{eventId}:
    get:
      tags: [EVT]
      operationId: getEvent
      summary: Chi tiết sự kiện
      description: |
        Sự kiện người gọi không được xem trả 404 `EVENT_NOT_FOUND`, không lộ là có tồn tại. Người ngoài CLB chủ trì xem được
        khi là CTV, nhân sự hoặc ban chủ nhiệm CLB đồng tổ chức của sự kiện còn hoạt động; với ban chủ nhiệm CLB đồng tổ
        chức, `viewingAsCoHost` nêu CLB của họ (FR-EVT-09).
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Chi tiết sự kiện.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/events/{eventId}/transitions:
    post:
      tags: [EVT]
      operationId: transitionEvent
      summary: Chuyển trạng thái sự kiện (FR-EVT-02, 03, 10, 15, 16)
      description: |
        ST-EVT:
        - `SUBMIT`: chỉ người đề xuất.
        - `APPROVE`: ban chủ nhiệm; `leadUserId` mặc định là người đề xuất (FR-EVT-03). Quỹ sự kiện được tạo từ lúc này.
        - `REJECT`: ban chủ nhiệm, bắt buộc lý do, sự kiện về Dự thảo.
        - `OPEN_REGISTRATION`: Trưởng BTC hoặc ban chủ nhiệm.
        - `CANCEL`: ban chủ nhiệm, bắt buộc lý do; chỉ trước khi sự kiện diễn ra. Chức vụ sự kiện hết hiệu lực; quỹ sự kiện còn mở để quyết toán.
        - `CLOSE`: ban chủ nhiệm hoặc Trưởng BTC, khi sự kiện Đã kết thúc và quỹ sự kiện Đã quyết toán (BR-EVT-05; quyết toán
          quỹ qua `POST /clubs/{clubId}/funds/{fundId}/transitions` không đổi trạng thái sự kiện). Mọi chức vụ trong sự kiện
          hết hiệu lực, hồ sơ sự kiện chỉ đọc. Kiểm theo thứ tự: Đã kết thúc, quyền, còn tạm ứng mở ở quỹ sự kiện (422
          `EVENT_HAS_OPEN_ADVANCES` nêu số khoản), quỹ chưa quyết toán (hoặc không có quỹ; sự kiện từ Đã duyệt luôn có quỹ):
          422 `FUND_NOT_SETTLED`.

        Lỗi:
        - 400 `VALIDATION` (lý do từ 5 ký tự).
        - 403 `FORBIDDEN`.
        - 404 `EVENT_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION`, `LEAD_NOT_ELIGIBLE`, `EVENT_HAS_OPEN_ADVANCES`, `FUND_NOT_SETTLED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventTransitionRequest' }
      responses:
        '200':
          description: Sự kiện sau khi chuyển.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/reschedule:
    post:
      tags: [EVT]
      operationId: rescheduleEvent
      summary: Dời thời gian sự kiện (FR-EVT-14)
      description: |
        Trưởng BTC hoặc ban chủ nhiệm (`RUN_EVENT` ở phạm vi sự kiện), khi sự kiện Đã duyệt hoặc Mở đăng ký và chưa bắt đầu.
        Lưu giờ cũ, giờ mới, lý do, người dời. Mọi đăng ký đang giữ chỗ sang Chờ xác nhận lại (vẫn giữ chỗ) với hạn xác nhận là mốc
        sớm hơn giữa lúc dời cộng `rescheduleConfirmHours` của CLB và giờ bắt đầu mới; danh sách chờ giữ nguyên thứ tự (ST-REG).
        Đăng ký của chính người dời giữ Nhận chỗ. Người đăng ký và BTC nhận thông báo nêu giờ cũ, giờ mới, lý do, hạn xác nhận
        (FR-NOT-02). Quá hạn mà chưa xác nhận thì máy chủ tự chuyển đăng ký sang Đã hủy, báo người đó và đôn danh sách chờ.

        Thứ tự kiểm: quyền, version, trạng thái, giá trị.

        Lỗi:
        - 400 `VALIDATION` (bắt đầu sau hiện tại, kết thúc sau bắt đầu, khác giờ cũ, hạn đăng ký không sau giờ bắt đầu mới, lý do 5–500 ký tự).
        - 403 `FORBIDDEN`.
        - 404 `EVENT_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `INVALID_TRANSITION` (trạng thái khác), `EVENT_STARTED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleEventRequest' }
      responses:
        '200':
          description: Sự kiện sau khi dời, có `lastScheduleChange`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/progress:
    get:
      tags: [EVT]
      operationId: getEventProgress
      summary: Tiến độ sự kiện theo tiểu ban (FR-EVT-09)
      description: |
        Người có `VIEW_PROGRESS`: ban chủ nhiệm, Trưởng BTC, nhân sự BTC, ban chủ nhiệm CLB đồng tổ chức. Chỉ số việc theo
        trạng thái (bỏ việc Đã hủy) và số quá hạn (BR-TASK-03), không có nội dung việc.
        Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Tiến độ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/events/{eventId}/subcommittees:
    get:
      tags: [EVT]
      operationId: listSubcommittees
      summary: Cơ cấu ban tổ chức (FR-EVT-04, 05)
      description: 'Chỉ BTC và ban chủ nhiệm (SRS 3.5). Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`.'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Các tiểu ban.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subcommittee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [EVT]
      operationId: createSubcommittee
      summary: Lập tiểu ban (FR-EVT-04)
      description: |
        Trưởng BTC hoặc ban chủ nhiệm. Tên từ 2 ký tự, không trùng trong sự kiện; `quota` nguyên dương hoặc `null`;
        trưởng tiểu ban là thành viên Thử việc hoặc Chính thức (BR-ORG-01).
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`; 422 `LEAD_TAKEN` (đã là trưởng tiểu ban khác, BR-ORG-04).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubcommitteeRequest' }
      responses:
        '201':
          description: Tiểu ban mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcommittee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/staff-candidates:
    get:
      tags: [EVT]
      operationId: listStaffCandidates
      summary: Thành viên có thể mời vào BTC (FR-EVT-05, FR-EVT-08)
      description: |
        Người có quyền mời ở ít nhất một tiểu ban. Chỉ trả tên và ban (SRS 3.5).
        Có `coHostId`: thành viên Thử việc, Chính thức của CLB đồng tổ chức đó (đang Chấp nhận), bỏ người có tư cách ở CLB chủ
        trì; ban là ban ở CLB của họ. Cần `MANAGE_EVENT_STAFF` ở phạm vi sự kiện.
        Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`; 422 `CO_HOST_NOT_ACTIVE`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Q'
        - name: coHostId
          in: query
          required: false
          description: Id lời mời đồng tổ chức đang Chấp nhận; bỏ trống là thành viên CLB chủ trì.
          schema: { type: string }
      responses:
        '200':
          description: Ứng viên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/subcommittees/{subcommitteeId}/members:
    post:
      tags: [EVT]
      operationId: addSubcommitteeMember
      summary: Mời thành viên vào tiểu ban (FR-EVT-05, FR-EVT-08)
      description: |
        Trưởng BTC, trưởng tiểu ban đó hoặc ban chủ nhiệm. Chỉ mời thành viên Thử việc hoặc Chính thức của CLB chủ trì.
        Có `coHostId`: thêm thành viên của CLB đồng tổ chức đang Chấp nhận (ghi `kind: CO_HOST`); cần `MANAGE_EVENT_STAFF` ở
        phạm vi sự kiện, người phải là ứng viên của `staff-candidates?coHostId=`.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `NOT_FOUND`; 409 `ALREADY_STAFF`; 422 `CO_HOST_NOT_ACTIVE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SubcommitteeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddStaffRequest' }
      responses:
        '200':
          description: Tiểu ban sau khi thêm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcommittee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/subcommittees/{subcommitteeId}/collaborators:
    post:
      tags: [EVT]
      operationId: addCollaborator
      summary: Thêm cộng tác viên vào tiểu ban (FR-EVT-07)
      description: |
        Cần `MANAGE_EVENT_STAFF` ở phạm vi sự kiện (Trưởng BTC, ban chủ nhiệm); trưởng tiểu ban không thêm được. Người được
        thêm vào ngay, không có bước chấp nhận, và nhận thông báo. Email phải khớp một tài khoản người dùng đang Hoạt động và
        người đó không có tư cách nào chưa Đã rời ở CLB chủ trì (Chờ duyệt, Thử việc, Chính thức, Tạm nghỉ đều trả
        `IS_MEMBER`); người đã rời CLB (kể cả Trưởng BTC cũ) thêm được. CTV không làm trưởng tiểu ban (BR-ORG-01).
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `NOT_FOUND`; 409 `ALREADY_STAFF`; 422 `EVENT_READ_ONLY`,
        `ACCOUNT_NOT_FOUND`, `IS_MEMBER`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SubcommitteeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCollaboratorRequest' }
      responses:
        '200':
          description: Tiểu ban sau khi thêm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcommittee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/subcommittees/{subcommitteeId}/lead:
    put:
      tags: [EVT]
      operationId: setSubcommitteeLead
      summary: Chọn hoặc đổi trưởng tiểu ban (FR-EVT-08)
      description: |
        Cần `MANAGE_EVENT_STAFF` ở phạm vi sự kiện (trưởng tiểu ban không tự đổi). Người được chọn là nhân sự hiện có của tiểu
        ban: thành viên Thử việc, Chính thức của CLB chủ trì hoặc nhân sự CLB đồng tổ chức; CTV không làm trưởng (BR-ORG-01);
        không đang là trưởng tiểu ban khác (BR-ORG-04). Đang có trưởng thì `reason` bắt buộc; trưởng cũ kết thúc chức kèm lý
        do, vẫn ở lại tiểu ban, và nhận thông báo. Chức còn mở của trưởng đang Tạm nghỉ (không còn hiệu lực, thẻ hiện chưa có
        trưởng) cũng kết thúc, với lý do mặc định, để người đó quay lại không thành trưởng thứ hai (BR-ORG-04). Nhân sự CLB
        đồng tổ chức phải còn Thử việc, Chính thức ở CLB gốc.
        Thứ tự kiểm: 403, 422 `EVENT_READ_ONLY`, 400 `userId` không phải nhân sự, 422 `LEAD_NOT_ELIGIBLE`, `LEAD_TAKEN`, rồi
        400 (đang là trưởng, thiếu lý do).
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `NOT_FOUND`; 422 `EVENT_READ_ONLY`, `LEAD_NOT_ELIGIBLE`, `LEAD_TAKEN`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SubcommitteeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSubcommitteeLeadRequest' }
      responses:
        '200':
          description: Tiểu ban sau khi đổi trưởng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcommittee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/co-hosts:
    get:
      tags: [EVT]
      operationId: listCoHosts
      summary: CLB đồng tổ chức của sự kiện (FR-EVT-08)
      description: |
        Người xem được cơ cấu BTC (`VIEW_STAFF`). Mọi lời mời, mới trước, kèm số nhân sự của từng CLB đang trong BTC.
        Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Lời mời đồng tổ chức.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoHost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [EVT]
      operationId: inviteCoHost
      summary: Mời CLB đồng tổ chức (FR-EVT-08, ST-COH)
      description: |
        Cần `MANAGE_EVENT_STAFF` ở phạm vi sự kiện (Trưởng BTC, ban chủ nhiệm); sự kiện còn hoạt động (Đã duyệt tới Đã kết
        thúc). CLB được mời phải tồn tại và khác CLB chủ trì. Mỗi CLB chỉ có một lời mời Đã gửi hoặc Chấp nhận; lời mời đã
        từ chối hoặc đã gỡ thì mời lại bằng lời mời mới. Người có `APPROVE_EVENT` ở CLB được mời nhận thông báo, đích
        `EVENT_SHARED`.
        Lỗi: 400 `VALIDATION` (`clubId`, `message` quá 500 ký tự); 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`; 409
        `CO_HOST_EXISTS`; 422 `EVENT_READ_ONLY`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteCoHostRequest' }
      responses:
        '201':
          description: Lời mời vừa gửi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoHost' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/co-hosts/{coHostId}/removal:
    post:
      tags: [EVT]
      operationId: removeCoHost
      summary: Gỡ CLB đồng tổ chức (FR-EVT-08, ST-COH)
      description: |
        Quyền như khi mời. Chỉ gỡ CLB đang Chấp nhận, lý do 5–500 ký tự. Mọi nhân sự của CLB đó ở sự kiện thôi ngay, chức
        trưởng tiểu ban của họ kết thúc kèm lý do; việc và dữ liệu họ tạo giữ nguyên (BR-DATA-01). Ban chủ nhiệm CLB kia và
        người bị gỡ nhận thông báo.
        Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `CO_HOST_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `EVENT_READ_ONLY`,
        `CO_HOST_NOT_ACTIVE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: coHostId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveCoHostRequest' }
      responses:
        '200':
          description: Lời mời sau khi gỡ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoHost' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/co-host-invitations:
    get:
      tags: [EVT]
      operationId: listCoHostInvitations
      summary: Lời mời đồng tổ chức gửi tới CLB (FR-EVT-08)
      description: |
        Ban chủ nhiệm CLB được mời (tab Sự kiện chung). Mọi lời mời, mới trước; `allowedActions` có `ACCEPT`, `DECLINE` khi
        lời mời Đã gửi, sự kiện còn hoạt động và người xem có `APPROVE_EVENT`.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Lời mời.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SharedEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/co-host-invitations/{invitationId}/decision:
    post:
      tags: [EVT]
      operationId: decideCoHostInvitation
      summary: Chấp nhận hoặc từ chối lời mời đồng tổ chức (FR-EVT-08, ST-COH)
      description: |
        Cần `APPROVE_EVENT` ở CLB được mời. Chỉ khi lời mời Đã gửi; lời mời đã từ chối không chấp nhận lại được. Từ chối cần
        ghi chú 5–500 ký tự. Người mời và Trưởng BTC nhận thông báo.
        Thứ tự kiểm: 404 (không thuộc ban chủ nhiệm CLB này), 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `CO_HOST_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `CO_HOST_NOT_PENDING`,
        `EVENT_READ_ONLY`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoHostDecisionRequest' }
      responses:
        '200':
          description: Lời mời sau khi trả lời.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/registrations:
    get:
      tags: [EVT]
      operationId: listRegistrations
      summary: Danh sách tham dự (FR-EVT-11)
      description: |
        Chỉ BTC và ban chủ nhiệm (SRS 3.5). Người nhận chỗ trước, rồi danh sách chờ theo thời gian đăng ký.
        Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang đăng ký.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [EVT]
      operationId: registerForEvent
      summary: Đăng ký tham dự (FR-EVT-11)
      description: |
        Thành viên Thử việc hoặc Chính thức, trong thời gian mở đăng ký. Hết chỗ thì vào danh sách chờ theo thứ tự (BR-EVT-03).
        Lỗi: 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`; 409 `ALREADY_REGISTERED` (BR-EVT-04); 422 `REGISTRATION_CLOSED` (BR-EVT-02).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: Đăng ký của người gọi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/registrations/{registrationId}/cancellation:
    post:
      tags: [EVT]
      operationId: cancelEventRegistration
      summary: Hủy đăng ký của mình (FR-EVT-13)
      description: |
        Chỉ chính người đăng ký (đăng ký của người khác trả 404). Người Nhận chỗ hủy được tới trước giờ bắt đầu số giờ
        `registrationCancelHours` của CLB; người Chờ xác nhận lại hủy được tới hạn xác nhận (FR-EVT-14); người ở danh sách chờ
        hủy được tới giờ bắt đầu. Hạn đúng của từng người nằm ở `MyRegistration.cancelDeadline`. Hủy xong, chỗ trống được
        đôn cho người đầu danh sách chờ theo thứ tự thời gian đăng ký (BR-EVT-03) và người đó nhận thông báo (FR-NOT-02).
        Hủy rồi có thể đăng ký lại khi sự kiện còn mở (BR-EVT-04).

        Lỗi:
        - 404 `REGISTRATION_NOT_FOUND`.
        - 422 `REGISTRATION_CANCELLED` (đã hủy), `REGISTRATION_LOCKED` (sự kiện đã bắt đầu, đã hủy hoặc đã đóng),
          `CANCEL_DEADLINE_PASSED` (câu báo nêu hạn hủy).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: registrationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Đăng ký sau khi hủy (trạng thái `CANCELLED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/registrations/{registrationId}/reconfirmation:
    post:
      tags: [EVT]
      operationId: reconfirmEventRegistration
      summary: Xác nhận vẫn tham dự sau khi sự kiện dời giờ (FR-EVT-14)
      description: |
        Chỉ chính người đăng ký (đăng ký của người khác trả 404), khi đăng ký đang Chờ xác nhận lại và chưa quá hạn xác nhận.
        Đăng ký về Nhận chỗ.

        Lỗi:
        - 404 `REGISTRATION_NOT_FOUND`.
        - 422 `RECONFIRM_DEADLINE_PASSED` (đã bị hủy vì quá hạn, câu báo nêu hạn), `REGISTRATION_CANCELLED`,
          `NOT_RECONFIRM_PENDING`, `REGISTRATION_LOCKED` (sự kiện đã bắt đầu, đã hủy hoặc đã đóng).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: registrationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Đăng ký sau khi xác nhận (trạng thái `CONFIRMED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/sessions:
    get:
      tags: [ATT]
      operationId: listSessions
      summary: Danh sách buổi sinh hoạt
      description: |
        Mọi thành viên CLB (kể cả Tạm nghỉ) xem được mọi buổi của CLB. `UPCOMING` gồm buổi chưa kết thúc, sắp theo giờ bắt đầu
        tăng dần; `PAST` gồm buổi đã kết thúc, mới nhất trước. Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: when
          in: query
          schema: { type: string, enum: [UPCOMING, PAST], default: UPCOMING }
        - name: scopeType
          in: query
          description: Bỏ trống là mọi buổi; `CLUB` là buổi toàn CLB; `DEPARTMENT` là buổi của ban (lọc thêm `departmentId`).
          schema: { $ref: '#/components/schemas/SessionScopeType' }
        - name: departmentId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 12 }
      responses:
        '200':
          description: Trang buổi sinh hoạt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ATT]
      operationId: createSession
      summary: Tạo buổi sinh hoạt (FR-ATT-01)
      description: |
        Phạm vi phải nằm trong `GET /session-scopes` của người gọi: ban chủ nhiệm tạo buổi toàn CLB và buổi của mọi ban đang
        hoạt động; Trưởng ban, Phó ban chỉ tạo buổi của ban mình.
        Kiểm tra: tên 3–150 ký tự; địa điểm bắt buộc; bắt đầu sau hiện tại; kết thúc sau bắt đầu; `capacity` nguyên dương hoặc
        `null`; `registrationDeadline` không sau giờ bắt đầu.
        Tạo xong thì báo đối tượng của buổi (thành viên Thử việc, Chính thức của CLB hoặc của ban; không báo người Tạm nghỉ, FR-NOT-02).
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN` (kèm lý do), `NOT_A_MEMBER`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Buổi mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/session-scopes:
    get:
      tags: [ATT]
      operationId: listSessionScopes
      summary: Phạm vi người gọi được tạo buổi (FR-ATT-01)
      description: Rỗng khi người gọi không tạo được buổi nào. Lỗi 403 `NOT_A_MEMBER`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Phạm vi.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionScopeOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}/sessions/{sessionId}:
    get:
      tags: [ATT]
      operationId: getSession
      summary: Chi tiết buổi sinh hoạt
      description: |
        `allowedActions` có `VIEW_ATTENDANCE` khi người gọi là người phụ trách buổi: người tạo, ban chủ nhiệm, Trưởng ban,
        Phó ban của ban đó (còn Thử việc hoặc Chính thức). Lỗi: 403 `NOT_A_MEMBER`; 404 `SESSION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Buổi sinh hoạt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/sessions/{sessionId}/attendance:
    get:
      tags: [ATT]
      operationId: getSessionAttendance
      summary: Danh sách điểm danh của buổi (FR-ATT-07)
      description: |
        Chỉ người phụ trách buổi (người tạo, ban chủ nhiệm, Trưởng ban, Phó ban của ban đó; còn Thử việc hoặc Chính thức). Đối tượng: thành viên Thử việc, Chính thức của CLB hoặc của ban, gia nhập không sau ngày diễn ra buổi; không tính Tạm nghỉ (BR-MEM-05).
        Trước khi chốt, đối tượng tính lại theo dữ liệu hiện tại; sau khi chốt chỉ còn các bản ghi. Buổi sinh hoạt không có ngày, bỏ trống `day`.
        `allowedActions`: `MARK`, `SHOW_QR`, `CLOSE` chỉ có khi khung điểm danh đã mở (từ `opensAt`) và chưa chốt.

        Lỗi:
        - 400 `VALIDATION` (bộ lọc `status` không hợp lệ).
        - 403 `FORBIDDEN`, `NOT_A_MEMBER`.
        - 404 `SESSION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceFilter' }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Danh sách điểm danh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/sessions/{sessionId}/attendance/records/{userId}:
    put:
      tags: [ATT]
      operationId: markSessionAttendance
      summary: Điểm danh tay một người (FR-ATT-07)
      description: |
        Chỉ người phụ trách buổi (người tạo, ban chủ nhiệm, Trưởng ban, Phó ban của ban đó; còn Thử việc hoặc Chính thức). Ghi mới hoặc đổi trạng thái; mỗi người tối đa một bản ghi cho mỗi buổi (BR-ATT-01).
        Người không thuộc đối tượng (thành viên CLB, kể cả Tạm nghỉ) được ghi kèm cờ `extra` (người phát sinh).
        Gửi `version` của bản ghi đang thấy, chưa có bản ghi thì gửi 0; lệch thì 409.

        Lỗi:
        - 400 `VALIDATION` (trạng thái, ngày).
        - 403 `FORBIDDEN` (kèm lý do), `CSRF`.
        - 404 `SESSION_NOT_FOUND`, `MEMBER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `ATTENDANCE_NOT_OPEN` (kèm giờ mở), `ATTENDANCE_CLOSED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAttendanceRequest' }
      responses:
        '200':
          description: Dòng điểm danh sau khi ghi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/sessions/{sessionId}/attendance/candidates:
    get:
      tags: [ATT]
      operationId: listSessionAttendanceCandidates
      summary: Thành viên có thể thêm làm người phát sinh (FR-ATT-07)
      description: |
        Chỉ người được điểm danh. Thành viên CLB (Thử việc, Chính thức, Tạm nghỉ) chưa có trong danh sách; tối đa 20 người, chỉ tên và ban.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `SESSION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Thành viên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/sessions/{sessionId}/attendance/code:
    get:
      tags: [ATT]
      operationId: getSessionAttendanceCode
      summary: Mã QR điểm danh của chu kỳ hiện tại (FR-ATT-05)
      description: |
        Chỉ người phụ trách buổi (người tạo, ban chủ nhiệm, Trưởng ban, Phó ban của ban đó; còn Thử việc hoặc Chính thức).
        Mã chỉ cấp từ `opensAt` tới khi chốt (BR-ATT-02); đổi mới mỗi chu kỳ `refreshSeconds` (mặc định 30 giây, SRS 9.2), gọi lại trong cùng chu kỳ trả đúng mã cũ.
        Phản hồi kèm `Cache-Control: no-store`. Người tham gia quét mã bằng `POST …/attendance/check-ins` (FR-ATT-06).

        Lỗi:
        - 403 `FORBIDDEN` (kèm lý do), `NOT_A_MEMBER`.
        - 404 `SESSION_NOT_FOUND`.
        - 422 `ATTENDANCE_NOT_OPEN` (kèm giờ mở), `ATTENDANCE_CLOSED`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Mã QR hiện tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/sessions/{sessionId}/attendance/check-ins:
    post:
      tags: [ATT]
      operationId: checkInSessionAttendance
      summary: Tự điểm danh bằng mã QR đang chiếu (FR-ATT-06)
      description: |
        Người tham gia quét mã QR của buổi trên ứng dụng Android hoặc mục Quét mã điểm danh trên web. Kiểm tra theo thứ tự:
        1. Đăng nhập (401).
        2. `code` khớp mã của chu kỳ hiện tại hoặc chu kỳ liền trước của đúng buổi; sai, hết hạn, không có
           buổi hoặc không đúng CLB đều trả 422 `INVALID_CODE` (không lộ buổi có tồn tại hay không).
        3. Người quét là thành viên CLB (Thử việc, Chính thức, Tạm nghỉ); không thì 403 `NOT_A_MEMBER`.
        4. Bảng đã chốt: 422 `ATTENDANCE_CLOSED`. Chưa tới giờ mở: 422 `ATTENDANCE_NOT_OPEN`.

        Quét sau giờ bắt đầu của buổi ghi `LATE`, còn lại `PRESENT`;
        cách ghi `QR`. Người không thuộc đối tượng được ghi là người phát sinh (FR-ATT-07).
        Mỗi người một bản ghi (BR-ATT-01): đã có bản ghi thì trả 200 với bản ghi cũ và `alreadyRecorded: true`, không ghi đè, kể cả
        khi bản ghi cũ là `EXCUSED`, `ABSENT` do người phụ trách ghi (giao diện báo người quét nhờ người phụ trách sửa).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCheckInRequest' }
      responses:
        '200':
          description: Đã điểm danh từ trước; trả bản ghi cũ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCheckIn' }
        '201':
          description: Đã ghi Có mặt hoặc Đi muộn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCheckIn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/sessions/{sessionId}/attendance/transitions:
    post:
      tags: [ATT]
      operationId: closeSessionAttendance
      summary: Chốt điểm danh (FR-ATT-08, phần chốt)
      description: |
        Chỉ người phụ trách buổi. Người thuộc đối tượng mà chưa có bản ghi được ghi Vắng không phép; sau khi chốt danh sách chỉ xem được
        và mã QR hết hiệu lực (BR-ATT-02). Gửi `version` của danh sách đang thấy; lệch thì 409 để số người bị ghi Vắng luôn đúng.
        Sửa sau chốt (phần còn lại của FR-ATT-08) chưa có.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `FORBIDDEN` (kèm lý do), `CSRF`.
        - 404 `SESSION_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `ATTENDANCE_NOT_OPEN`, `ATTENDANCE_CLOSED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAttendanceRequest' }
      responses:
        '200':
          description: Danh sách sau khi chốt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance:
    get:
      tags: [ATT]
      operationId: getEventAttendance
      summary: Danh sách điểm danh của một ngày sự kiện (FR-ATT-07)
      description: |
        Chỉ ban chủ nhiệm và nhân sự BTC đang hoạt động (Trưởng BTC, trưởng tiểu ban, nhân sự tiểu ban). Đối tượng: người đăng ký ở trạng thái Nhận chỗ.
        Trước khi chốt, đối tượng tính lại theo dữ liệu hiện tại; sau khi chốt chỉ còn các bản ghi. Sự kiện nhiều ngày điểm danh theo từng ngày; `day` bắt buộc khi ghi, khi đọc bỏ trống thì máy chủ chọn hôm nay (nếu thuộc sự kiện), ngày đầu (chưa tới) hoặc ngày cuối (đã qua).
        `allowedActions`: `MARK`, `SHOW_QR`, `CLOSE` chỉ có khi khung điểm danh đã mở (từ `opensAt`) và chưa chốt.

        Lỗi:
        - 400 `VALIDATION` (ngày không thuộc sự kiện, bộ lọc `status` không hợp lệ).
        - 403 `FORBIDDEN`.
        - 404 `EVENT_NOT_FOUND`.
        - 422 `ATTENDANCE_UNAVAILABLE` (sự kiện chưa duyệt hoặc đã hủy). Sự kiện Đã đóng vẫn trả 200, kèm `readOnlyReason` và `allowedActions` rỗng.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: day
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceFilter' }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Danh sách điểm danh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance/records/{userId}:
    put:
      tags: [ATT]
      operationId: markEventAttendance
      summary: Điểm danh tay một người (FR-ATT-07)
      description: |
        Chỉ ban chủ nhiệm và nhân sự BTC đang hoạt động (Trưởng BTC, trưởng tiểu ban, nhân sự tiểu ban). Ghi mới hoặc đổi trạng thái; mỗi người tối đa một bản ghi cho mỗi ngày (BR-ATT-01).
        Người không thuộc đối tượng (thành viên CLB, kể cả Tạm nghỉ) được ghi kèm cờ `extra` (người phát sinh).
        Gửi `version` của bản ghi đang thấy, chưa có bản ghi thì gửi 0; lệch thì 409.

        Lỗi:
        - 400 `VALIDATION` (trạng thái, ngày).
        - 403 `FORBIDDEN` (kèm lý do), `CSRF`.
        - 404 `EVENT_NOT_FOUND`, `MEMBER_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `ATTENDANCE_NOT_OPEN` (kèm giờ mở), `ATTENDANCE_CLOSED`, `ATTENDANCE_UNAVAILABLE`, `EVENT_READ_ONLY`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAttendanceRequest' }
      responses:
        '200':
          description: Dòng điểm danh sau khi ghi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance/candidates:
    get:
      tags: [ATT]
      operationId: listEventAttendanceCandidates
      summary: Thành viên có thể thêm làm người phát sinh (FR-ATT-07)
      description: |
        Chỉ người được điểm danh và là thành viên CLB (tên, ban chỉ người cùng CLB xem được, SRS 3.5). Thành viên CLB (Thử việc, Chính thức, Tạm nghỉ) chưa có trong danh sách; tối đa 20 người, chỉ tên và ban.
        Lỗi: 400 `VALIDATION`; 403 `FORBIDDEN`; 404 `EVENT_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: day
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Thành viên.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance/code:
    get:
      tags: [ATT]
      operationId: getEventAttendanceCode
      summary: Mã QR điểm danh của một ngày sự kiện, chu kỳ hiện tại (FR-ATT-05)
      description: |
        Chỉ ban chủ nhiệm và nhân sự BTC đang hoạt động (Trưởng BTC, trưởng tiểu ban, nhân sự tiểu ban). Mỗi ngày của sự kiện có mã riêng;
        bỏ trống `day` thì máy chủ chọn ngày như khi đọc danh sách.
        Mã chỉ cấp từ `opensAt` của ngày đó tới khi chốt (BR-ATT-02); đổi mới mỗi chu kỳ `refreshSeconds` (mặc định 30 giây, SRS 9.2), gọi lại trong cùng chu kỳ trả đúng mã cũ.
        Phản hồi kèm `Cache-Control: no-store`. Người tham gia quét mã bằng `POST …/attendance/check-ins` (FR-ATT-06).

        Lỗi:
        - 400 `VALIDATION` (ngày không thuộc sự kiện).
        - 403 `FORBIDDEN` (kèm lý do).
        - 404 `EVENT_NOT_FOUND`.
        - 422 `ATTENDANCE_NOT_OPEN` (kèm giờ mở), `ATTENDANCE_CLOSED`, `ATTENDANCE_UNAVAILABLE`, `EVENT_READ_ONLY`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
        - name: day
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Mã QR hiện tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance/check-ins:
    post:
      tags: [ATT]
      operationId: checkInEventAttendance
      summary: Tự điểm danh bằng mã QR đang chiếu (FR-ATT-06)
      description: |
        Người tham gia quét mã QR của sự kiện trên ứng dụng Android hoặc mục Quét mã điểm danh trên web. Kiểm tra theo thứ tự:
        1. Đăng nhập (401).
        2. `code` khớp mã của chu kỳ hiện tại hoặc chu kỳ liền trước của đúng sự kiện và ngày; sai, hết hạn, không có
           sự kiện hoặc sự kiện chưa duyệt, đã hủy đều trả 422 `INVALID_CODE` (không lộ sự kiện có tồn tại hay không).
        3. Người quét là thành viên CLB (Thử việc, Chính thức, Tạm nghỉ); không thì 403 `NOT_A_MEMBER`.
        4. Bảng đã chốt hoặc sự kiện đã đóng: 422 `ATTENDANCE_CLOSED`. Chưa tới giờ mở: 422 `ATTENDANCE_NOT_OPEN`.

        Quét sau giờ bắt đầu của ngày đó (ngày sau của sự kiện nhiều ngày dùng cùng giờ bắt đầu) ghi `LATE`, còn lại `PRESENT`;
        cách ghi `QR`. Người không thuộc đối tượng được ghi là người phát sinh (FR-ATT-07).
        Mỗi người một bản ghi (BR-ATT-01): đã có bản ghi thì trả 200 với bản ghi cũ và `alreadyRecorded: true`, không ghi đè, kể cả
        khi bản ghi cũ là `EXCUSED`, `ABSENT` do người phụ trách ghi (giao diện báo người quét nhờ người phụ trách sửa).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceCheckInRequest' }
      responses:
        '200':
          description: Đã điểm danh từ trước; trả bản ghi cũ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCheckIn' }
        '201':
          description: Đã ghi Có mặt hoặc Đi muộn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceCheckIn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/events/{eventId}/attendance/transitions:
    post:
      tags: [ATT]
      operationId: closeEventAttendance
      summary: Chốt điểm danh (FR-ATT-08, phần chốt)
      description: |
        Chỉ Trưởng BTC và ban chủ nhiệm. Người thuộc đối tượng mà chưa có bản ghi được ghi Vắng không phép; sau khi chốt danh sách chỉ xem được
        và mã QR hết hiệu lực (BR-ATT-02). Gửi `version` của danh sách đang thấy; lệch thì 409 để số người bị ghi Vắng luôn đúng.
        Sửa sau chốt (phần còn lại của FR-ATT-08) chưa có.

        Lỗi:
        - 400 `VALIDATION`.
        - 403 `FORBIDDEN` (kèm lý do), `CSRF`.
        - 404 `EVENT_NOT_FOUND`.
        - 409 `VERSION_CONFLICT`.
        - 422 `ATTENDANCE_NOT_OPEN`, `ATTENDANCE_CLOSED`, `ATTENDANCE_UNAVAILABLE`, `EVENT_READ_ONLY`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAttendanceRequest' }
      responses:
        '200':
          description: Danh sách sau khi chốt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceSheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/funds:
    get:
      tags: [FIN]
      operationId: listFunds
      summary: Các quỹ người gọi được xem (FR-FIN-06)
      description: |
        Quỹ chung đứng đầu, rồi quỹ sự kiện theo ngày bắt đầu sự kiện giảm dần. Quỹ chung: mọi thành viên;
        quỹ sự kiện: ban chủ nhiệm và BTC của sự kiện (SRS 3.5). Số dư tính tại thời điểm đọc (BR-FIN-02).

        Lỗi: 403 `NOT_A_MEMBER`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/FundKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FundStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang quỹ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/funds/{fundId}:
    get:
      tags: [FIN]
      operationId: getFund
      summary: Chi tiết quỹ, số dư và thao tác được phép (FR-FIN-06)
      description: |
        `allowedActions`: `RECORD_INCOME` (Thủ quỹ, quỹ đang mở); `PROPOSE_EXPENSE` (ban chủ nhiệm ở mọi quỹ, Trưởng ban,
        Phó ban ở Quỹ chung, Trưởng BTC ở quỹ sự kiện của mình; quỹ đang mở); `VIEW_REQUESTS` (người đề xuất được, ban chủ nhiệm,
        Trưởng BTC với quỹ sự kiện của mình: hiện danh sách khoản chi); `SETTLE` (Thủ quỹ, quỹ sự kiện đang mở, sự kiện Đã kết thúc
        hoặc Đã hủy, không còn khoản treo). `PROPOSE_ADVANCE` như `PROPOSE_EXPENSE` (FR-FIN-07); `VIEW_ADVANCES` (ban chủ nhiệm,
        người đề xuất được, Trưởng BTC với quỹ sự kiện của mình, người đã có tạm ứng ở quỹ: hiện tab Tạm ứng).

        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN` (quỹ sự kiện mà không thuộc BTC hay ban chủ nhiệm); 404 `FUND_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/FundId'
      responses:
        '200':
          description: Chi tiết quỹ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/advances:
    get:
      tags: [FIN]
      operationId: listAdvances
      summary: Danh sách tạm ứng (FR-FIN-07)
      description: |
        Chỉ trả tạm ứng người gọi xem được: ban chủ nhiệm xem hết; Trưởng BTC xem tạm ứng ở quỹ sự kiện của mình; người ứng xem
        của mình (SRS 3.5). Có `fundId` thì cần `VIEW_ADVANCES` ở quỹ đó. `overdue=true`: Đã ứng hoặc Quyết toán một phần mà qua
        hạn quyết toán (BR-FIN-05). Mới trước.
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `FUND_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: fundId, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/AdvanceStatus' } }
        - { name: mine, in: query, required: false, schema: { type: boolean } }
        - { name: overdue, in: query, required: false, schema: { type: boolean } }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang tạm ứng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvancePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [FIN]
      operationId: proposeAdvance
      summary: Đề xuất tạm ứng (FR-FIN-07)
      description: |
        Người đề xuất chi được ở quỹ đó (như `createTransaction` loại `EXPENSE`). Quỹ đang mở. Số tiền nguyên dương tối đa
        1.000.000.000 (BR-FIN-04); mục đích 5–500 ký tự; hạng mục chi; hạn quyết toán từ hôm nay tới 90 ngày (giao diện điền
        sẵn hôm nay cộng `advanceSettleDays`). Người đang có tạm ứng quá hạn ở CLB bị chặn (BR-FIN-05), câu báo nêu khoản đó.
        Người duyệt được ở quỹ nhận thông báo, đích `ADVANCE`.
        Thứ tự kiểm: 400 `fundId`, 403, 422 `FUND_SETTLED`, 422 `ADVANCE_OVERDUE`, 400 các ô khác.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 422 `FUND_SETTLED`, `ADVANCE_OVERDUE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeAdvanceRequest' }
      responses:
        '201':
          description: Tạm ứng vừa đề xuất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/advances/{advanceId}:
    get:
      tags: [FIN]
      operationId: getAdvance
      summary: Chi tiết tạm ứng (FR-FIN-07)
      description: |
        Quyền xem như `listAdvances`; mở từ thông báo cũng kiểm lại (BR-SEC-02).
        Lỗi: 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `ADVANCE_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: advanceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Chi tiết tạm ứng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/advances/{advanceId}/transitions:
    post:
      tags: [FIN]
      operationId: transitionAdvance
      summary: Duyệt, từ chối, ghi Đã ứng (FR-FIN-07, ST-ADV)
      description: |
        - `APPROVE`, `REJECT`: người duyệt chi được ở quỹ (`APPROVE_EXPENSE`; Trưởng BTC không có, BR-ACL-05); người ứng không tự
          duyệt (403 `SELF_APPROVAL`); chỉ khi Đề xuất; từ chối cần lý do 5–500 ký tự. Duyệt thì báo người ứng và người giữ sổ;
          từ chối thì báo người ứng kèm lý do.
        - `APPROVE` khi quỹ đã quyết toán: 422 `FUND_SETTLED`.
        - `DISBURSE`: `RECORD_LEDGER`; chỉ khi Đã duyệt; quỹ đang mở; số tiền không vượt số dư (422 `INSUFFICIENT_BALANCE` nêu
          số dư còn lại, BR-FIN-08); `disbursedOn` không sau hôm nay, bỏ trống là hôm nay. Sinh khoản chi Đã ghi sổ gắn với tạm
          ứng, người duyệt của khoản chi là người duyệt tạm ứng, người ghi sổ là người ghi Đã ứng. Báo người ứng kèm hạn.
        - Việc theo giờ: nhắc người ứng khi còn 2 ngày tới hạn quyết toán; quá hạn thì báo một lần cho người ứng và người giữ sổ.
        Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`, `SELF_APPROVAL`; 404 `ADVANCE_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `INVALID_TRANSITION`, `FUND_SETTLED`, `INSUFFICIENT_BALANCE`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: advanceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceTransitionRequest' }
      responses:
        '200':
          description: Tạm ứng sau thao tác.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/advances/{advanceId}/settlement-lines:
    post:
      tags: [FIN]
      operationId: submitAdvanceSettlementLine
      summary: Nộp chứng từ quyết toán tạm ứng (FR-FIN-08)
      description: |
        Chỉ người ứng; tạm ứng ở `DISBURSED` hoặc `PARTIALLY_SETTLED`. Nộp được nhiều lần, mỗi lần một khoản đã chi kèm ít nhất
        một chứng từ (tải trước qua `POST /clubs/{clubId}/transaction-attachments`; người đang giữ tiền tạm ứng tải được), chứng từ
        chưa dùng ở giao dịch hay lần nộp khác. Báo người giữ sổ. Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION` (`amount`, `description`, `spentOn`, `attachmentIds`); 403 `NOT_A_MEMBER`, `FORBIDDEN`;
        404 `ADVANCE_NOT_FOUND`; 409 `VERSION_CONFLICT`; 422 `INVALID_TRANSITION`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: advanceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitSettlementLineRequest' }
      responses:
        '201':
          description: Tạm ứng sau khi nộp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/advances/{advanceId}/settlement-lines/{lineId}/decision:
    post:
      tags: [FIN]
      operationId: decideAdvanceSettlementLine
      summary: Xác nhận hoặc trả lại một lần nộp chứng từ (FR-FIN-08)
      description: |
        `RECORD_LEDGER`. Chỉ lần nộp đang `SUBMITTED`. `CONFIRM` cộng vào số đã quyết toán, tạm ứng Đã ứng sang Quyết toán một
        phần. `RETURN` cần ghi chú 5–500 ký tự; người ứng nộp lại bằng lần nộp mới. Báo người ứng. `version` là phiên bản tạm
        ứng. Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `ADVANCE_NOT_FOUND`, `LINE_NOT_FOUND`;
        409 `VERSION_CONFLICT`; 422 `INVALID_TRANSITION`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: advanceId, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementLineDecisionRequest' }
      responses:
        '200':
          description: Tạm ứng sau quyết định.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/advances/{advanceId}/closure:
    post:
      tags: [FIN]
      operationId: closeAdvance
      summary: Chốt quyết toán tạm ứng (FR-FIN-08)
      description: |
        `RECORD_LEDGER`; tạm ứng ở `DISBURSED` hoặc `PARTIALLY_SETTLED`; không còn lần nộp chờ xác nhận (422
        `ADVANCE_HAS_PENDING_LINES` kèm số lần); quỹ đang mở. Đối chiếu số đã ứng với tổng đã xác nhận:
        - thừa: ghi điều chỉnh tăng quỹ Đã ghi sổ "Hoàn tạm ứng", tham chiếu khoản chi ứng, ngày là `refundOn` (từ ngày ứng tới
          hôm nay, bỏ trống là hôm nay);
        - thiếu: tạo khoản chi `PROPOSED` đứng tên người ứng, kèm chứng từ các lần đã xác nhận, đi qua duyệt và ghi sổ như khoản
          chi thường (người ứng không tự duyệt); báo người duyệt;
        - khớp: không sinh giao dịch.
        Tạm ứng sang `SETTLED`, báo người ứng. Thứ tự kiểm: 403, 409, 422, 400.
        Lỗi: 400 `VALIDATION` (`refundOn`); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `ADVANCE_NOT_FOUND`; 409 `VERSION_CONFLICT`;
        422 `INVALID_TRANSITION`, `ADVANCE_HAS_PENDING_LINES`, `FUND_SETTLED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: advanceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseAdvanceRequest' }
      responses:
        '200':
          description: Tạm ứng đã quyết toán.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /clubs/{clubId}/dues-campaigns:
    get:
      tags: [FIN]
      operationId: listDuesCampaigns
      summary: Đợt đóng quỹ của CLB (FR-FIN-09)
      description: |
        Ban chủ nhiệm (SRS 3.5). Mọi route đóng quỹ đều cần thuộc ban chủ nhiệm, kể cả thao tác cần `RECORD_LEDGER`: người
        được bảng phân quyền cấp `RECORD_LEDGER` mà không thuộc ban chủ nhiệm vẫn nhận 403. Đợt đang mở trước, rồi đợt mới mở
        trước. Mỗi đợt kèm tiến độ thu.
        Lỗi: 400 `VALIDATION` (`status`); 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DuesCampaignStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang đợt đóng quỹ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesCampaignPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [FIN]
      operationId: openDuesCampaign
      summary: Mở đợt đóng quỹ (FR-FIN-09)
      description: |
        `RECORD_LEDGER` (mặc định Thủ quỹ). Tên kỳ 3–100 ký tự; mức nguyên dương tối đa 1.000.000.000; hạn nộp từ hôm nay.
        Danh sách chụp thành viên Thử việc, Chính thức lúc mở (họ tên, ban, mức phải đóng không đổi theo hồ sơ về sau,
        BR-DATA-02). `exemptions`: mỗi người một lần, thuộc danh sách; lý do 5–500 ký tự; `REDUCED` có `amount` từ 1 tới dưới
        mức đóng (400 theo ô `exemptions[i].…`). Báo từng người còn phải đóng, nội dung có kỳ, mức của họ, hạn.
        Thứ tự kiểm: 403, 400.
        Lỗi: 400 `VALIDATION`; 403 `NOT_A_MEMBER`, `FORBIDDEN`; 404 `CLUB_NOT_FOUND`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDuesRequest' }
      responses:
        '201':
          description: Đợt vừa mở.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesCampaignDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clubs/{clubId}/dues-candidates:
    get:
      tags: [FIN]
      operationId: listDuesCandidates
      summary: Thành viên phải đóng quỹ, để chọn người miễn giảm (FR-FIN-09)
